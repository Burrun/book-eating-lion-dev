server {
    listen 80;
    server_name localhost;

    # 1. 프론트엔드 정적 파일 제공 및 SPA 라우팅 (새로고침 404 방지)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # /api/* 는 상위 게이트웨이(nginx/default.conf)가 먼저 각 서비스로 라우팅하므로
    # 여기까지 도달하지 않는다. 과거 모놀리식 backend:8080 을 가리키던 프록시
    # 블록은 존재하지 않는 호스트명이라 설정 로드 시점에 nginx 기동 자체가
    # 실패해 제거했다.
}