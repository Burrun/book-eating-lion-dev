# Route 53 Private Hosted Zone의 DB FQDN을 클러스터 내부 이름으로 노출한다.
# Pod 는 이 Service 이름만 바라보고, 실제 DB 주소 변경은 Route 53 레코드가 흡수한다.
#
# 클러스터는 1개다.
#   원래는 ai_db 만 별도 클러스터(Serverless v2)로 뺐었다. 근거는 두 가지였는데
#   둘 다 없어졌다 —
#     ① pgvector 가 필요하다        -> 벡터를 전부 S3 Vectors 로 옮겨서 불필요
#     ② auto-pause 로 과금 독립     -> ①이 사라지자 클러스터 하나를 더 띄울 값을 못 한다
#
#   격리는 클러스터가 아니라 **스키마 4분할 + 서비스별 계정 권한**이 만든다.
#   catalog_svc 로 order_db 를 조회하면 여전히 permission denied 다. 그게 실질적인
#   경계이고, 클러스터를 가르는 건 그 위에 얹는 비용 문제였을 뿐이다.
#
# 엔진은 PostgreSQL. 스키마: catalog_db / order_db / member_db / ai_db.
#
# Terraform 01-data가 환경별 VPC 전용 Private Hosted Zone을 만든다.
#   dev  : writer/reader.db.dev.internal.ajttk.com -> EC2 PostgreSQL
#   prod : writer.db.prod.internal.ajttk.com        -> RDS Proxy
#          reader.db.prod.internal.ajttk.com        -> Aurora Reader
apiVersion: v1
kind: Service
metadata:
  name: db-primary-service
  namespace: lion-db
spec:
  type: ExternalName
  externalName: "writer.db.${DEPLOY_ENV}.internal.ajttk.com"
  ports:
    - port: 5432
      protocol: TCP
---
# 읽기 95% 인 catalog 는 Reader 로 라우팅한다(§2 읽기/쓰기 비대칭).
apiVersion: v1
kind: Service
metadata:
  name: db-reader-service
  namespace: lion-db
spec:
  type: ExternalName
  externalName: "reader.db.${DEPLOY_ENV}.internal.ajttk.com"
  ports:
    - port: 5432
      protocol: TCP
