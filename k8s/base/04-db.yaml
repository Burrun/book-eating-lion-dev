# Aurora 엔드포인트를 클러스터 내부 이름으로 노출한다.
# Pod 는 이 이름만 바라보며, Aurora 주소가 바뀌어도 여기만 고치면 된다.
#
# 클러스터는 1개다.
#   원래는 ai_db 만 별도 클러스터(Serverless v2)로 뺐었다. 근거는 두 가지였는데
#   둘 다 없어졌다 —
#     ① pgvector 가 필요하다        -> 벡터를 전부 S3 Vectors 로 옮겨서 불필요
#     ② auto-pause 로 과금 독립     -> ①이 사라지자 클러스터 하나를 더 띄울 값을 못 한다
#
#   격리는 클러스터가 아니라 **스키마 4분할 + 서비스별 계정 권한**이 만든다.
#   catalog_svc 로 order_db 를 조회하면 여전히 permission denied 다. 그게 실질적인
#   경계이고, 클러스터를 가르는 건 그 위에 얹는 비용 문제였을 뿐이다.
#
# 엔진은 PostgreSQL. 스키마: catalog_db / order_db / member_db / ai_db.
#
# --- 엔드포인트 값 용도 (2026-08-13) ---
# AURORA_ENDPOINT / AURORA_READER_ENDPOINT
#   최종 목표. Terraform 으로 Aurora(RDS)를 프로비저닝하면 그 출력값을 여기에 채운다.
#   아직 Terraform/인프라가 준비되지 않아 비어 있다.
# TEST_DB_ENDPOINT (main-cd.yml 의 base job env 에 선언, 아직 이 파일에서는 미사용)
#   비용 절감을 위해 Aurora 대신 EC2 위에 Docker 로 직접 띄운 Postgres 를 임시로
#   쓸 때의 엔드포인트(EC2 프라이빗 IP/DNS). 인프라가 갖춰지기 전까지 값을 미리
#   추적해두는 용도이며, 아래 externalName 은 여전히 AURORA_ENDPOINT 를 가리킨다 —
#   실제로 EC2 Postgres 로 전환하기로 확정되면 이 줄을 ${TEST_DB_ENDPOINT} 로
#   바꾸거나, db-primary-service 를 그대로 두고 이름을 바꾼 새 Service 를 추가한다.
apiVersion: v1
kind: Service
metadata:
  name: db-primary-service
  namespace: lion-db
spec:
  type: ExternalName
  externalName: "${AURORA_ENDPOINT}"
  ports:
    - port: 5432
      protocol: TCP
---
# 읽기 95% 인 catalog 는 Reader 로 라우팅한다(§2 읽기/쓰기 비대칭).
apiVersion: v1
kind: Service
metadata:
  name: db-reader-service
  namespace: lion-db
spec:
  type: ExternalName
  externalName: "${AURORA_READER_ENDPOINT}"
  ports:
    - port: 5432
      protocol: TCP
