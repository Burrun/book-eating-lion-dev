# dev/prod 가 같은 Karpenter 노드풀을 공유한다. HPA maxReplicas 는 dev/prod 동일하게
# 하드코딩돼 있다(k8s/*/hpa*.yaml — envsubst 로 바뀌는 건 namespace 뿐, maxReplicas 는
# 안 갈린다). 5개 서비스가 전부 동시에 maxReplicas 까지 차면(catalog 20 + order 30 +
# member 6 + ai-rag 6 + ai-bot 10, 각 컨테이너 limits 기준) 한 네임스페이스 혼자서
# 최대 ~55 cpu / ~74Gi 까지 공유 노드풀을 잡아먹을 수 있다 — dev 에서 k6 부하테스트로
# 이 상태에 도달하면 prod 가 스케줄될 자리가 없어진다.
#
# 이 쿼터는 dev/prod 양쪽에 같은 값을 적용한다. dev 만 따로 낮추려면 환경별 값을
# envsubst 로 주입해야 하는데, 그러려면 main-cd.yml 의 VARS 목록에 새 변수를 추가해야
# 하고 그건 또 "안 넣어서 빈 값" 사고 유형이다(오늘 이미 두 번 겪었다). 대신 prod 의
# 실사용량(2026-08-31 실측: catalog 11 replica 기준 총 request ~4.75 cpu / ~9.25Gi)에
# 여유를 넉넉히 두고, 위 이론상 최댓값(~55 cpu / ~74Gi)보단 확실히 낮게 잡는다 — dev 가
# 폭주하면 이 천장에 막히고, prod 실사용은 전혀 안 걸린다.
#
# 나중에 prod 트래픽이 커져 이 값에 근접하면(예: catalog 가 실제로 20 replica 근처까지
# 늘 만큼 성장하면) 그때 올린다 — 일반적인 용량 계획과 같다.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: shared-nodepool-guard
  namespace: ${K8S_NAMESPACE}
spec:
  hard:
    requests.cpu: "12"
    requests.memory: 24Gi
    limits.cpu: "24"
    limits.memory: 40Gi
    # 파드 수 자체도 막아둔다 — HPA maxReplicas 를 잘못 키우는 실수(예: 20 → 200)가
    # 나도 cpu/memory 쿼터보다 먼저 걸리게 하는 백스톱이다. 현재 5개 서비스
    # maxReplicas 합(20+30+6+6+10=72)보다는 낮고, 정상 운영 범위보다는 넉넉하다.
    count/pods: "60"
