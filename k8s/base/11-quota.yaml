# dev/prod 가 같은 Karpenter 노드풀을 공유한다. 이 쿼터는 그 노드풀을 한
# 네임스페이스가 독식하는 걸 막는다 — dev 에서 k6 부하테스트로 폭주해도 prod 가
# 스케줄될 자리가 남아야 한다.
#
# 지켜야 할 불변식:
#
#   quota >= Σ(서비스별 HPA maxReplicas × pod 요청량) + 롤링 서지 여유
#
# 이게 깨지면 배포가 막힌다. 전 서비스가 maxSurge:1/maxUnavailable:0 이라 롤링
# 업데이트는 새 pod 1개가 먼저 떠야 시작되는데, HPA 가 quota 를 끝까지 채워두면
# 그 1개가 admission 에서 거절된다 -> rollout 이 진행되지 않고 main-cd 의 600s
# 타임아웃에 걸려 Rollback on failure 가 방금 배포한 이미지를 되돌린다
# (2026-09-02 catalog 배포가 이 경로로 실패했다). quota 를 조이면 아끼는 것은
# 없고 — 실제로 pod 가 뜨지 않으면 Karpenter 는 노드를 만들지 않는다 — 대신
# 천장에 닿는 순간 배포 능력을 잃는다.
#
# 값은 scripts/load-deployment-config.sh 가 환경별로 주입한다. HPA maxReplicas
# 와 같은 자리에 두었으니 한쪽을 바꿀 때 다른 쪽을 같이 본다.
#
# 뒤에 Karpenter NodePool limits(cpu 100)가 한 겹 더 있다. dev+prod 를 합쳐도
# 그 아래라 이 쿼터가 항상 먼저 걸린다.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: shared-nodepool-guard
  namespace: ${K8S_NAMESPACE}
spec:
  hard:
    requests.cpu: "${QUOTA_REQUESTS_CPU}"
    requests.memory: ${QUOTA_REQUESTS_MEMORY}
    limits.cpu: "${QUOTA_LIMITS_CPU}"
    limits.memory: ${QUOTA_LIMITS_MEMORY}
    # 파드 수 자체도 막아둔다 — HPA maxReplicas 를 잘못 키우는 실수(예: 20 → 200)가
    # 나도 cpu/memory 쿼터보다 먼저 걸리게 하는 백스톱이다.
    count/pods: "${QUOTA_MAX_PODS}"
