# 이 파일에는 실제 값이 들어가지 않는다.
# CD 워크플로가 GitHub Secrets 로 envsubst 치환한 뒤 apply 한다.
#
# 계정이 서비스별로 나뉜 것이 MSA 전환의 핵심 장치다(판단 ②).
# 각 계정은 자기 스키마에만 USAGE 권한이 있어서, 남의 테이블에 조인을 걸면
# 런타임에 즉시 권한 에러가 난다 — 경계 침범이 코드 리뷰가 아니라 DB 가 잡는다.
apiVersion: v1
kind: Secret
metadata:
  name: catalog-secret
  namespace: ${K8S_NAMESPACE}
type: Opaque
stringData:
  DB_USERNAME: "${CATALOG_DB_USERNAME}"
  DB_PASSWORD: "${CATALOG_DB_PASSWORD}"
---
apiVersion: v1
kind: Secret
metadata:
  name: order-secret
  namespace: ${K8S_NAMESPACE}
type: Opaque
stringData:
  DB_USERNAME: "${ORDER_DB_USERNAME}"
  DB_PASSWORD: "${ORDER_DB_PASSWORD}"
  # backend/apps/order-api 의 base application.yml 이 기본값 없이 요구한다
  # (kakaopay.secret-key: ${KAKAOPAY_SECRET_KEY}) — 이전까지는 이 키 자체가
  # k8s/order, k8s/base 어디에도 없어서 order-service 가 어떤 프로파일로도
  # 기동할 수 없었다(k8s/test 환경 구성 중 발견). 제3자(카카오페이) API 키라
  # Terraform 대상은 아니고, GitHub Secrets 에 값을 채워야 한다.
  KAKAOPAY_SECRET_KEY: "${KAKAOPAY_SECRET_KEY}"
---
apiVersion: v1
kind: Secret
metadata:
  name: member-secret
  namespace: ${K8S_NAMESPACE}
type: Opaque
stringData:
  DB_USERNAME: "${MEMBER_DB_USERNAME}"
  DB_PASSWORD: "${MEMBER_DB_PASSWORD}"
  AWS_COGNITO_CLIENT_ID: "${AWS_COGNITO_CLIENT_ID}"
  AWS_COGNITO_CLIENT_SECRET: "${AWS_COGNITO_CLIENT_SECRET}"
---
# ai 는 같은 클러스터의 다른 스키마다. 계정이 분리돼 있어 다른 스키마를 못 읽는다.
apiVersion: v1
kind: Secret
metadata:
  name: ai-secret
  namespace: ${K8S_NAMESPACE}
type: Opaque
stringData:
  AI_DB_USERNAME: "${AI_DB_USERNAME}"
  AI_DB_PASSWORD: "${AI_DB_PASSWORD}"
