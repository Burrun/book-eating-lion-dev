# 서비스 Pod 의 인/아웃바운드를 필요한 것만 남긴다.
# NetworkPolicy 는 CNI 가 지원해야 적용된다 (EKS 기본 VPC CNI 는 최신 버전에서 지원).
# 지원하지 않는 클러스터에서는 이 리소스가 생성되어도 아무 효과가 없다.
---
# 공통 규칙 — lion-app 의 모든 서비스 Pod 에 적용된다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lion-app-baseline
  namespace: lion-app
spec:
  podSelector:
    matchLabels:
      tier: backend
  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Ingress 컨트롤러에서 오는 트래픽
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system

        # kubelet 의 probe 는 Pod 가 아니라 "노드 IP" 에서 온다.
        # namespaceSelector 로는 절대 매칭되지 않으므로 노드 대역을 따로 열어야 한다.
        # 이 규칙이 빠지면 정책을 강제하는 CNI 에서 전 Pod 가 동시에 NotReady 로 떨어진다.
        - ipBlock:
            cidr: "${VPC_CIDR}"
      ports:
        - protocol: TCP
          port: 8080

    # 같은 네임스페이스의 다른 서비스 (서비스 간 동기 호출)
    - from:
        - podSelector:
            matchLabels:
              tier: backend
      ports:
        - protocol: TCP
          port: 8080

  egress:
    # CoreDNS — K8s Service DNS 로 서로를 찾으므로 필수다(§4 — Eureka 미사용)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # 같은 네임스페이스의 다른 서비스
    - to:
        - podSelector:
            matchLabels:
              tier: backend
      ports:
        - protocol: TCP
          port: 8080

    # Aurora PostgreSQL (5432) + Redis(ElastiCache)
    - ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379

    # S3 / ECR / Bedrock / 외부 HTTPS
    - ports:
        - protocol: TCP
          port: 443

---
# /internal/** 접근 제한 — order-service 의 재고 API 는 catalog-service 만 부른다는
# "의도"였으나, 현재 이 정책은 실질적으로 아무것도 막지 못한다(/code-review 지적사항).
#
# NetworkPolicy 는 같은 Pod 를 여러 정책이 선택하면 각 정책의 규칙이 합집합(OR)으로
# 적용된다 — 이 정책이 더 좁게 허용 목록을 선언해도, lion-app-baseline 이 이미
# order-service(tier: backend)에 "같은 네임스페이스의 모든 backend-tier Pod" +
# "VPC_CIDR 전체"를 8080 포트로 열어두고 있어서(위 파일 39-45번 줄) 그 허용이 그대로
# 살아있다. 즉 member-service/ai-bot/ai-rag 도, VPC 안 어디서든도 /internal/** 에
# 도달할 수 있다 — 이 정책이 있든 없든 결과가 같다.
#
# NetworkPolicy 는 포트 단위로만 필터링하고 HTTP 경로를 못 본다. /internal/** 과
# 공개 API(/api/orders 등)가 같은 8080 포트를 쓰는 한, order-service 를 향한 트래픽을
# "catalog-service 만" 허용하도록 실제로 좁히려면 lion-app-baseline 의 같은 네임스페이스
# 백엔드 간 인그레스 규칙에서 order-service 를 제외하는 구조 변경이 필요하다(현재는
# 하지 않음 — 별도 판단 필요, 그 전까지 SecurityConfig 의
# `.requestMatchers("/internal/**").permitAll()` 을 실질적으로 보호하는 건 없다).
#
# Ingress 에 /internal 경로가 없는 것이 1차 방어선이고, 이 정책은 지금 상태로는
# 2차 방어선 역할을 하지 못한다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: order-internal-allowlist
  namespace: lion-app
spec:
  podSelector:
    matchLabels:
      app: order-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: catalog-service
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - ipBlock:
            cidr: "${VPC_CIDR}"
      ports:
        - protocol: TCP
          port: 8080
