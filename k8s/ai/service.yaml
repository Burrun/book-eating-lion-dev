# Deployment 가 2개이므로 Service 도 2개다.
# Ingress 가 /api/ai/lions → ai-rag, /api/ai/bot → ai-bot 으로 갈라 보내며,
# 이 분기 덕분에 봇 폭주가 RAG Pod 에 전혀 닿지 않는다.

apiVersion: v1
kind: Service
metadata:
  name: ai-rag
  namespace: ${K8S_NAMESPACE}
  labels:
    app: ai-rag
spec:
  type: ClusterIP
  selector:
    app: ai-rag
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: ai-bot
  namespace: ${K8S_NAMESPACE}
  labels:
    app: ai-bot
spec:
  type: ClusterIP
  selector:
    app: ai-bot
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
