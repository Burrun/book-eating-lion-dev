# Deployment 가 2개이므로 Service 도 2개다.
# Ingress 가 /api/ai/lions → ai-rag, /api/ai/bot → ai-bot 으로 갈라 보내며,
# 이 분기 덕분에 봇 폭주가 RAG Pod 에 전혀 닿지 않는다.
#
# 계획서 §7.3 은 "Service 4개"라고 적었지만, 경로 라우팅으로 두 워크로드를
# 실제로 분리하려면 Service 도 갈라야 한다. 하나의 Service 가 두 Deployment 의
# Pod 를 모두 셀렉트하면 부하가 다시 섞여서 분리한 의미가 사라진다.
apiVersion: v1
kind: Service
metadata:
  name: ai-rag
  namespace: lion-app
  labels:
    app: ai-rag
spec:
  type: ClusterIP
  selector:
    app: ai-rag
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: ai-bot
  namespace: lion-app
  labels:
    app: ai-bot
spec:
  type: ClusterIP
  selector:
    app: ai-bot
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
