# IRSA용 ServiceAccount 2개. terraform/modules/compute/ai_service_iam 의 IAM Role
# 신뢰 정책이 정확히 이 두 이름(namespace:lion-app, name:ai-rag/ai-bot)만
# AssumeRoleWithWebIdentity를 허용하므로 이름을 바꾸면 IRSA가 깨진다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-rag
  namespace: lion-app
  annotations:
    eks.amazonaws.com/role-arn: "${AI_SERVICE_IRSA_ARN}"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-bot
  namespace: lion-app
  annotations:
    eks.amazonaws.com/role-arn: "${AI_SERVICE_IRSA_ARN}"
