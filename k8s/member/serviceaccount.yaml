# IRSA용 ServiceAccount. terraform/modules/compute/member_service_iam 의 IAM Role
# 신뢰 정책이 정확히 이 이름(namespace:lion-app, name:member-service)만
# AssumeRoleWithWebIdentity를 허용하므로 이름을 바꾸면 IRSA가 깨진다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: member-service
  namespace: lion-app
  annotations:
    eks.amazonaws.com/role-arn: "${MEMBER_SERVICE_IRSA_ARN}"
