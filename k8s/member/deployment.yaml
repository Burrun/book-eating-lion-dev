apiVersion: apps/v1
kind: Deployment
metadata:
  name: member-deployment
  namespace: lion-app
  labels:
    app: member-service
    tier: backend
spec:
  selector:
    matchLabels:
      app: member-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: member-service
        tier: backend
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - member-service
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: member-service
          image: "${ECR_REGISTRY}/${ECR_MEMBER_REPO}:${IMAGE_TAG}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: member-config
            - secretRef:
                name: member-secret

          # 경량 서비스다. 인증은 BCrypt 해시와 JWT 검증이 전부라
          # 큰 자원이 필요 없다 — RAG 를 여기 두지 않은 이유이기도 하다.
          resources:
            requests:
              cpu: "200m"
              memory: "384Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"

          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            # 원래 무거운 초기화가 없다는 이유로 1분(12)으로 짧게 잡았으나, OTel Java
            # 자동계측 에이전트(JMX bean 스캔 등)의 부팅 오버헤드가 모든 서비스에 공통으로
            # 붙어 실측 60초를 넘기고 있었다(2026-08-21 CrashLoopBackOff로 실제로 겪음) —
            # 다른 서비스들과 동일하게 180초로 맞춘다.
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
      terminationGracePeriodSeconds: 30
