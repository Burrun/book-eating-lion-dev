apiVersion: v1
kind: ConfigMap
metadata:
  name: member-config
  namespace: ${K8S_NAMESPACE}
data:
  SPRING_PROFILES_ACTIVE: "${SPRING_PROFILE}"
  SERVER_PORT: "8080"

  DB_HOST: "db-primary-service.${K8S_NAMESPACE}.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "${DB_NAME}"
  # application-prod.yml의 sslmode=${DB_SSL_MODE:require} 기본값용 (dev EC2 Postgres는 SSL 미지원).
  DB_SSL_MODE: "${DB_SSL_MODE}"
  # RDS Proxy(db-primary-service)가 앞단에서 커넥션을 멀티플렉싱하므로 Pod 풀은
  # Tomcat 스레드가 굶지 않을 만큼 키운다. RDS(db.t4g.micro, max_connections≈110)
  # 쪽 실제 커넥션은 Proxy MaxConnectionsPercent 가 캡한다.
  # (1차 부하테스트 §4-2: 풀 3 vs Tomcat 200 스레드 → 즉시 고갈 → 10s 타임아웃 → 5xx 99.99%)
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "12"
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "0"
  # 커넥션을 못 얻으면 10초 매달리지 말고 3초에 fail-fast → 서킷브레이커가 제때 열린다.
  SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: "3000"

  REDIS_HOST: "${REDIS_HOST}"

  AWS_REGION: "${AWS_REGION}"
  AWS_COGNITO_REGION: "${AWS_REGION}"
  AWS_COGNITO_USER_POOL_ID: "${AWS_COGNITO_USER_POOL_ID}"
