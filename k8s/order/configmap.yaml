apiVersion: v1
kind: ConfigMap
metadata:
  name: order-config
  namespace: ${K8S_NAMESPACE}
data:
  SPRING_PROFILES_ACTIVE: "${SPRING_PROFILE}"
  SERVER_PORT: "8080"

  # 쓰기 서비스라 Writer 로 간다. RDS Proxy 는 이쪽에만 붙인다
  # (ai_db 에 붙이면 Serverless v2 auto-pause 와 상충한다 — 판단 ②).
  DB_HOST: "db-primary-service.lion-db.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "${DB_NAME}"
  # application-prod.yml의 sslmode=${DB_SSL_MODE:require} 기본값용 (dev EC2 Postgres는 SSL 미지원).
  DB_SSL_MODE: "${DB_SSL_MODE}"
  # RDS Proxy가 앞단에서 커넥션을 멀티플렉싱하므로 Pod 풀은 Tomcat 스레드가 굶지
  # 않을 정도로 키운다. RDS(db.t4g.micro, max_connections≈110) 쪽 실제 커넥션은
  # Proxy MaxConnectionsPercent가 캡한다. (1차: 풀 3 → 스레드 200개가 대기하다 붕괴)
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "12"
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "0"
  # 커넥션을 못 얻으면 10초 매달리지 말고 3초에 fail-fast → 서킷브레이커가 제때 열린다.
  SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: "3000"

  # 리뷰 권한 이벤트 발행 채널
  REDIS_HOST: "${REDIS_HOST}"

  # 구매 확정 이벤트 발행 큐(SQS). ai-service 의 SqsPurchaseListener 가 book-purchase-queue
  # 로 수신해 검색 권한(RAG 대상)을 적재한다.
  SQS_PURCHASE_QUEUE_URL: "${SQS_PURCHASE_QUEUE_URL}"

  AWS_REGION: "${AWS_REGION}"
  AWS_COGNITO_REGION: "${AWS_REGION}"
  AWS_COGNITO_USER_POOL_ID: "${AWS_COGNITO_USER_POOL_ID}"

  # order 의 outbound 동기 호출 대상 2곳. 기본값(localhost:808x)은 파드 안에서 order
  # 자기 자신을 가리켜 연결이 거부되는데, 두 클라이언트 모두 fallback 을 달고 있어
  # 5xx 가 아니라 조용히 degrade 된다 — 장바구니는 "정보 조회 불가"/0원으로 보이고
  # 주문은 거부된다. 로그를 안 보면 원인이 안 드러나므로 반드시 넣을 것.
  SERVICES_CATALOG_URL: "http://catalog-service:8080"
  SERVICES_MEMBER_URL: "http://member-service:8080"

  # SUBSCRIPTION_BOOK_ID 는 여기서 주입하지 않는다. 시드(90-demo-data.sql)가 9001 을
  # 명시적으로 박아 환경마다 같은 값이라, order-api 의 application.yml 기본값이 기준이다.
  # 여기에 키를 두면 값이 비어도 env 는 존재하게 돼 코드 기본값이 죽는다.

  # 결제 완료 후 카카오가 사용자를 돌려보낼 프론트엔드 콜백 페이지. 이 값이
  # 없으면 코드 기본값(localhost:5173)으로 떨어져 실제 결제 후 사용자가
  # localhost로 리다이렉트된다(인프라-트러블슈팅.md ⑲, 2026-08-21 실제로
  # 배선 누락 상태였음 - 결제 자체는 되지만 완료 화면을 못 봄).
  KAKAOPAY_FRONTEND_CALLBACK_URL: "${KAKAOPAY_FRONTEND_CALLBACK_URL}"
