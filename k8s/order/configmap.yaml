apiVersion: v1
kind: ConfigMap
metadata:
  name: order-config
  namespace: lion-app
data:
  SPRING_PROFILES_ACTIVE: "${SPRING_PROFILE}"
  SERVER_PORT: "8080"

  # 쓰기 서비스라 Writer 로 간다. RDS Proxy 는 이쪽에만 붙인다
  # (ai_db 에 붙이면 Serverless v2 auto-pause 와 상충한다 — 판단 ②).
  DB_HOST: "db-primary-service.lion-db.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "${DB_NAME}"

  # 리뷰 권한 이벤트 발행 채널
  REDIS_HOST: "${REDIS_HOST}"

  AWS_REGION: "${AWS_REGION}"
  AWS_COGNITO_REGION: "${AWS_REGION}"
  AWS_COGNITO_USER_POOL_ID: "${AWS_COGNITO_USER_POOL_ID}"

  # order 의 outbound 동기 호출 대상 2곳. 기본값(localhost:808x)은 파드 안에서 order
  # 자기 자신을 가리켜 연결이 거부되는데, 두 클라이언트 모두 fallback 을 달고 있어
  # 5xx 가 아니라 조용히 degrade 된다 — 장바구니는 "정보 조회 불가"/0원으로 보이고
  # 주문은 거부된다. 로그를 안 보면 원인이 안 드러나므로 반드시 넣을 것.
  SERVICES_CATALOG_URL: "http://catalog-service:8080"
  SERVICES_MEMBER_URL: "http://member-service:8080"
