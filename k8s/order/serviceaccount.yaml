# IRSA용 ServiceAccount. terraform/modules/compute/order_service_iam 의 IAM Role
# 신뢰 정책이 정확히 이 이름(namespace:lion-app, name:order-service)만
# AssumeRoleWithWebIdentity를 허용하므로 이름을 바꾸면 IRSA가 깨진다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: order-service
  namespace: ${K8S_NAMESPACE}
  annotations:
    eks.amazonaws.com/role-arn: "${ORDER_SERVICE_IRSA_ARN}"
