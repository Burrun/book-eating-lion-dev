# order — 쓰기·트랜잭션 정합성. 2 → 30(prod) / 2 → 8(dev)
#
# 기획서의 "Order Pod 2개 → 50개 핀포인트 확장" 요구에 대응하는 자리다.
# 전환 전에는 단일 Deployment 에 max 10 이라 이 요구 자체가 표현 불가능했다.
#
# 상한을 30으로 둔 이유: replica 가 늘면 DB 커넥션이 배수로 늘어난다.
# maximum-pool-size 12 × 30 = 360 이 Proxy 로 향하는 클라이언트 커넥션 상한이고,
# RDS(db.t4g.micro, max_connections≈110) 쪽 실제 커넥션은 RDS Proxy 가
# MaxConnectionsPercent 로 캡한다 — Proxy 없이 직결이면 이 배수에서 즉시 터진다.
# 부하테스트 중 order 파드가 30 까지 튀면 Proxy borrow-timeout 큐잉이 생길 수 있으니
# 필요하면 ORDER_HPA_MAX_REPLICAS 로 낮춰 관측한다.
#
# dev 는 ORDER_HPA_MAX_REPLICAS 로 낮춘다 — 이유는 catalog/hpa.yaml 상단 참고
# (2026-08-31 quota exceeded 로 main-cd 롤아웃이 막힌 사고).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: order-hpa
  namespace: ${K8S_NAMESPACE}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: order-deployment
  minReplicas: 2
  maxReplicas: ${ORDER_HPA_MAX_REPLICAS}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      # 결제 부하는 급격히 오므로 빠르게 붙는다.
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleDown:
      # 내려갈 때는 천천히. 트랜잭션 중인 Pod 를 성급히 줄이지 않는다.
      stabilizationWindowSeconds: 300
