apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-config
  namespace: ${K8S_NAMESPACE}
data:
  SPRING_PROFILES_ACTIVE: "${SPRING_PROFILE}"
  SERVER_PORT: "8080"

  # Proxy 엔드포인트(db-primary-service)로 간다 — order/member/ai 와 동일.
  # Reader 엔드포인트(db-reader-service → reader.db.integrated.internal.ajttk.com)는
  # RDS 인스턴스로 직결이라 RDS Proxy 를 우회한다. 게다가 현재 read replica 가 없어서
  # (rds_postgres read_replica_count=0) "Reader"는 사실상 같은 인스턴스다. 풀을 12로
  # 키운 catalog 가 HPA 로 확장되면 Proxy 없이 수백 개 직결이 열려 max_connections(≈110)
  # 를 넘긴다. read replica + 앱 read/write 라우팅이 들어오면 그때 Reader 경로로 되돌린다.
  DB_HOST: "db-primary-service.lion-db.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "${DB_NAME}"
  # application-prod.yml의 sslmode=${DB_SSL_MODE:require} 기본값용 (dev EC2 Postgres는 SSL 미지원).
  DB_SSL_MODE: "${DB_SSL_MODE}"
  # RDS Proxy가 앞단에서 커넥션을 멀티플렉싱하므로 Pod 풀은 Tomcat 스레드가 굶지
  # 않을 정도로 키운다. RDS(db.t4g.micro, max_connections≈110) 쪽 실제 커넥션은
  # Proxy MaxConnectionsPercent가 캡한다. (1차: 풀 3 → 스레드 200개가 대기하다 붕괴)
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "12"
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "0"
  # 커넥션을 못 얻으면 10초 매달리지 말고 3초에 fail-fast → 서킷브레이커가 제때 열린다.
  SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: "3000"

  # 서비스 간 동기 통신 주소. Eureka 없이 K8s Service DNS 가 해결한다(§4).
  # MemberNotificationClient(member-notification-profile)가 SERVICES_MEMBER_URL을
  # 쓰는데, 이 키가 없으면 기본값(localhost:8083)으로 떨어져 파드가 자기 자신을
  # 호출하다 실패한다 - 이 값만 빠져 있었다(인프라-트러블슈팅.md ⑳).
  SERVICES_ORDER_URL: "http://order-service.${K8S_NAMESPACE}.svc.cluster.local:8080"
  SERVICES_AI_URL: "http://ai-rag.${K8S_NAMESPACE}.svc.cluster.local:8080"
  SERVICES_MEMBER_URL: "http://member-service.${K8S_NAMESPACE}.svc.cluster.local:8080"

  REDIS_HOST: "${REDIS_HOST}"

  AWS_REGION: "${AWS_REGION}"
  AWS_COGNITO_REGION: "${AWS_REGION}"
  AWS_COGNITO_USER_POOL_ID: "${AWS_COGNITO_USER_POOL_ID}"

  # 운영에서는 비공개 S3 EPUB을 짧은 유효기간의 Presigned URL로 제공한다.
  EBOOK_STORAGE: "s3"
  EBOOK_S3_BUCKET: "${EBOOK_S3_BUCKET}"
  EBOOK_READ_URL_VALIDITY: "PT10M"
  EBOOK_UPLOAD_URL_VALIDITY: "PT10M"

  # 신간 등록 이벤트 발행 큐(SQS). ai-service 의 SqsIngestListener 가 book-ingest-queue 로
  # 수신해 EPUB을 벡터로 인제스트한다.
  SQS_INGEST_QUEUE_URL: "${SQS_INGEST_QUEUE_URL}"
