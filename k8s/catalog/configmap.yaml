apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-config
  namespace: ${K8S_NAMESPACE}
data:
  SPRING_PROFILES_ACTIVE: "${SPRING_PROFILE}"
  SERVER_PORT: "8080"

  # catalog는 RoutingDataSourceConfig가 writer/reader 커넥션을 트랜잭션 단위로
  # 나눈다(읽기 95%, §2 읽기/쓰기 비대칭) - 그래서 DB_HOST는 다른 서비스처럼
  # primary를 가리키고, reader는 별도 키로 둔다.
  DB_HOST: "db-primary-service.${K8S_NAMESPACE}.svc.cluster.local"
  DB_READER_HOST: "db-reader-service.${K8S_NAMESPACE}.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "${DB_NAME}"
  # application-prod.yml의 sslmode=${DB_SSL_MODE:require} 기본값용 (dev EC2 Postgres는 SSL 미지원).
  DB_SSL_MODE: "${DB_SSL_MODE}"
  # dev EC2/prod RDS 둘 다 연결 한도를 여러 Pod가 나눠 쓰도록 풀을 작게 유지한다.
  # reader는 RDS Proxy를 안 거치고 리플리카에 직접 붙어서 Pod 수 × 이 값이 DB의
  # max_connections를 그대로 압박한다 - writer/hikari.maximum-pool-size(구
  # SPRING_DATASOURCE_HIKARI_*)와 이름이 달라진 이유는 이제 풀이 2개라서다.
  DB_WRITER_POOL_SIZE: "3"
  DB_READER_POOL_SIZE: "8"

  # 서비스 간 동기 통신 주소. Eureka 없이 K8s Service DNS 가 해결한다(§4).
  # MemberNotificationClient(member-notification-profile)가 SERVICES_MEMBER_URL을
  # 쓰는데, 이 키가 없으면 기본값(localhost:8083)으로 떨어져 파드가 자기 자신을
  # 호출하다 실패한다 - 이 값만 빠져 있었다(인프라-트러블슈팅.md ⑳).
  SERVICES_ORDER_URL: "http://order-service.${K8S_NAMESPACE}.svc.cluster.local:8080"
  SERVICES_AI_URL: "http://ai-rag.${K8S_NAMESPACE}.svc.cluster.local:8080"
  SERVICES_MEMBER_URL: "http://member-service.${K8S_NAMESPACE}.svc.cluster.local:8080"

  REDIS_HOST: "${REDIS_HOST}"

  AWS_REGION: "${AWS_REGION}"
  AWS_COGNITO_REGION: "${AWS_REGION}"
  AWS_COGNITO_USER_POOL_ID: "${AWS_COGNITO_USER_POOL_ID}"

  # 운영에서는 비공개 S3 EPUB을 짧은 유효기간의 Presigned URL로 제공한다.
  EBOOK_STORAGE: "s3"
  EBOOK_S3_BUCKET: "${EBOOK_S3_BUCKET}"
  EBOOK_READ_URL_VALIDITY: "PT10M"
  EBOOK_UPLOAD_URL_VALIDITY: "PT10M"

  # 신간 등록 이벤트 발행 큐(SQS). ai-service 의 SqsIngestListener 가 book-ingest-queue 로
  # 수신해 EPUB을 벡터로 인제스트한다.
  SQS_INGEST_QUEUE_URL: "${SQS_INGEST_QUEUE_URL}"
