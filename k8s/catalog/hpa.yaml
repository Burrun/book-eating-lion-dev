# catalog — 읽기 95%, 캐시 친화적. 2 → 20(prod) / 2 → 6(dev)
#
# 서비스마다 상한이 다른 것이 핀포인트 확장 시연의 근거다(Phase 4).
# 결제 부하를 걸면 order 만 30개로 늘고 나머지는 최소 replica 를 유지한다.
#
# dev/prod 가 같은 공유 노드풀·quota(shared-nodepool-guard)를 쓰는데 max 가
# prod와 동일했던 탓에, dev 부하테스트(k6/scenarios/08-namespace-contention.js)
# 만으로 quota 를 다 먹어 main-cd 롤아웃이 exceeded quota 로 막힌 사고가 있었다
# (2026-08-31). dev 만 CATALOG_HPA_MAX_REPLICAS 로 낮춘다.
#
# memory 메트릭은 뺐다(§4-4): JVM 이 힙을 limits.memory 까지 잡고 반환하지 않아
# memory% 가 부하와 무관하게 상시 ~80% → HPA 가 항상 maxReplicas 로 스케일 →
# 그 Pod 들이 네임스페이스 CPU quota 를 독점 → 어떤 롤아웃도 새 Pod 를 못 띄우는
# 데드락. memory% 는 이 JVM 특성상 스케일 신호로 부적절하다. CPU 70% 단일 기준.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: catalog-hpa
  namespace: ${K8S_NAMESPACE}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: catalog-deployment
  minReplicas: 2
  maxReplicas: ${CATALOG_HPA_MAX_REPLICAS}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
