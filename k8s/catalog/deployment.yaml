apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-deployment
  namespace: ${K8S_NAMESPACE}
  labels:
    app: catalog-service
    tier: backend
spec:
  # replicas 는 일부러 두지 않는다. HPA 가 소유하며,
  # 여기에 값을 적으면 apply 할 때마다 HPA 가 늘려둔 수를 되돌린다.
  selector:
    matchLabels:
      app: catalog-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: catalog-service
        tier: backend
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - catalog-service
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: catalog-service
          # CD 워크플로가 커밋 SHA 로 치환한다. ECR 리포지터리도 서비스별로 나뉜다.
          image: "${ECR_REGISTRY}/${ECR_CATALOG_REPO}:${IMAGE_TAG}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: catalog-config
            - secretRef:
                name: catalog-secret

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
      terminationGracePeriodSeconds: 30
