# IRSA용 ServiceAccount. terraform/modules/compute/catalog_service_iam 의 IAM Role
# 신뢰 정책이 배포 namespace(${K8S_NAMESPACE})와 이 이름(catalog-service)에만
# AssumeRoleWithWebIdentity를 허용하므로 이름을 바꾸면 IRSA가 깨진다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: catalog-service
  namespace: ${K8S_NAMESPACE}
  annotations:
    eks.amazonaws.com/role-arn: "${CATALOG_SERVICE_IRSA_ARN}"
