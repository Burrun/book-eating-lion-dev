# order-service 등 lion-app 네임스페이스의 서비스가 운영 DB(db-primary-service)
# 대신 postgres-test-service 를 바라보도록 하는 오버라이드 ConfigMap.
# 운영 ConfigMap(k8s/order/configmap.yaml 등)은 건드리지 않는다 — envFrom 목록에
# 이 ConfigMap 을 뒤에 추가하거나 `kubectl set env --from=configmap` 으로 주입해
# 같은 키(DB_HOST, DB_PORT, DB_NAME, SPRING_PROFILES_ACTIVE)를 덮어쓰는 방식으로 쓴다.
#
# 계정/비밀번호(DB_USERNAME, DB_PASSWORD)는 여기 넣지 않는다 — 운영 컨벤션이
# 자격증명은 항상 Secret(order-secret 등)에만 두고 ConfigMap 에는 안 두는
# 방식이라, 03-test-secret.yaml(test-db-secret)로 짝을 맞춰 같이 주입한다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: test-db-override-config
  namespace: lion-app
  labels:
    tier: test-db
data:
  DB_HOST: "postgres-test-service.lion-db.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "lion_test_db"
  SPRING_PROFILES_ACTIVE: "test"
