# order-service 등 lion-app 네임스페이스의 서비스가 운영 DB(db-primary-service)
# 대신 postgres-test-service 를 바라보도록 하는 오버라이드 ConfigMap.
# 운영 ConfigMap(k8s/order/configmap.yaml 등)은 건드리지 않는다 — envFrom 목록에
# 이 ConfigMap 을 뒤에 추가하거나 `kubectl set env --from=configmap` 으로 주입해
# 같은 키를 덮어쓰는 방식으로 쓴다(envFrom 은 같은 키가 겹치면 나중 항목이 이긴다).
#
# 계정/비밀번호(DB_USERNAME, DB_PASSWORD, KAKAOPAY_SECRET_KEY)는 여기 넣지 않는다 —
# 운영 컨벤션이 자격증명은 항상 Secret 에만 두는 방식이라, 03-test-secret.yaml
# (test-db-secret)로 짝을 맞춰 같이 주입한다.
#
# --- 리뷰 문서(docs/k8s-test-review.md) §3.1 해결 ---
# SPRING_PROFILES_ACTIVE 를 "test" 가 아니라 "prod" 로 둔다. backend/apps/*/src/main/
# resources/ 에는 application-test.yml 자체가 없고, datasource 등 실제 설정은
# application-prod.yml 에만 있다 — 이 저장소에서 "prod" 프로파일은 "환경변수 주입
# 기반 설정"을 뜻하지 실제 운영 여부를 뜻하지 않는다. "test" 로 두면 프로파일 파일이
# 없어 조용히 무시되고 datasource 자체가 구성되지 않는다.
#
# --- DB_HOST/DB_PORT/DB_NAME 대신 SPRING_DATASOURCE_URL 을 통째로 오버라이드하는 이유 ---
# application-prod.yml 의 JDBC URL 은 `...?currentSchema=order_db&sslmode=require` 로
# sslmode 가 하드코딩돼 있다. postgres:15-alpine 컨테이너는 기본적으로 SSL 이 꺼져
# 있어서 DB_HOST/PORT/NAME 만 바꿔서는 sslmode=require 때문에 연결 자체가 실패한다.
# Spring Boot 는 OS 환경변수(SPRING_DATASOURCE_URL)를 application-prod.yml 의 값보다
# 우선순위 높게 취급하므로, URL 전체를 이 환경변수로 덮어써 sslmode=disable 로 바꾼다
# (애플리케이션 코드/yml 은 건드리지 않는다).
#
# --- SPRING_DATA_REDIS_HOST/PORT ---
# order 모듈의 RedissonConfig 가 `${spring.data.redis.host}` / `${spring.data.redis.port}`
# 를 기본값 없이 주입받는데, application-prod.yml 에는 이 키가 아예 없다. 값이
# 없으면 컨텍스트 기동 자체가 실패하므로 반드시 채워야 한다. 05-test-redis.yaml 의
# redis-test-service 를 가리킨다.
#
# --- SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI ---
# SecurityConfig 가 `.oauth2ResourceServer(oauth2 -> oauth2.jwt(...))` 로 JWT 검증을
# 요구하는데, application-prod.yml 에는 issuer-uri 가 없어 JwtDecoder 빈을 못 만들고
# 기동이 실패한다. 값 자체(더미 Cognito 형식 URL)는 실제 토큰 검증 시점(최초 요청)에만
# 쓰이므로 Pod 기동에는 지장이 없다 — 로그인이 필요한 API 만 인증에 실패한다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: test-db-override-config
  namespace: lion-app
  labels:
    tier: test-db
data:
  SPRING_PROFILES_ACTIVE: "prod"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-test-service.lion-db.svc.cluster.local:5432/lion_test_db?currentSchema=order_db&sslmode=disable"
  SPRING_DATA_REDIS_HOST: "redis-test-service.lion-db.svc.cluster.local"
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: "https://cognito-idp.ap-northeast-2.amazonaws.com/ap-northeast-2_dummyTestPool"
