# ai-service(ai-bot, ai-rag) 테스트 배포.
# order/catalog/member 와 통신하지 않는 독립 서비스다(AiApiApplication.java 주석:
# "이 서비스는 다른 서비스와 통신하지 않는다", Feign 클라이언트 없음) — 그래서
# order-service 통신 테스트와는 무관하지만, 요청대로 실제 배포로 기동시킨다.
#
# --- APP_AI_CLIENTS=stub 가 핵심 ---
# backend/apps/ai-api/src/main/resources/application-prod.yml:30 이 `app.ai.clients: bedrock`
# 를 리터럴로 하드코딩한다(플레이스홀더가 아니다). 이 값이 살아있으면 AwsConfig 가
# BedrockRuntimeClient/S3VectorsClient 를 만들고, VectorIndexVerifier(InitializingBean)가
# 컨텍스트 기동 중에 S3 Vectors 에 동기 GetIndex 호출을 날려 자격증명이 없으면
# 그 자리에서 기동이 실패한다(CrashLoopBackOff). Spring Boot 는 OS 환경변수를 프로필
# yml 리터럴보다 우선하므로, APP_AI_CLIENTS=stub 를 주입하면 StubLlmClient 등
# 목업 빈이 대신 활성화되어 AWS 접근 없이 기동된다.
#
# AWS_BEDROCK_REGION/AI_VECTOR_BUCKET 은 stub 모드에서 실제로 쓰이진 않지만
# @ConfigurationProperties(AiProperties) 바인딩 자체가 기본값 없이 걸려 있어
# 값이 없으면 그 자체로 placeholder resolution 에 실패한다 — 더미 값을 채운다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-test-override-config
  namespace: lion-app
  labels:
    tier: test-db
data:
  SPRING_PROFILES_ACTIVE: "prod"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-test-service.lion-db.svc.cluster.local:5432/lion_test_db?currentSchema=ai_db&sslmode=disable"
  SPRING_DATA_REDIS_HOST: "redis-test-service.lion-db.svc.cluster.local"
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: "https://cognito-idp.ap-northeast-2.amazonaws.com/ap-northeast-2_dummyTestPool"
  APP_AI_CLIENTS: "stub"
  AWS_BEDROCK_REGION: "ap-northeast-2"
  AI_VECTOR_BUCKET: "test-vector-bucket"
---
apiVersion: v1
kind: Secret
metadata:
  name: ai-test-secret
  namespace: lion-app
  labels:
    tier: test-db
type: Opaque
stringData:
  AI_DB_USERNAME: "ai_svc"
  AI_DB_PASSWORD: "ai_pw"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-bot-deployment
  namespace: lion-app
  labels:
    app: ai-bot
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-bot
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: ai-bot
        tier: backend
    spec:
      containers:
        - name: ai-service
          image: "ai-service:test-local"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: ai-config
            - secretRef:
                name: ai-secret
            - configMapRef:
                name: ai-test-override-config
            - secretRef:
                name: ai-test-secret
          env:
            - name: AI_LLM_MODEL
              valueFrom:
                configMapKeyRef:
                  name: ai-config
                  key: AI_LLM_MODEL_BOT
          resources:
            requests:
              cpu: "100m"
              memory: "384Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
      terminationGracePeriodSeconds: 30
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-rag-deployment
  namespace: lion-app
  labels:
    app: ai-rag
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-rag
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: ai-rag
        tier: backend
    spec:
      containers:
        - name: ai-service
          image: "ai-service:test-local"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: ai-config
            - secretRef:
                name: ai-secret
            - configMapRef:
                name: ai-test-override-config
            - secretRef:
                name: ai-test-secret
          env:
            - name: AI_LLM_MODEL
              valueFrom:
                configMapKeyRef:
                  name: ai-config
                  key: AI_LLM_MODEL_RAG
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
      terminationGracePeriodSeconds: 30
