# 인클러스터 독립형 테스트 Redis. order 모듈이 이벤트 채널(RedisTemplate,
# common/RedisConfig)과 재고 차감 분산 락(RedissonClient, order/RedissonConfig)
# 둘 다에 쓴다 — RedissonClient 는 빈 생성 시점에 즉시 연결을 시도하므로, 이 Redis가
# 없으면 order-service 가 기동 자체를 못 하고 CrashLoopBackOff 에 빠진다.
#
# 운영은 ElastiCache 를 쓰지만(k8s/base/09-networkpolicy.yaml 의 6379 egress 규칙
# 참고) 테스트 환경은 postgres-test 와 마찬가지로 클러스터 내부 단독 Pod로 대체한다.
# 인증/영속성 없음 — 테스트용이므로 Pod 재생성 시 데이터가 사라져도 무방하다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-test-deployment
  namespace: lion-db
  labels:
    app: redis-test
    tier: test-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-test
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: redis-test
        tier: test-db
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: redis-test-service
  namespace: lion-db
  labels:
    app: redis-test
spec:
  type: ClusterIP
  selector:
    app: redis-test
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
