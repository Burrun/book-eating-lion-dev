# 실제 프론트엔드는 S3 정적 호스팅이라 VM 클러스터 안에 클라이언트 역할을 할 Pod가
# 없다. 이 Deployment 는 그 자리를 메우는 최소한의 목업(Mock) UI 다 —
# order-service 와의 통신/헬스체크만 눈으로 확인하는 용도이며, 실제 프론트엔드
# 코드(frontend/)와는 무관하다.
#
# nginx 가 두 가지 역할을 한다:
#   1. index.html 정적 서빙 (테스트 UI)
#   2. /api/, /health/ 를 order-service.lion-app.svc.cluster.local:8080 으로
#      리버스 프록시 — 브라우저에서 별도 CORS 설정 없이 같은 오리진으로 백엔드를
#      호출해볼 수 있게 한다(운영 Ingress 의 /api/* 라우팅과 동일한 발상).
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-test-nginx-conf
  namespace: lion-app
  labels:
    tier: test-frontend
data:
  default.conf: |
    server {
        listen 80;

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        location /api/ {
            proxy_pass http://order-service.lion-app.svc.cluster.local:8080/api/;
            proxy_set_header Host $host;
        }

        location /health/ {
            proxy_pass http://order-service.lion-app.svc.cluster.local:8080/actuator/health/;
            proxy_set_header Host $host;
        }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-test-html
  namespace: lion-app
  labels:
    tier: test-frontend
data:
  index.html: |
    <!doctype html>
    <html lang="ko">
    <head>
      <meta charset="utf-8">
      <title>book-eating-lion k8s 테스트 목업</title>
      <style>
        body { font-family: sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
        button { padding: 8px 16px; margin-right: 8px; cursor: pointer; }
        pre { background: #f2f2f2; padding: 12px; white-space: pre-wrap; word-break: break-all; }
      </style>
    </head>
    <body>
      <h1>k8s 테스트 환경 목업 프론트엔드</h1>
      <p>실제 프론트엔드(S3 정적 호스팅)를 대신해 order-service 연동을 확인하는 용도입니다.</p>

      <button onclick="call('/health/', 'health-result')">백엔드 헬스체크 (/actuator/health)</button>
      <button onclick="call('/api/orders', 'orders-result')">주문 조회 (/api/orders, 인증 없음 → 401 예상)</button>

      <h3>헬스체크 결과</h3>
      <pre id="health-result">(버튼을 눌러주세요)</pre>

      <h3>/api/orders 응답</h3>
      <pre id="orders-result">(버튼을 눌러주세요 — 더미 JWT 발급자라 401 Unauthorized 가 나오면 보안 설정이 정상 동작하는 것입니다)</pre>

      <script>
        async function call(path, targetId) {
          const el = document.getElementById(targetId);
          el.textContent = '요청 중...';
          try {
            const res = await fetch(path);
            const text = await res.text();
            el.textContent = 'HTTP ' + res.status + '\n' + text;
          } catch (e) {
            el.textContent = '요청 실패: ' + e;
          }
        }
      </script>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-test-deployment
  namespace: lion-app
  labels:
    app: frontend-test
    tier: test-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-test
  template:
    metadata:
      labels:
        app: frontend-test
        tier: test-frontend
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: html
              mountPath: /usr/share/nginx/html
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "64Mi"
      volumes:
        - name: nginx-conf
          configMap:
            name: frontend-test-nginx-conf
        - name: html
          configMap:
            name: frontend-test-html
---
# VM 환경에는 클라우드 LoadBalancer 가 없으므로 NodePort 로 노출한다.
# 브라우저에서 http://<VM-IP>:30080 으로 접속.
apiVersion: v1
kind: Service
metadata:
  name: frontend-test-service
  namespace: lion-app
  labels:
    app: frontend-test
spec:
  type: NodePort
  selector:
    app: frontend-test
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
      protocol: TCP
