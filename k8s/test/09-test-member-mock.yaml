# member-service 목업. order 모듈의 CardClient.java(주석)이 이미 이 방식을 전제하고
# 있다 — "member-service 쪽 Java 구현은 아직 없고 로컬에서는 Prism mock 이 응답한다".
# backend/contracts/member-v1.yaml 을 그대로 Prism 으로 서빙한다.
#
# ConfigMap `member-contract` 는 여기서 선언하지 않는다 — 08-test-catalog-mock.yaml 과
# 같은 이유(계약 YAML 중복 커밋은 원본과의 drift 위험, contracts/README.md의 단일
# 진실 공급원 원칙). 실행 가이드의 imperative 명령으로 생성한다.
#
# catalog-mock 과 달리 nginx 브릿지가 없다: CardClient.java 의 실제 호출 경로
# (`POST /internal/cards/{cardId}/deduct`, `/restore`)가 member-v1.yaml 의 경로와
# 정확히 일치하므로(175, 209번 줄) Prism 을 바로 8080 포트로 띄우면 된다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: member-mock-deployment
  namespace: lion-app
  labels:
    app: member-mock
    tier: test-mock
spec:
  replicas: 1
  selector:
    matchLabels:
      app: member-mock
  template:
    metadata:
      labels:
        app: member-mock
        tier: test-mock
    spec:
      containers:
        - name: prism
          image: stoplight/prism:4
          args: ["mock", "-h", "0.0.0.0", "-p", "8080", "/contracts/member-v1.yaml"]
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: member-contract
              mountPath: /contracts
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
      volumes:
        - name: member-contract
          configMap:
            name: member-contract
---
# order-service 의 SERVICES_MEMBER_URL(02-test-config.yaml)이 이 이름을 가리킨다.
apiVersion: v1
kind: Service
metadata:
  name: member-service-mock
  namespace: lion-app
  labels:
    app: member-mock
spec:
  type: ClusterIP
  selector:
    app: member-mock
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
