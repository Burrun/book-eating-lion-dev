# catalog-service 목업. 실제 Spring Boot 구현 대신 backend/contracts/catalog-v1.yaml
# (서비스 간 계약의 단일 진실 공급원, contracts/README.md 참고)을 Prism(stoplight/prism)
# 으로 그대로 서빙한다 — 이 저장소가 이미 이 방식을 쓰고 있다: order 모듈의
# CardClient.java 주석이 "계약이 곧 mock" 이라고 명시한다.
#
# ConfigMap `catalog-contract` 는 여기서 선언하지 않는다. 계약 YAML(564줄)을 이 파일에
# 복사해 두면 곧바로 원본과 어긋난다 — README 가 "이 디렉터리의 YAML 이 단일 진실
# 공급원" 이라고 명시한 원칙과 정면으로 충돌한다. 대신 실행 가이드의 imperative
# 명령으로 backend/contracts/catalog-v1.yaml 을 그대로 ConfigMap 화한다.
#
# --- nginx 브릿지가 필요한 이유(경로 드리프트 발견) ---
# order 모듈의 CatalogClient.java(`@GetMapping("/api/books/{bookId}")`)와
# k8s/base/08-ingress.yaml 은 `/api/books/{bookId}` 를 부른다. 그런데
# backend/contracts/catalog-v1.yaml 의 실제 경로는 `/api/catalog/books/{bookId}` 다
# (177번 줄). 계약과 실제 호출 경로가 어긋나 있다 — contracts/README.md 가 "아직 하지
# 않은 것"으로 꼽은 "계약과 구현의 경로 대조"가 실제로 걸린 사례다. Prism 은 계약에
# 없는 경로에 404 를 내므로, 같은 Pod 안에 nginx 를 얹어 order-service 가 실제로
# 부르는 경로를 계약 경로로 rewrite 한 뒤에만 Prism 으로 넘긴다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-mock-nginx-conf
  namespace: lion-app
  labels:
    tier: test-mock
data:
  default.conf: |
    server {
        listen 8080;

        location = /healthz {
            return 200 'ok';
        }

        # CatalogClient.java 가 실제로 부르는 경로 -> 계약(catalog-v1.yaml) 경로로 rewrite.
        location /api/books/ {
            rewrite ^/api/books/(.*)$ /api/catalog/books/$1 break;
            proxy_pass http://127.0.0.1:4010;
            proxy_set_header Host $host;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-mock-deployment
  namespace: lion-app
  labels:
    app: catalog-mock
    tier: test-mock
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-mock
  template:
    metadata:
      labels:
        app: catalog-mock
        tier: test-mock
    spec:
      containers:
        - name: prism
          image: stoplight/prism:4
          args: ["mock", "-h", "0.0.0.0", "/contracts/catalog-v1.yaml"]
          ports:
            - name: prism
              containerPort: 4010
          volumeMounts:
            - name: catalog-contract
              mountPath: /contracts
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: prism
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
        - name: nginx-bridge
          image: nginx:alpine
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: "20m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
      volumes:
        - name: catalog-contract
          configMap:
            name: catalog-contract
        - name: nginx-conf
          configMap:
            name: catalog-mock-nginx-conf
---
# order-service 의 SERVICES_CATALOG_URL(02-test-config.yaml)이 이 이름을 가리킨다.
apiVersion: v1
kind: Service
metadata:
  name: catalog-service-mock
  namespace: lion-app
  labels:
    app: catalog-mock
spec:
  type: ClusterIP
  selector:
    app: catalog-mock
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
