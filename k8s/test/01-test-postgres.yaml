# 인클러스터 독립형(Standalone) 테스트 PostgreSQL.
# k8s/base/04-db.yaml 의 Aurora ExternalName 과 같은 namespace(lion-db)에 두어
# 서비스명만 바꾸면(db-primary-service -> postgres-test-service) 애플리케이션
# 코드/시크릿 구조를 그대로 재사용할 수 있게 한다.
#
# lion-db 네임스페이스 자체는 k8s/base/01-namespace.yaml 이 만든다.
# 여기서 Namespace 리소스를 다시 선언하지 않는다 — kubectl apply 는 마지막에
# 적용된 매니페스트 기준으로 3-way merge 를 하므로, 라벨 없는 Namespace 를
# 여기서 다시 apply 하면 base 가 붙여둔 access-to-db 라벨이 지워질 수 있다.
#
# POSTGRES_USER/PASSWORD 는 03-test-secret.yaml(postgres-test-secret, 같은
# lion-db 네임스페이스)에서 주입받는다 — 평문 하드코딩을 피하고, 애플리케이션
# 쪽 test-db-secret 과 값이 어긋날 여지를 없앤다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-test-deployment
  namespace: lion-db
  labels:
    app: postgres-test
    tier: test-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-test
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: postgres-test
        tier: test-db
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "lion_test_db"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-test-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-test-secret
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          volumeMounts:
            - name: postgres-test-storage
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "test_user", "-d", "lion_test_db"]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "test_user", "-d", "lion_test_db"]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        # 테스트용 휘발성 스토리지. Pod 재생성 시 데이터는 사라진다(의도된 동작).
        - name: postgres-test-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-test-service
  namespace: lion-db
  labels:
    app: postgres-test
spec:
  type: ClusterIP
  selector:
    app: postgres-test
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
