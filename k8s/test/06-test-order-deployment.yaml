# order-service 를 테스트 DB(postgres-test)/Redis(redis-test) 에 붙여서 기동하는
# 테스트 전용 Deployment. Service 는 새로 만들지 않는다 — k8s/order/service.yaml
# 의 order-service (namespace: lion-app, selector: app=order-service) 를
# 그대로 재사용한다. 이 Deployment 의 label 이 동일 selector 를 만족한다.
#
# k8s/order/deployment.yaml(운영용)과의 차이:
#   1. image — 운영은 `${ECR_REGISTRY}/${ECR_ORDER_REPO}:${IMAGE_TAG}` 를 CD 가
#      envsubst 로 채운다. VM 로컬 테스트에는 ECR 접근이 없으므로 로컬에서 빌드한
#      이미지를 클러스터에 직접 로드해 쓴다(아래 실행 가이드 참고). 태그를 고정값
#      (order-service:test-local)으로 둬서 envsubst 없이 바로 apply 할 수 있게 했다.
#   2. envFrom — order-config/order-secret(운영) 뒤에 test-db-override-config/
#      test-db-secret(02,03-test-*.yaml)을 추가로 얹는다. envFrom 은 같은 키가
#      겹치면 나중 항목이 이기므로, order-config/order-secret 안의 미치환
#      ${...} 값(AWS_REGION 등, order-service 가 실제로 읽지 않는 키)은 무시되고
#      테스트 값만 적용된다.
#   3. resources — VM 테스트 환경 스펙에 맞춰 운영(Guaranteed, 500m/1Gi)보다 낮춘다.
#      결제 트랜잭션 QoS 보장은 테스트 목적과 무관하다.
#   4. 이름 — 운영 Deployment 와 같은 이름(order-deployment)을 쓰지 않는다.
#      k8s/order/hpa.yaml 이 scaleTargetRef 로 그 이름을 타겟팅하기 때문에, 이름이
#      같으면 누군가 실수로 hpa.yaml 을 같이 apply했을 때 HPA 가 minReplicas: 2 를
#      강제해서 이 Deployment 의 replicas: 1 과 충돌한다(/code-review 지적사항).
#      Service 연결은 Deployment 이름이 아니라 Pod label(app: order-service)로
#      되므로, 이름을 바꿔도 k8s/order/service.yaml 재사용에는 영향이 없다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-test-deployment
  namespace: lion-app
  labels:
    app: order-service
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: order-service
        tier: backend
    spec:
      containers:
        - name: order-service
          image: "order-service:test-local"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: order-config
            - secretRef:
                name: order-secret
            - configMapRef:
                name: test-db-override-config
            - secretRef:
                name: test-db-secret
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
      terminationGracePeriodSeconds: 30
