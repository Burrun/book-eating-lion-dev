# 테스트 전용 고정 계정/비밀번호. GitHub Secrets 로 envsubst 치환되는 운영
# Secret(k8s/base/03-secret.yaml)과 달리, 이 값은 postgres-test 자체가 초기화 시
# 만드는 role 과 1:1로 맞아야 하므로 의도적으로 리터럴을 그대로 커밋한다.
#
# 두 Secret 은 같은 계정/비밀번호를 서로 다른 namespace 에 나눠 담은 것뿐이다.
# k8s Secret 은 namespace 스코프라 Postgres Pod(lion-db)와 애플리케이션 Pod
# (lion-app)가 하나의 Secret 오브젝트를 공유해서 참조할 수 없다 — 그래서
# 값을 이 한 파일 안에 나란히 두어, 값이 어긋나면 diff 로 바로 드러나게 한다.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-test-secret
  namespace: lion-db
  labels:
    tier: test-db
type: Opaque
stringData:
  POSTGRES_USER: "test_user"
  POSTGRES_PASSWORD: "test_password"
---
# order-service 등 lion-app 의 Pod 가 운영 Secret(order-secret 등) 대신 주입받는
# 테스트용 자격증명. 키 이름(DB_USERNAME/DB_PASSWORD)은 운영 Secret과 동일하게
# 맞춰서, envFrom 목록 뒤에 추가하거나 `kubectl set env --from=secret` 으로
# 덮어쓰기만 하면 애플리케이션 코드 변경 없이 그대로 동작하게 했다.
apiVersion: v1
kind: Secret
metadata:
  name: test-db-secret
  namespace: lion-app
  labels:
    tier: test-db
type: Opaque
stringData:
  DB_USERNAME: "test_user"
  DB_PASSWORD: "test_password"
