# 로컬에서 ALB Ingress 의 경로 라우팅을 흉내낸다.
# k8s/base/08-ingress.yaml 과 같은 규칙이어야 하며, 한쪽만 고치면
# "로컬에선 되는데 클러스터에선 404" 가 난다. 함께 수정할 것.
#
# nginx 는 가장 긴 prefix 를 먼저 매칭하므로 작성 순서는 무관하다.
server {
    listen 80;

    # --- ai-service (Deployment 2개로 갈린다) ---
    location /api/ai/ask {
        proxy_pass http://ai:8080;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }
    location /api/ai/lion/ {
        proxy_pass http://ai:8080;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }
    location /api/ai/bot/ {
        proxy_pass http://ai:8080;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    # --- order-service ---
    location /api/orders/ {
        proxy_pass http://order:8080;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    # --- member-service ---
    location /api/members/ {
        proxy_pass http://member:8080;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }
    location /api/auth/ {
        proxy_pass http://member:8080;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    # --- catalog-service ---
    # Catalog 외부 API는 서비스 접두사 하나로 라우팅한다.
    location /api/catalog/ {
        proxy_pass http://catalog:8080;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    # /internal/ 은 의도적으로 없다. 서비스 간 전용 경로이며
    # 외부에서 도달할 수 없어야 한다(k8s 에서는 NetworkPolicy 가 2차 방어선).

    location / {
        proxy_pass http://frontend:80;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }
}
