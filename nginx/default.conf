# 로컬에서 ALB Ingress 의 경로 라우팅을 흉내낸다.
# k8s/base/08-ingress.yaml 과 같은 규칙이어야 하며, 한쪽만 고치면
# "로컬에선 되는데 클러스터에선 404" 가 난다. 함께 수정할 것.
#
# nginx 는 가장 긴 prefix 를 먼저 매칭하므로 작성 순서는 무관하다.
#
# 트레일링 슬래시를 일부러 안 붙인다. `location /api/orders/ {}` 처럼 슬래시를
# 붙이면 정확히 `/api/orders`(슬래시 없이 — CartController/OrderController/
# CardController 의 목록조회·생성 루트 엔드포인트가 바로 이 형태다)로 오는 요청이
# 매칭에서 빠진다. k8s Ingress 의 pathType: Prefix 는 경로를 세그먼트 단위로 봐서
# 이 문제가 없으므로, 여기서도 동일하게 동작하도록 슬래시 없이 통일한다.
server {
    listen 80;

    # --- ai-service (Deployment 2개로 갈린다. 로컬은 컨테이너 1개뿐이라 전부 ai:8080) ---
    location /api/ai/lion {
        proxy_pass http://ai:8080;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }
    location /api/ai/bot {
        proxy_pass http://ai:8080;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }
    # 1:1 상담 채팅 WebSocket. 일반 HTTP 프록시와 달리 프로토콜 업그레이드 헤더가
    # 필요하다 — 없으면 101 Switching Protocols 로 안 올라가고 그냥 HTTP 요청으로
    # 처리되다 끊긴다.
    location /ws/ai/chat {
        proxy_pass http://ai:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    # --- order-service ---
    location /api/orders {
        proxy_pass http://order:8080;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }
    location /api/cart {
        proxy_pass http://order:8080;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }
    location /api/coupons {
        proxy_pass http://order:8080;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }
    location /api/payments {
        proxy_pass http://order:8080;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    # --- member-service ---
    location /api/members {
        proxy_pass http://member:8080;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }
    location /api/auth {
        proxy_pass http://member:8080;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }
    location /api/cards {
        proxy_pass http://member:8080;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    # --- catalog-service ---
    # Catalog 외부 API는 서비스 접두사 하나로 라우팅한다(도서/리뷰/찜/최근본상품/
    # 카테고리/FAQ/문의/추천/이어읽기/관리자 API 전부 컨트롤러가 /api/catalog/** 아래
    # 있다 — 전수 스캔 결과 예외 없음).
    location /api/catalog {
        proxy_pass http://catalog:8080;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    # /internal/ 은 의도적으로 없다. 서비스 간 전용 경로이며
    # 외부에서 도달할 수 없어야 한다(k8s 에서는 NetworkPolicy 가 2차 방어선).

    location / {
        proxy_pass http://frontend:80;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }
}
