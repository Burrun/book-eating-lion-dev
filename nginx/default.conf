# 로컬에서 ALB Ingress 의 경로 라우팅을 흉내낸다.
# k8s/base/08-ingress.yaml 과 같은 규칙이어야 하며, 한쪽만 고치면
# "로컬에선 되는데 클러스터에선 404" 가 난다. 함께 수정할 것.
#
# nginx 는 가장 긴 prefix 를 먼저 매칭하므로 작성 순서는 무관하다.
#
# 🔴 location 접두사에 끝 슬래시를 붙이지 않는다. Ingress 의 pathType: Prefix 규칙이
#    /api/orders 이므로 여기도 같아야 한다. /api/orders/ 로 쓰면 컬렉션 자체를 부르는
#    GET/POST /api/orders 가 어디에도 걸리지 않고 location / 로 떨어져 프론트엔드가
#    응답한다 — 클러스터에선 200, 로컬에선 SPA HTML 이 오는 차이가 생긴다.
server {
    listen 80;

    # 🔴 upstream 주소를 변수에 담아 요청 시점에 해석한다. 이유가 둘이다.
    #
    # ① 서비스 하나가 죽어 있으면 nginx 자체가 뜨지 않는다. proxy_pass 에 호스트명을
    #    직접 쓰면 설정 로드 단계에서 이름을 해석하고, 실패하면 host not found in
    #    upstream 으로 전체가 죽는다 — ai 를 안 띄우면 도서 조회까지 막힌다.
    # ② 컨테이너를 재생성하면 IP 가 바뀌는데, 기동 시 1회 해석한 주소를 계속 물고 있어
    #    502 (Host is unreachable) 가 난다.
    #
    # 127.0.0.11 은 Docker 내장 DNS 다. valid=10s 로 캐시를 짧게 잡는다.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $ai_upstream      http://ai:8080;
    set $order_upstream   http://order:8080;
    set $member_upstream  http://member:8080;
    set $catalog_upstream http://catalog:8080;
    set $frontend_upstream http://frontend:80;

    # --- ai-service (Deployment 2개로 갈린다) ---
    location /api/ai/lion {
        proxy_pass $ai_upstream$request_uri;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }
    location /api/ai/bot {
        proxy_pass $ai_upstream$request_uri;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }
    # 1:1 상담 채팅 WebSocket. 일반 HTTP 프록시와 달리 프로토콜 업그레이드 헤더가
    # 필요하다 — 없으면 101 Switching Protocols 로 안 올라가고 그냥 HTTP 요청으로
    # 처리되다 끊긴다.
    location /ws/ai/chat {
        proxy_pass $ai_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    # --- order-service ---
    location /api/orders {
        proxy_pass $order_upstream$request_uri;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }
    location /api/cart {
        proxy_pass $order_upstream$request_uri;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }
    location /api/coupons {
        proxy_pass $order_upstream$request_uri;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }
    location /api/payments {
        proxy_pass $order_upstream$request_uri;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    # --- member-service ---
    location /api/members {
        proxy_pass $member_upstream$request_uri;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }
    location /api/auth {
        proxy_pass $member_upstream$request_uri;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }
    location /api/cards {
        proxy_pass $member_upstream$request_uri;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    # --- catalog-service ---
    # Catalog 외부 API는 서비스 접두사 하나로 라우팅한다(도서/리뷰/찜/최근본상품/
    # 카테고리/FAQ/문의/추천/이어읽기/관리자 API 전부 컨트롤러가 /api/catalog/** 아래
    # 있다 — 전수 스캔 결과 예외 없음).
    location /api/catalog {
        proxy_pass $catalog_upstream$request_uri;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    # /internal/ 은 의도적으로 없다. 서비스 간 전용 경로이며
    # 외부에서 도달할 수 없어야 한다(k8s 에서는 NetworkPolicy 가 2차 방어선).

    location / {
        proxy_pass $frontend_upstream$request_uri;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }
}
