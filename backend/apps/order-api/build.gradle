plugins {
    id 'org.springframework.boot'
}

bootJar {
    enabled = true
}

jar {
    enabled = false
}

dependencyManagement {
    imports {
        mavenBom 'software.amazon.awssdk:bom:2.46.7'
    }
}

dependencies {
    implementation project(':modules:common')
    implementation project(':modules:order')

    // cart 가 catalog-service 도서 조회를 동기 호출한다 — 이 서비스의 첫 outbound 통신(§7.6 예외).
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j'

    // 구매 확정 이벤트 발행 — ai-service 의 SqsPurchaseListener 가 book-purchase-queue 로 수신한다.
    implementation 'software.amazon.awssdk:sqs'

    // Liquibase — order_db 스키마만 (Phase 2-5)
    implementation 'org.liquibase:liquibase-core'

    runtimeOnly 'org.postgresql:postgresql'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'

    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'com.h2database:h2'
}
