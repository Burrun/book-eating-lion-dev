spring:
  config:
    import: classpath:application-redis-prod.yml,classpath:application-security-prod.yml

  datasource:
    # 쓰기 서비스라 Aurora Writer 로 간다. RDS Proxy 는 이쪽에만 붙인다
    # (ai_db 에 붙이면 Serverless v2 auto-pause 와 상충한다 — 판단 ②).
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=order_db&sslmode=${DB_SSL_MODE:require}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
        default_schema: order_db

  # ElastiCache. k8s configmap 이 주는 이름은 REDIS_HOST 이고 Boot 가 읽는 키는
  # spring.data.redis.host 다. 이 매핑이 없어서 prod 파드가 컨테이너 안
  # localhost:6379 를 찾고 있었다.
  # 기본값을 주지 않는다 — 미설정이면 조용히 로컬로 붙는 대신 기동이 실패해야 한다.
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

  flyway:
    enabled: false

  # RedissonConfig(재고 차감 분산 락)가 spring.data.redis.host/port 를 기본값 없이
  # 요구한다 — 없으면 기동 자체가 실패한다. 값 자체는 위 application-redis-prod.yml
  # import 로 온다(공유 파일 참고).

  # JWT(Cognito) 검증 설정은 application-security-prod.yml import 로 온다
  # (공유 파일 참고 — 4개 서비스가 같은 값을 쓴다).

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
