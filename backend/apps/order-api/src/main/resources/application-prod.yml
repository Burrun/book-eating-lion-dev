spring:
  config:
    import: classpath:application-redis-prod.yml

  datasource:
    # 쓰기 서비스라 Aurora Writer 로 간다. RDS Proxy 는 이쪽에만 붙인다
    # (ai_db 에 붙이면 Serverless v2 auto-pause 와 상충한다 — 판단 ②).
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=order_db&sslmode=require
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
        default_schema: order_db

  flyway:
    enabled: false

  # RedissonConfig(재고 차감 분산 락)가 spring.data.redis.host/port 를 기본값 없이
  # 요구한다 — 없으면 기동 자체가 실패한다. 값 자체는 위 application-redis-prod.yml
  # import 로 온다(공유 파일 참고).

  # SecurityConfig 가 .oauth2ResourceServer(oauth2 -> oauth2.jwt(...)) 로 JwtDecoder 빈을
  # 요구하는데 이 키가 없어서 기동이 실패하고 있었다(k8s/test 환경 구성 중 발견).
  # application-local.yml 과 동일한 패턴이며, 기본값을 두지 않은 것도 의도적이다 —
  # kakaopay.secret-key 와 같은 원칙으로, 값이 없으면 기동 자체가 실패해야 잘못된
  # 설정으로 조용히 뜨는 사고를 막는다.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://cognito-idp.${AWS_COGNITO_REGION}.amazonaws.com/${AWS_COGNITO_USER_POOL_ID}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
