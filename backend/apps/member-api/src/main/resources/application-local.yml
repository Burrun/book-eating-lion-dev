spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/bookdb?currentSchema=member_db
    username: member_svc
    password: member_pw
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
        default_schema: member_db

  flyway:
    enabled: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://cognito-idp.${AWS_COGNITO_REGION:ap-northeast-2}.amazonaws.com/${AWS_COGNITO_USER_POOL_ID:local_dummy_pool}

app:
  cognito:
    region: ${AWS_COGNITO_REGION:ap-northeast-2}
    user-pool-id: ${AWS_COGNITO_USER_POOL_ID:local_dummy_pool}
    client-id: ${AWS_COGNITO_CLIENT_ID:local_dummy_client_id}
    client-secret: ${AWS_COGNITO_CLIENT_SECRET:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
