spring:
  config:
    import: classpath:application-security-prod.yml

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=member_db&sslmode=${DB_SSL_MODE:require}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # 경량 서비스라 풀도 작다. replica 가 6개까지만 늘어나므로
      # Aurora 커넥션 총량이 예측 가능하다.
      maximum-pool-size: 8
      connection-timeout: 10000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
        default_schema: member_db

  # ElastiCache. k8s configmap 이 주는 이름은 REDIS_HOST 이고 Boot 가 읽는 키는
  # spring.data.redis.host 다. 이 매핑이 없어서 prod 파드가 컨테이너 안
  # localhost:6379 를 찾고 있었다.
  # 기본값을 주지 않는다 — 미설정이면 조용히 로컬로 붙는 대신 기동이 실패해야 한다.
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

  flyway:
    enabled: false

  # JWT(spring.security.oauth2.resourceserver.jwt) 검증 설정은
  # application-security-prod.yml import 로 온다(공유 파일 참고 — 4개
  # 서비스가 같은 값을 쓴다).

app:
  # 아래 cognito.* 는 회원가입/로그인 시 Cognito 에 명령을 보내는
  # CognitoIdentityProviderClient(발급자) 설정이다 - 위 JWT 검증(수신자) 설정과는
  # 반대 방향. 값 자체는 같은 Cognito User Pool 을 가리키지만 두 설정은 서로
  # 대체할 수 없다.
  cognito:
    region: ${AWS_COGNITO_REGION}
    user-pool-id: ${AWS_COGNITO_USER_POOL_ID}
    client-id: ${AWS_COGNITO_CLIENT_ID}
    client-secret: ${AWS_COGNITO_CLIENT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
