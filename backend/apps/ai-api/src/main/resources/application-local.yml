spring:
  datasource:
    # 다른 세 서비스와 같은 클러스터, 다른 스키마다. 격리는 ai_svc 계정 권한이 만든다.
    url: jdbc:postgresql://localhost:5432/bookdb?currentSchema=ai_db
    username: ai_svc
    password: ai_pw
    driver-class-name: org.postgresql.Driver
    hikari:
      # 질의 경로(POST /api/ai/ask)는 DB 를 아예 타지 않는다 — 먹인 책 목록은 Redis 에서
      # 읽고 벡터는 S3 Vectors 에 있다. DB 는 먹이기·문의 같은 저빈도 쓰기에만 쓰이므로
      # 유휴 커넥션을 붙들고 있을 이유가 없다.
      minimum-idle: 0
      idle-timeout: 60000
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: ai_db

  flyway:
    enabled: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://cognito-idp.${AWS_COGNITO_REGION:ap-northeast-2}.amazonaws.com/${AWS_COGNITO_USER_POOL_ID:local_dummy_pool}

app:
  ai:
    # 로컬은 AWS 자격증명 없이 뜬다. bedrock 으로 바꾸면 실제 호출이 나가고
    # 기동 시 S3 Vectors 인덱스 검증도 함께 돈다.
    clients: ${AI_CLIENTS:stub}
    bedrock:
      region: ${AWS_BEDROCK_REGION:ap-northeast-2}
    vector:
      bucket-name: ${AI_VECTOR_BUCKET:bel-wiki-vectors-local}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
