spring:
  datasource:
    # 다른 세 서비스와 같은 클러스터, 다른 스키마다. 격리는 ai_svc 계정 권한이 만든다.
    url: jdbc:postgresql://localhost:5432/bookdb?currentSchema=ai_db
    username: ai_svc
    password: ai_pw
    driver-class-name: org.postgresql.Driver
    hikari:
      # 질의 경로(POST /api/ai/ask)는 DB 를 아예 타지 않는다 — 먹인 책 목록은 Redis 에서
      # 읽고 벡터는 S3 Vectors 에 있다. DB 는 먹이기·문의 같은 저빈도 쓰기에만 쓰이므로
      # 유휴 커넥션을 붙들고 있을 이유가 없다.
      minimum-idle: 0
      idle-timeout: 60000
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: ai_db

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://cognito-idp.${AWS_COGNITO_REGION:ap-northeast-2}.amazonaws.com/${AWS_COGNITO_USER_POOL_ID:local_dummy_pool}

app:
  ai:
    # 스텁 구현은 없다. bedrock 이 유일한 값이며, 로컬도 실제 Bedrock / S3 Vectors 를 호출한다.
    # 따라서 기동에 AWS 자격증명이 필요하고, 기동 시 S3 Vectors 인덱스 검증도 함께 돈다.
    clients: ${AI_CLIENTS:bedrock}
    bedrock:
      region: ${AWS_BEDROCK_REGION:ap-northeast-2}
    vector:
      bucket-name: ${AI_VECTOR_BUCKET:final-team3-wiki-vectors-prod}
      recommendation-index-name: ${AI_RECOMMENDATION_VECTOR_INDEX:recommendation-books-v1}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
