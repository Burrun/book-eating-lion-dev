spring:
  datasource:
    url: jdbc:mysql://localhost:3306/bookdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: devuser
    password: devpassword
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

  data:
    redis:
      host: localhost
      port: 6379

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# JWT 설정: 시크릿 키는 절대 하드코딩하지 않고 환경변수(JWT_SECRET_KEY / JWT_SECRET_KEY_RT)로 주입한다.
# 로컬 개발 편의를 위한 기본값만 제공되며, 운영 환경에서는 반드시 별도의 강력한 키로 덮어써야 한다.
jwt:
  secretKey: ${JWT_SECRET_KEY:VGhpc0lzQVNlY3JldEtleUZvckpXVFRva2VuR2VuZXJhdGlvbjEyMzQ1Njc4kw==}
  secretKeyRt: ${JWT_SECRET_KEY_RT:VGhpc0lzQVJlZnJlc2hLZXlGb3JKV1RUb2tlbkdlbmVyYXRpb24xMjM0NTY3OA==}
  access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}   # 15분
  refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:1209600000} # 14일

app:
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
