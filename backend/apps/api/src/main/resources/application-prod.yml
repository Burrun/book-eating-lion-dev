spring:
  datasource:
    # DB_HOST 는 lion-db 네임스페이스의 ExternalName 서비스(→ RDS)를 가리킨다.
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000

  jpa:
    hibernate:
      # 스키마 마이그레이션을 Flyway 로 옮기면 validate 로 바꿀 것
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        default_batch_fetch_size: 100

  flyway:
    # db/migration 스크립트가 아직 없으므로 비활성화.
    # 마이그레이션 도입 시 true 로 바꾸고 ddl-auto 를 validate 로 내릴 것.
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      # k8s readiness/liveness probe 용 하위 경로를 노출
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
