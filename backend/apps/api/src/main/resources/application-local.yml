spring:
  datasource:
    url: jdbc:mysql://localhost:3306/bookdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: devuser
    password: devpassword
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

  flyway:
    # db/migration 스크립트가 아직 없으므로 비활성화 (application-prod.yml 과 동일).
    # 켜져 있으면 스키마가 이미 있는 DB(초기 데모 데이터 적재 등)에서
    # "Found non-empty schema but no schema history table" 로 기동이 실패한다.
    enabled: false

  data:
    redis:
      host: localhost
      port: 6379

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://cognito-idp.${AWS_COGNITO_REGION:ap-northeast-2}.amazonaws.com/${AWS_COGNITO_USER_POOL_ID:local_dummy_pool}

app:
  cognito:
    region: ${AWS_COGNITO_REGION:ap-northeast-2}
    user-pool-id: ${AWS_COGNITO_USER_POOL_ID:local_dummy_pool}
    client-id: ${AWS_COGNITO_CLIENT_ID:local_dummy_client_id}
    client-secret: ${AWS_COGNITO_CLIENT_SECRET:local_dummy_client_secret}
  s3:
    bucket: ${AWS_S3_BUCKET:book-eating-lion-local}
    region: ${AWS_S3_REGION:ap-northeast-2}
    access-key: ${AWS_ACCESS_KEY_ID:local-access-key}
    secret-key: ${AWS_SECRET_ACCESS_KEY:local-secret-key}
  kakao:
    api-key: ${KAKAO_API_KEY:}
  aladin:
    api-key: ${ALADIN_API_KEY:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
