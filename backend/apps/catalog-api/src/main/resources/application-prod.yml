spring:
  config:
    import: classpath:application-redis-prod.yml,classpath:application-security-prod.yml

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
        default_schema: catalog_db

  # ElastiCache. k8s configmap 이 주는 이름은 REDIS_HOST 이고 Boot 가 읽는 키는
  # spring.data.redis.host 다. 이 매핑이 없어서 prod 파드가 컨테이너 안
  # localhost:6379 를 찾고 있었다.
  # 기본값을 주지 않는다 — 미설정이면 조용히 로컬로 붙는 대신 기동이 실패해야 한다.
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  # ReviewPermissionStreamConfig(Redis Streams 컨슈머 그룹)가 spring.data.redis.host/port
  # 를 쓴다. 값이 없으면 Redis 연결이 조용히 localhost:6379 로 fallback 해서, order-service
  # 가 발행하는 구매 후 리뷰 작성 권한 이벤트를 영원히 못 받는다. 값 자체는 위
  # application-redis-prod.yml import 로 온다(공유 파일 참고).

  # JWT(Cognito) 검증 설정은 application-security-prod.yml import 로 온다
  # (공유 파일 참고 — 4개 서비스가 같은 값을 쓴다).

# 표준 spring.datasource가 아니라 app.datasource.{writer,reader}로 둔 이유는
# RoutingDataSourceConfig가 이 둘을 각각 HikariDataSource로 바인딩해서 하나의
# RoutingDataSource로 합치기 때문이다. spring.datasource를 그대로 쓰면 Spring
# Boot가 자동으로 또 다른 DataSource를 만들려고 해서 충돌한다.
#
# 읽기 95%라 reader 풀을 writer보다 넉넉히 잡는다. dev EC2/prod RDS 둘 다
# 여러 Pod가 커넥션 한도를 나눠 써야 해서 Pod당 풀 크기를 configmap으로
# 조절할 수 있게 남겨둔다(DB_WRITER_POOL_SIZE/DB_READER_POOL_SIZE).
# reader는 RDS Proxy를 거치지 않고 리플리카에 직접 붙는다 - Proxy가 커넥션을
# 흡수해주는 writer와 달리, Pod 수 × 이 값이 DB 자체의 max_connections를
# 그대로 압박한다.
app:
  datasource:
    writer:
      jdbc-url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=catalog_db&sslmode=${DB_SSL_MODE:require}
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
      driver-class-name: org.postgresql.Driver
      maximum-pool-size: ${DB_WRITER_POOL_SIZE:3}
      minimum-idle: 0
      connection-timeout: 10000
    reader:
      jdbc-url: jdbc:postgresql://${DB_READER_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=catalog_db&sslmode=${DB_SSL_MODE:require}
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
      driver-class-name: org.postgresql.Driver
      maximum-pool-size: ${DB_READER_POOL_SIZE:8}
      minimum-idle: 0
      connection-timeout: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
