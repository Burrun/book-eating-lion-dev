spring:
  config:
    import: classpath:application-redis-prod.yml

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=catalog_db&sslmode=require
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # catalog 는 읽기 95% 라 커넥션을 넉넉히 잡는다.
      maximum-pool-size: 15
      connection-timeout: 10000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
        default_schema: catalog_db

  flyway:
    enabled: false

  # ReviewPermissionStreamConfig(Redis Streams 컨슈머 그룹)가 spring.data.redis.host/port
  # 를 쓴다. 값이 없으면 Redis 연결이 조용히 localhost:6379 로 fallback 해서, order-service
  # 가 발행하는 구매 후 리뷰 작성 권한 이벤트를 영원히 못 받는다. 값 자체는 위
  # application-redis-prod.yml import 로 온다(공유 파일 참고).

  # SecurityConfig 가 .oauth2ResourceServer(oauth2 -> oauth2.jwt(...)) 로 JwtDecoder 빈을
  # 요구하는데 이 키가 없어서 기동이 실패하고 있었다(k8s/test 환경 구성 중 발견).
  # application-local.yml 과 동일한 패턴, 기본값 없음은 의도적(값 누락 시 조용히
  # 잘못 뜨는 대신 기동 실패로 드러나게 한다).
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://cognito-idp.${AWS_COGNITO_REGION}.amazonaws.com/${AWS_COGNITO_USER_POOL_ID}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
