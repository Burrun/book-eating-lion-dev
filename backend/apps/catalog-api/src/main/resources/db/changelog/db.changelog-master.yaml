# --- 하이라이트 메모 도입 / 완독 요약 메모 폐기 ---------------------------------
# 먹이기 대상이 "완독 요약 메모"에서 "완독한 책"으로 바뀌었다. 메모는 EPUB 뷰어에서
# 문장 단위로 여러 개 남기는 개인 기록이 되고(book_highlights), 사자에게 먹였다는 표시는
# book_memos.fed_at 에서 reading_progress.fed_at 으로 옮겨간다.
- changeSet:
    id: highlight-memo-1
    author: burrun
    preConditions:
    - onFail: MARK_RAN
    - not:
      - tableExists:
          tableName: book_highlights
    changes:
    - createTable:
        columns:
        - column:
            autoIncrement: true
            constraints:
              nullable: false
              primaryKey: true
              primaryKeyName: book_highlights_pkey
            name: book_highlight_id
            type: BIGINT
        - column:
            name: created_at
            type: TIMESTAMP WITHOUT TIME ZONE
        - column:
            name: updated_at
            type: TIMESTAMP WITHOUT TIME ZONE
        - column:
            constraints:
              nullable: false
            name: member_sub
            type: VARCHAR(255)
        - column:
            constraints:
              nullable: false
            name: book_id
            type: BIGINT
        - column:
            constraints:
              nullable: false
            name: cfi_range
            type: VARCHAR(500)
        - column:
            constraints:
              nullable: false
            name: selected_text
            type: VARCHAR(2000)
        - column:
            name: memo_text
            type: VARCHAR(4000)
        tableName: book_highlights
- changeSet:
    id: highlight-memo-2
    author: burrun
    preConditions:
    - onFail: MARK_RAN
    - not:
      - foreignKeyConstraintExists:
          foreignKeyTableName: book_highlights
          foreignKeyName: fk_book_highlights_book
    changes:
