plugins {
    id 'org.springframework.boot'
}

bootJar {
    enabled = true
}

jar {
    enabled = false
}

dependencies {
    // 자기 도메인 + common 만. modules:order / modules:member 를 참조하면
    // backend-ci.yml 의 의존 규칙 검사가 빌드를 깨뜨린다 (§7.2).
    implementation project(':modules:common')
    implementation project(':modules:book')

    // 재고 조회는 order-service 를 거친다 — 동기 통신 2건이 여기 붙는다.
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j'

    // Flyway — catalog_db 스키마만 마이그레이션한다 (Phase 2-5)
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    runtimeOnly 'org.postgresql:postgresql'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation platform('software.amazon.awssdk:bom:2.46.7')
    implementation 'software.amazon.awssdk:sesv2'
    implementation 'software.amazon.awssdk:s3'

    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'com.h2database:h2'
}
