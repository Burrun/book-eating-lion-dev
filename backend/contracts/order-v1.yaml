openapi: 3.0.3
info:
  title: order-service API
  version: "1.0.0"
  description: |
    주문·결제·배송·재고. 재고를 이 서비스가 소유한다(Phase 0-1 / 판단 ③).

    /internal/** 은 서비스 간 전용이며 Ingress 로 외부에 노출되지 않는다.
    이 파일이 계약이자 mock 이다 — Prism 이 그대로 mock 서버로 띄우므로
    계약과 mock 사이에 drift 가 생길 수 없다.

servers:
  - url: http://localhost:8082
    description: 로컬
  - url: http://order-service.lion-app.svc.cluster.local:8080
    description: 클러스터 내부 (K8s Service DNS)

paths:
  /internal/inventory:
    get:
      summary: 재고 벌크 조회
      description: |
        **반드시 벌크다.** 단건 API 를 제공하면 도서 목록 화면에서 반드시 N+1 이 난다.
        도서 20건을 렌더링할 때 호출은 1회여야 한다(Phase 1 catalog 검증 기준).

        catalog-service 가 유일한 호출자이며, 이 서비스가 죽으면 catalog 는
        fallback 으로 빈 배열을 받아 재고 영역만 degrade 한다.
      operationId: findInventoryByBookIds
      tags: [internal-inventory]
      parameters:
        - name: bookIds
          in: query
          required: true
          description: 조회할 도서 ID 목록 (콤마 구분)
          schema:
            type: array
            items:
              type: integer
              format: int64
          style: form
          explode: false
          example: [1, 2, 3]
      responses:
        "200":
          description: 조회 성공. 재고 레코드가 없는 bookId 는 응답에서 생략된다.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryView"
              example:
                - bookId: 1
                  stock: 100
                - bookId: 2
                  stock: 0

  /internal/inventory/{bookId}/restock:
    post:
      summary: 관리자 입고 반영
      description: |
        catalog-service 는 order_db 에 쓰기 권한이 없으므로(판단 ②) 입고를 이 API 로 위임한다.
        저빈도·비실시간이라 동기 호출로 충분하다. 실패 시 관리자에게 에러를 반환하고 재시도한다.

        재고 레코드가 없으면 이 호출에서 생성된다(신간 최초 입고).
      operationId: restockInventory
      tags: [internal-inventory]
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestockRequest"
      responses:
        "200":
          description: 입고 반영 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryView"
              example:
                bookId: 1
                stock: 150
        "400":
          description: 수량이 1 미만

  /api/orders/{orderId}/delivery:
    get:
      summary: 배송 상태 조회
      description: |
        소유권은 JWT 의 member_id 클레임으로 검증한다.
        member-service 를 호출하지 않는다(판단 ③ — 호출 자체를 제거).
      operationId: getDelivery
      tags: [delivery]
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryEnvelope"
        "403":
          description: 타인의 주문
        "404":
          description: 주문 또는 배송 정보 없음

  /api/cart:
    get:
      summary: 장바구니 목록 조회
      description: |
        cart_items 는 order_db 소유이며 book_id 는 FK 가 아니다(경계 밖).
        도서 제목/가격/이미지는 catalog-service 를 동기 호출(Feign)해 조합한다 —
        이 서비스의 첫 outbound 동기 호출이다(§7.6 예외). catalog-service 가 응답하지
        않으면 항목별로 title="정보 조회 불가", price=0 으로 degrade 되어 200 을 반환한다.
      operationId: getCart
      tags: [cart]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartEnvelope"

    post:
      summary: 장바구니 담기
      description: |
        (member_id, book_id) 가 이미 있으면 quantity 를 누적하는 upsert 다.
        UNIQUE (member_id, book_id) 제약이 동시 요청에서의 중복 행 생성을 막는다.
      operationId: addCartItem
      tags: [cart]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCartItemRequest"
      responses:
        "200":
          description: 담기(또는 수량 누적) 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartItemEnvelope"
        "400":
          description: quantity 가 1 미만이거나 bookId 누락

  /api/cart/{cartItemId}:
    patch:
      summary: 장바구니 항목 수량 변경
      operationId: changeCartItemQuantity
      tags: [cart]
      security:
        - bearerAuth: []
      parameters:
        - name: cartItemId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeCartItemQuantityRequest"
      responses:
        "200":
          description: 변경 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartItemEnvelope"
        "400":
          description: quantity 가 1 미만
        "403":
          description: 타인의 장바구니 항목
        "404":
          description: 존재하지 않는 항목

    delete:
      summary: 장바구니 항목 삭제
      operationId: removeCartItem
      tags: [cart]
      security:
        - bearerAuth: []
      parameters:
        - name: cartItemId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: 삭제 완료
        "403":
          description: 타인의 장바구니 항목
        "404":
          description: 존재하지 않는 항목

  /api/coupons/me:
    get:
      summary: 보유 쿠폰 목록 조회
      description: |
        미사용(is_used=false)이면서 만료되지 않은(expires_at > now) 쿠폰만 반환한다.
        사용했거나 만료된 쿠폰은 이 목록에서 조용히 제외된다 — 별도 상태 필터가 없다.
      operationId: getMyCoupons
      tags: [coupon]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberCouponListEnvelope"

  /api/coupons/register:
    post:
      summary: 쿠폰 코드로 쿠폰 등록/발급
      description: |
        UNIQUE (member_id, coupon_id) 제약과 동일한 규칙을 서비스 레벨에서도 검증한다 —
        이미 보유한 쿠폰이면 409, 만료된 쿠폰이면 400, 존재하지 않는 코드면 404.
      operationId: registerCoupon
      tags: [coupon]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterCouponRequest"
      responses:
        "200":
          description: 등록 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberCouponEnvelope"
        "400":
          description: 만료된 쿠폰
        "404":
          description: 존재하지 않는 쿠폰 코드
        "409":
          description: 이미 보유한 쿠폰

  /api/orders:
    post:
      summary: 주문 생성 및 결제 승인
      description: |
        도서 가격은 요청 바디를 신뢰하지 않고 catalog-service 에서 서버 단으로 재조회한다
        (CatalogClient — cart 와 공유하는 §7.6 예외). 재고 차감은 bookId 오름차순으로
        정렬한 뒤 Redis 분산 락을 순서대로 획득해 데드락을 막는다.

        paymentMethod=CARD 면 member-service 의 가상카드 한도를 동기 차감한다
        (§7.6 두 번째 예외 — CardClient). 차감이 거절되거나 member-service 가 응답하지
        않으면 결제 전체가 거절되며 재고 차감도 롤백된다(단일 트랜잭션).
        paymentMethod=KAKAOPAY 는 이 서비스가 승인번호/PG 거래ID 를 목(mock) 생성한다 —
        실제 PG 연동 전이다.
      operationId: createOrder
      tags: [order]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "200":
          description: 주문 생성 및 결제 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetailEnvelope"
        "400":
          description: 재고 부족, 쿠폰 최소주문금액 미달, 만료된 쿠폰, cardId 누락 등
        "402":
          description: 결제 거절(한도 초과 등)
        "403":
          description: 본인 소유가 아닌 쿠폰
        "404":
          description: 존재하지 않는 도서 또는 쿠폰
        "503":
          description: catalog-service 응답 없음 — 가격을 신뢰할 수 없어 주문을 생성하지 않는다

  /api/orders/{orderId}:
    get:
      summary: 주문 상세 조회
      description: 주문 정보 + 주문 상품 목록 + 결제 내역을 한 번에 반환한다.
      operationId: getOrder
      tags: [order]
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetailEnvelope"
        "403":
          description: 타인의 주문
        "404":
          description: 존재하지 않는 주문

  /api/orders/{orderId}/cancel:
    post:
      summary: 주문 취소
      description: |
        PAID 상태인 주문만 취소할 수 있다. 재고 복구, 쿠폰 미사용 원복, 가상카드 한도
        복구(CARD 결제인 경우)를 단일 트랜잭션으로 처리한다 — 카드 한도 복구가 실패하면
        재고·쿠폰 복구를 포함해 전부 롤백되고 주문은 PAID 상태로 남는다(부분 취소 방지).
      operationId: cancelOrder
      tags: [order]
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 취소 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetailEnvelope"
        "403":
          description: 타인의 주문
        "404":
          description: 존재하지 않는 주문
        "409":
          description: PAID 상태가 아니어서 취소할 수 없음(카드 한도 복구 실패 포함)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    InventoryView:
      type: object
      required: [bookId, stock]
      properties:
        bookId:
          type: integer
          format: int64
        stock:
          type: integer
          minimum: 0

    RestockRequest:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 1
          example: 50

    DeliveryEnvelope:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/DeliveryResponse"

    DeliveryResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        orderId:
          type: integer
          format: int64
        courierCompany:
          type: string
          example: CJ대한통운
        trackingNumber:
          type: string
          example: "123456789"
        deliveryStatus:
          type: string
          enum: [READY, SHIPPED, IN_TRANSIT, DELIVERED]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AddCartItemRequest:
      type: object
      required: [bookId, quantity]
      properties:
        bookId:
          type: integer
          format: int64
        quantity:
          type: integer
          minimum: 1
          default: 1

    ChangeCartItemQuantityRequest:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 1

    CartItemView:
      type: object
      properties:
        cartItemId:
          type: integer
          format: int64
        bookId:
          type: integer
          format: int64
        title:
          type: string
          example: 클라우드 엔지니어링 교재
        price:
          type: integer
          example: 25000
        coverImageUrl:
          type: string
        quantity:
          type: integer
        subtotal:
          type: integer
          format: int64
          description: price * quantity

    CartResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItemView"
        totalQuantity:
          type: integer
        totalPrice:
          type: integer
          format: int64

    CartEnvelope:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/CartResponse"

    CartItemEnvelope:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/CartItemView"

    ErrorDetail:
      type: object
      properties:
        code:
          type: string
        message:
          type: string

    RegisterCouponRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          example: WELCOME3000

    MemberCouponView:
      type: object
      properties:
        memberCouponId:
          type: integer
          format: int64
        couponId:
          type: integer
          format: int64
        couponCode:
          type: string
          example: WELCOME3000
        couponName:
          type: string
          example: 신규 가입 3000원 할인
        discountAmount:
          type: integer
          example: 3000
        minimumOrderAmount:
          type: integer
          example: 10000
        expiresAt:
          type: string
          format: date-time

    MemberCouponListEnvelope:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/MemberCouponView"
        error:
          $ref: "#/components/schemas/ErrorDetail"
          nullable: true

    MemberCouponEnvelope:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/MemberCouponView"
        error:
          $ref: "#/components/schemas/ErrorDetail"
          nullable: true

    OrderItemRequest:
      type: object
      required: [bookId, quantity]
      properties:
        bookId:
          type: integer
          format: int64
        quantity:
          type: integer
          minimum: 1

    Recipient:
      type: object
      required: [name, phone, postalCode, address]
      properties:
        name:
          type: string
        phone:
          type: string
          example: "010-1234-5678"
        postalCode:
          type: string
          example: "06236"
        address:
          type: string

    CreateOrderRequest:
      type: object
      required: [items, recipient, paymentMethod]
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderItemRequest"
        memberCouponId:
          type: integer
          format: int64
          nullable: true
        recipient:
          $ref: "#/components/schemas/Recipient"
        paymentMethod:
          type: string
          enum: [CARD, KAKAOPAY]
        cardId:
          type: integer
          format: int64
          nullable: true
          description: paymentMethod=CARD 일 때 필수.

    OrderItemView:
      type: object
      properties:
        orderItemId:
          type: integer
          format: int64
        bookId:
          type: integer
          format: int64
        bookTitle:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: integer

    PaymentView:
      type: object
      properties:
        paymentId:
          type: integer
          format: int64
        paymentMethod:
          type: string
          enum: [CARD, KAKAOPAY]
        amount:
          type: integer
        paymentStatus:
          type: string
          enum: [APPROVED, DECLINED, CANCELLED]
        approvalNumber:
          type: string
        pgTid:
          type: string

    OrderResponse:
      type: object
      properties:
        orderId:
          type: integer
          format: int64
        orderStatus:
          type: string
          enum: [PENDING_PAYMENT, PAID, CANCELLED]
        recipient:
          $ref: "#/components/schemas/Recipient"
        totalAmount:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItemView"
        payment:
          $ref: "#/components/schemas/PaymentView"

    OrderDetailEnvelope:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/OrderResponse"
        error:
          $ref: "#/components/schemas/ErrorDetail"
          nullable: true
