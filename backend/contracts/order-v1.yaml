openapi: 3.0.3
info:
  title: order-service API
  version: "1.0.0"
  description: |
    주문·결제·배송·재고. 재고를 이 서비스가 소유한다(Phase 0-1 / 판단 ③).

    /internal/** 은 서비스 간 전용이며 Ingress 로 외부에 노출되지 않는다.
    이 파일이 계약이자 mock 이다 — Prism 이 그대로 mock 서버로 띄우므로
    계약과 mock 사이에 drift 가 생길 수 없다.

servers:
  - url: http://localhost:8082
    description: 로컬
  - url: http://order-service.lion-app.svc.cluster.local:8080
    description: 클러스터 내부 (K8s Service DNS)

paths:
  /internal/inventory:
    get:
      summary: 재고 벌크 조회
      description: |
        **반드시 벌크다.** 단건 API 를 제공하면 도서 목록 화면에서 반드시 N+1 이 난다.
        도서 20건을 렌더링할 때 호출은 1회여야 한다(Phase 1 catalog 검증 기준).

        catalog-service 가 유일한 호출자이며, 이 서비스가 죽으면 catalog 는
        fallback 으로 빈 배열을 받아 재고 영역만 degrade 한다.
      operationId: findInventoryByBookIds
      tags: [internal-inventory]
      parameters:
        - name: bookIds
          in: query
          required: true
          description: 조회할 도서 ID 목록 (콤마 구분)
          schema:
            type: array
            items:
              type: integer
              format: int64
          style: form
          explode: false
          example: [1, 2, 3]
      responses:
        "200":
          description: 조회 성공. 재고 레코드가 없는 bookId 는 응답에서 생략된다.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryView"
              example:
                - bookId: 1
                  stock: 100
                - bookId: 2
                  stock: 0

  /internal/inventory/{bookId}/restock:
    post:
      summary: 관리자 입고 반영
      description: |
        catalog-service 는 order_db 에 쓰기 권한이 없으므로(판단 ②) 입고를 이 API 로 위임한다.
        저빈도·비실시간이라 동기 호출로 충분하다. 실패 시 관리자에게 에러를 반환하고 재시도한다.

        재고 레코드가 없으면 이 호출에서 생성된다(신간 최초 입고).
      operationId: restockInventory
      tags: [internal-inventory]
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestockRequest"
      responses:
        "200":
          description: 입고 반영 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryView"
              example:
                bookId: 1
                stock: 150
        "400":
          description: 수량이 1 미만

  /api/orders/{orderId}/delivery:
    get:
      summary: 배송 상태 조회
      description: |
        소유권은 JWT 의 member_id 클레임으로 검증한다.
        member-service 를 호출하지 않는다(판단 ③ — 호출 자체를 제거).
      operationId: getDelivery
      tags: [delivery]
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryEnvelope"
        "403":
          description: 타인의 주문
        "404":
          description: 주문 또는 배송 정보 없음

  /api/cart:
    get:
      summary: 장바구니 목록 조회
      description: |
        cart_items 는 order_db 소유이며 book_id 는 FK 가 아니다(경계 밖).
        도서 제목/가격/이미지는 catalog-service 를 동기 호출(Feign)해 조합한다 —
        이 서비스의 첫 outbound 동기 호출이다(§7.6 예외). catalog-service 가 응답하지
        않으면 항목별로 title="정보 조회 불가", price=0 으로 degrade 되어 200 을 반환한다.
      operationId: getCart
      tags: [cart]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartEnvelope"

    post:
      summary: 장바구니 담기
      description: |
        (member_id, book_id) 가 이미 있으면 quantity 를 누적하는 upsert 다.
        UNIQUE (member_id, book_id) 제약이 동시 요청에서의 중복 행 생성을 막는다.
      operationId: addCartItem
      tags: [cart]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCartItemRequest"
      responses:
        "200":
          description: 담기(또는 수량 누적) 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartItemEnvelope"
        "400":
          description: quantity 가 1 미만이거나 bookId 누락

  /api/cart/{cartItemId}:
    patch:
      summary: 장바구니 항목 수량 변경
      operationId: changeCartItemQuantity
      tags: [cart]
      security:
        - bearerAuth: []
      parameters:
        - name: cartItemId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeCartItemQuantityRequest"
      responses:
        "200":
          description: 변경 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartItemEnvelope"
        "400":
          description: quantity 가 1 미만
        "403":
          description: 타인의 장바구니 항목
        "404":
          description: 존재하지 않는 항목

    delete:
      summary: 장바구니 항목 삭제
      operationId: removeCartItem
      tags: [cart]
      security:
        - bearerAuth: []
      parameters:
        - name: cartItemId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: 삭제 완료
        "403":
          description: 타인의 장바구니 항목
        "404":
          description: 존재하지 않는 항목

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    InventoryView:
      type: object
      required: [bookId, stock]
      properties:
        bookId:
          type: integer
          format: int64
        stock:
          type: integer
          minimum: 0

    RestockRequest:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 1
          example: 50

    DeliveryEnvelope:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/DeliveryResponse"

    DeliveryResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        orderId:
          type: integer
          format: int64
        courierCompany:
          type: string
          example: CJ대한통운
        trackingNumber:
          type: string
          example: "123456789"
        deliveryStatus:
          type: string
          enum: [READY, SHIPPED, IN_TRANSIT, DELIVERED]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AddCartItemRequest:
      type: object
      required: [bookId, quantity]
      properties:
        bookId:
          type: integer
          format: int64
        quantity:
          type: integer
          minimum: 1
          default: 1

    ChangeCartItemQuantityRequest:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 1

    CartItemView:
      type: object
      properties:
        cartItemId:
          type: integer
          format: int64
        bookId:
          type: integer
          format: int64
        title:
          type: string
          example: 클라우드 엔지니어링 교재
        price:
          type: integer
          example: 25000
        coverImageUrl:
          type: string
        quantity:
          type: integer
        subtotal:
          type: integer
          format: int64
          description: price * quantity

    CartResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItemView"
        totalQuantity:
          type: integer
        totalPrice:
          type: integer
          format: int64

    CartEnvelope:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/CartResponse"

    CartItemEnvelope:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/CartItemView"
