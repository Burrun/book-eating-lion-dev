openapi: 3.0.3
info:
  title: order-service API
  version: "1.0.0"
  description: |
    주문·결제·배송·재고. 재고를 이 서비스가 소유한다(Phase 0-1 / 판단 ③).

    /internal/** 은 서비스 간 전용이며 Ingress 로 외부에 노출되지 않는다.
    이 파일이 계약이자 mock 이다 — Prism 이 그대로 mock 서버로 띄우므로
    계약과 mock 사이에 drift 가 생길 수 없다.

servers:
  - url: http://localhost:8082
    description: 로컬
  - url: http://order-service.lion-app.svc.cluster.local:8080
    description: 클러스터 내부 (K8s Service DNS)

paths:
  /internal/inventory:
    get:
      summary: 재고 벌크 조회
      description: |
        **반드시 벌크다.** 단건 API 를 제공하면 도서 목록 화면에서 반드시 N+1 이 난다.
        도서 20건을 렌더링할 때 호출은 1회여야 한다(Phase 1 catalog 검증 기준).

        catalog-service 가 유일한 호출자이며, 이 서비스가 죽으면 catalog 는
        fallback 으로 빈 배열을 받아 재고 영역만 degrade 한다.
      operationId: findInventoryByBookIds
      tags: [internal-inventory]
      parameters:
        - name: bookIds
          in: query
          required: true
          description: 조회할 도서 ID 목록 (콤마 구분)
          schema:
            type: array
            items:
              type: integer
              format: int64
          style: form
          explode: false
          example: [1, 2, 3]
      responses:
        "200":
          description: 조회 성공. 재고 레코드가 없는 bookId 는 응답에서 생략된다.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryView"
              example:
                - bookId: 1
                  stock: 100
                - bookId: 2
                  stock: 0

  /internal/inventory/{bookId}/restock:
    post:
      summary: 관리자 입고 반영
      description: |
        catalog-service 는 order_db 에 쓰기 권한이 없으므로(판단 ②) 입고를 이 API 로 위임한다.
        저빈도·비실시간이라 동기 호출로 충분하다. 실패 시 관리자에게 에러를 반환하고 재시도한다.

        재고 레코드가 없으면 이 호출에서 생성된다(신간 최초 입고).
      operationId: restockInventory
      tags: [internal-inventory]
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestockRequest"
      responses:
        "200":
          description: 입고 반영 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryView"
              example:
                bookId: 1
                stock: 150
        "400":
          description: 수량이 1 미만

  /api/orders/{orderId}/delivery:
    get:
      summary: 배송 상태 조회
      description: |
        소유권은 JWT 의 member_id 클레임으로 검증한다.
        member-service 를 호출하지 않는다(판단 ③ — 호출 자체를 제거).
      operationId: getDelivery
      tags: [delivery]
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryEnvelope"
        "403":
          description: 타인의 주문
        "404":
          description: 주문 또는 배송 정보 없음

  /api/cart:
    get:
      summary: 장바구니 목록 조회
      description: |
        cart_items 는 order_db 소유이며 book_id 는 FK 가 아니다(경계 밖).
        도서 제목/가격/이미지는 catalog-service 를 동기 호출(Feign)해 조합한다 —
        이 서비스의 첫 outbound 동기 호출이다(§7.6 예외). catalog-service 가 응답하지
        않으면 항목별로 title="정보 조회 불가", price=0 으로 degrade 되어 200 을 반환한다.
      operationId: getCart
      tags: [cart]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartEnvelope"

    post:
      summary: 장바구니 담기
      description: |
        (member_id, book_id) 가 이미 있으면 quantity 를 누적하는 upsert 다.
        UNIQUE (member_id, book_id) 제약이 동시 요청에서의 중복 행 생성을 막는다.
      operationId: addCartItem
      tags: [cart]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCartItemRequest"
      responses:
        "200":
          description: 담기(또는 수량 누적) 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartItemEnvelope"
        "400":
          description: quantity 가 1 미만이거나 bookId 누락

  /api/cart/{cartItemId}:
    patch:
      summary: 장바구니 항목 수량 변경
      operationId: changeCartItemQuantity
      tags: [cart]
      security:
        - bearerAuth: []
      parameters:
        - name: cartItemId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeCartItemQuantityRequest"
      responses:
        "200":
          description: 변경 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartItemEnvelope"
        "400":
          description: quantity 가 1 미만
        "403":
          description: 타인의 장바구니 항목
        "404":
          description: 존재하지 않는 항목

    delete:
      summary: 장바구니 항목 삭제
      operationId: removeCartItem
      tags: [cart]
      security:
        - bearerAuth: []
      parameters:
        - name: cartItemId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: 삭제 완료
        "403":
          description: 타인의 장바구니 항목
        "404":
          description: 존재하지 않는 항목

  /api/coupons/me:
    get:
      summary: 보유 쿠폰 목록 조회
      description: |
        미사용(is_used=false)이면서 만료되지 않은(expires_at > now) 쿠폰만 반환한다.
        사용했거나 만료된 쿠폰은 이 목록에서 조용히 제외된다 — 별도 상태 필터가 없다.
      operationId: getMyCoupons
      tags: [coupon]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberCouponListEnvelope"

  /api/coupons/register:
    post:
      summary: 쿠폰 코드로 쿠폰 등록/발급
      description: |
        UNIQUE (member_id, coupon_id) 제약과 동일한 규칙을 서비스 레벨에서도 검증한다 —
        이미 보유한 쿠폰이면 409, 만료된 쿠폰이면 400, 존재하지 않는 코드면 404.
      operationId: registerCoupon
      tags: [coupon]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterCouponRequest"
      responses:
        "200":
          description: 등록 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberCouponEnvelope"
        "400":
          description: 만료된 쿠폰
        "404":
          description: 존재하지 않는 쿠폰 코드
        "409":
          description: 이미 보유한 쿠폰

  /api/orders:
    post:
      summary: 주문 생성 (CARD 는 결제 승인까지, KAKAOPAY 는 결제 준비까지)
      description: |
        도서 가격은 요청 바디를 신뢰하지 않고 catalog-service 에서 서버 단으로 재조회한다
        (CatalogClient — cart 와 공유하는 §7.6 예외). 재고 재고확인/차감은 bookId 오름차순으로
        정렬한 뒤 Redis 분산 락을 순서대로 획득해 데드락을 막는다.

        paymentMethod=CARD 는 1단계다 — member-service 의 가상카드 한도를 이 호출 안에서
        동기 차감하고(§7.6 예외 — CardClient), 재고 차감·쿠폰 사용확정까지 전부 끝낸 뒤
        orderStatus=PAID, nextRedirectUrl=null 로 응답한다. 차감이 거절되거나 member-service
        가 응답하지 않으면 결제 전체가 거절되며 재고 차감도 롤백된다(단일 트랜잭션).

        paymentMethod=KAKAOPAY 는 2단계 중 1단계(Ready)다 — 카카오페이 실 API
        (`POST /online/v1/payment/ready`)를 호출해 tid 와 리다이렉트 URL만 받아온다.
        주문은 orderStatus=PENDING_PAYMENT 로 저장되고, **재고는 아직 차감되지 않으며
        쿠폰도 아직 사용확정되지 않는다** — 사용자가 실제로 결제를 완료(approve)해야
        확정된다. 응답의 nextRedirectUrl 로 클라이언트를 리다이렉트시켜야 한다.
      operationId: createOrder
      tags: [order]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "200":
          description: CARD 는 결제 완료, KAKAOPAY 는 결제 준비(Ready) 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetailEnvelope"
        "400":
          description: 재고 부족, 쿠폰 최소주문금액 미달, 만료된 쿠폰, cardId 누락 등
        "402":
          description: 결제 거절(한도 초과 등, CARD 만 해당)
        "403":
          description: 본인 소유가 아닌 쿠폰
        "404":
          description: 존재하지 않는 도서 또는 쿠폰
        "503":
          description: catalog-service/카카오페이 응답 없음

  /api/orders/{orderId}:
    get:
      summary: 주문 상세 조회
      description: 주문 정보 + 주문 상품 목록 + 결제 내역을 한 번에 반환한다.
      operationId: getOrder
      tags: [order]
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetailEnvelope"
        "403":
          description: 타인의 주문
        "404":
          description: 존재하지 않는 주문

  /api/orders/{orderId}/cancel:
    post:
      summary: 주문 취소
      description: |
        PAID 상태인 주문만 취소할 수 있다. 재고 복구, 쿠폰 미사용 원복, 가상카드 한도
        복구(CARD 결제인 경우)를 단일 트랜잭션으로 처리한다 — 카드 한도 복구가 실패하면
        재고·쿠폰 복구를 포함해 전부 롤백되고 주문은 PAID 상태로 남는다(부분 취소 방지).
      operationId: cancelOrder
      tags: [order]
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 취소 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetailEnvelope"
        "403":
          description: 타인의 주문
        "404":
          description: 존재하지 않는 주문
        "409":
          description: PAID 상태가 아니어서 취소할 수 없음(카드 한도 복구 실패 포함)

  /api/orders/{orderId}/return:
    post:
      summary: 반품/교환 신청
      description: |
        PAID 상태인 주문만 반품 신청할 수 있다. cancel 과 달리 이 시점엔 재고·쿠폰·결제를
        건드리지 않는다 — orderStatus 를 RETURN_REQUESTED 로 바꾸고 사유를 저장할 뿐이다.
        실제 환불(재고 복구, 쿠폰 원복, 카드 한도 복구/카카오페이 취소)은 반품 상품 회수
        확인 후 `POST /api/orders/{orderId}/refund` 로 별도 처리한다.
      operationId: requestOrderReturn
      tags: [order]
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestReturnRequest"
      responses:
        "200":
          description: 반품 신청 접수 완료, orderStatus=RETURN_REQUESTED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetailEnvelope"
        "400":
          description: reason 누락
        "403":
          description: 타인의 주문
        "404":
          description: 존재하지 않는 주문
        "409":
          description: PAID 상태가 아니어서 반품 신청할 수 없음

  /api/orders/{orderId}/refund:
    post:
      summary: 환불 처리
      description: |
        RETURN_REQUESTED 상태인 주문만 환불할 수 있다. 결제 수단별로 CARD 는 가상카드 한도를
        복구하고 KAKAOPAY 는 카카오페이 실 API(`POST /online/v1/payment/cancel`)를 호출한다
        (카카오페이는 취소와 환불을 같은 API 로 처리한다). 재고 복구와 쿠폰 사용 원복도
        cancel 과 동일하게 이뤄진다. 실패하면 전부 롤백되고 주문은 RETURN_REQUESTED 상태로
        남는다(부분 환불 방지).
      operationId: refundOrder
      tags: [order]
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 환불 완료, orderStatus=REFUNDED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetailEnvelope"
        "403":
          description: 타인의 주문
        "404":
          description: 존재하지 않는 주문
        "409":
          description: RETURN_REQUESTED 상태가 아니어서 환불할 수 없음(카드 한도 복구/카카오페이 취소 실패 포함)

  /api/payments/kakao/approve:
    post:
      summary: 카카오페이 결제 승인 (2단계 중 2단계)
      description: |
        카카오페이 결제 페이지에서 사용자가 승인을 완료하면 프론트엔드가 approval_url 로
        리다이렉트되며 pg_token 을 쿼리 파라미터로 받는다. 그 pg_token 과 orderId 를 이 API 로
        전달하면, order-service 가 (ready 단계에서 저장해둔) tid 와 함께 카카오페이 실 API
        (`POST /online/v1/payment/approve`)를 호출해 결제를 최종 승인한다.

        승인 성공 시에만 재고 차감·쿠폰 사용확정·장바구니 비우기가 일어나고 orderStatus 가
        PAID 로 바뀐다 — ready 만 하고 approve 하지 않은 주문은 재고/쿠폰에 아무 영향을 주지
        않는다. 재고가 approve 시점에 이미 소진됐다면 카카오페이 승인 API 자체를 호출하지
        않는다(즉 결제가 실제로 이뤄지지 않으므로 별도 취소/환불이 필요 없다).
      operationId: approveKakaoPayment
      tags: [order]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KakaoApproveRequest"
      responses:
        "200":
          description: 승인 완료, orderStatus=PAID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetailEnvelope"
        "400":
          description: 재고 부족(승인 자체를 시도하지 않음)
        "403":
          description: 타인의 주문
        "404":
          description: 존재하지 않는 주문
        "409":
          description: 이미 처리된 주문(PENDING_PAYMENT 가 아니거나 결제가 이미 승인/취소됨)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    InventoryView:
      type: object
      required: [bookId, stock]
      properties:
        bookId:
          type: integer
          format: int64
        stock:
          type: integer
          minimum: 0

    RestockRequest:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 1
          example: 50

    DeliveryEnvelope:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/DeliveryResponse"
        error:
          $ref: "#/components/schemas/ErrorDetail"
          nullable: true

    DeliveryResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        orderId:
          type: integer
          format: int64
        courierCompany:
          type: string
          example: CJ대한통운
        trackingNumber:
          type: string
          example: "123456789"
        deliveryStatus:
          type: string
          enum: [READY, SHIPPED, IN_TRANSIT, DELIVERED]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AddCartItemRequest:
      type: object
      required: [bookId]
      properties:
        bookId:
          type: integer
          format: int64
        quantity:
          type: integer
          minimum: 1
          default: 1
          description: 생략하면 1로 담긴다.

    ChangeCartItemQuantityRequest:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 1

    CartItemView:
      type: object
      properties:
        cartItemId:
          type: integer
          format: int64
        bookId:
          type: integer
          format: int64
        title:
          type: string
          example: 클라우드 엔지니어링 교재
        price:
          type: integer
          example: 25000
        coverImageUrl:
          type: string
        quantity:
          type: integer
        subtotal:
          type: integer
          format: int64
          description: price * quantity

    CartResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItemView"
        totalQuantity:
          type: integer
        totalPrice:
          type: integer
          format: int64

    CartEnvelope:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/CartResponse"
        error:
          $ref: "#/components/schemas/ErrorDetail"
          nullable: true

    CartItemEnvelope:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/CartItemView"
        error:
          $ref: "#/components/schemas/ErrorDetail"
          nullable: true

    ErrorDetail:
      type: object
      properties:
        code:
          type: string
        message:
          type: string

    RegisterCouponRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          example: WELCOME3000

    MemberCouponView:
      type: object
      properties:
        memberCouponId:
          type: integer
          format: int64
        couponId:
          type: integer
          format: int64
        couponCode:
          type: string
          example: WELCOME3000
        couponName:
          type: string
          example: 신규 가입 3000원 할인
        discountAmount:
          type: integer
          example: 3000
        minimumOrderAmount:
          type: integer
          example: 10000
        expiresAt:
          type: string
          format: date-time

    MemberCouponListEnvelope:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/MemberCouponView"
        error:
          $ref: "#/components/schemas/ErrorDetail"
          nullable: true

    MemberCouponEnvelope:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/MemberCouponView"
        error:
          $ref: "#/components/schemas/ErrorDetail"
          nullable: true

    OrderItemRequest:
      type: object
      required: [bookId, quantity]
      properties:
        bookId:
          type: integer
          format: int64
        quantity:
          type: integer
          minimum: 1

    Recipient:
      type: object
      required: [name, phone, postalCode, address]
      properties:
        name:
          type: string
        phone:
          type: string
          example: "010-1234-5678"
        postalCode:
          type: string
          example: "06236"
        address:
          type: string

    CreateOrderRequest:
      type: object
      required: [items, recipient, paymentMethod]
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderItemRequest"
        memberCouponId:
          type: integer
          format: int64
          nullable: true
        recipient:
          $ref: "#/components/schemas/Recipient"
        paymentMethod:
          type: string
          enum: [VIRTUAL_CARD, KAKAO_PAY]
        cardId:
          type: integer
          format: int64
          nullable: true
          description: paymentMethod=CARD 일 때 필수.

    OrderItemView:
      type: object
      properties:
        orderItemId:
          type: integer
          format: int64
        bookId:
          type: integer
          format: int64
        bookTitle:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: integer

    PaymentView:
      type: object
      properties:
        paymentId:
          type: integer
          format: int64
        paymentMethod:
          type: string
          enum: [VIRTUAL_CARD, KAKAO_PAY]
        amount:
          type: integer
        paymentStatus:
          type: string
          enum: [READY, APPROVED, DECLINED, CANCELLED, REFUNDED]
          description: |
            READY 는 카카오페이 ready 는 끝났지만 아직 approve 되지 않은 상태다.
            REFUNDED 는 배송 완료 후 반품이 승인되어 환불된 상태다(CANCELLED=사전 취소와 구분).
        approvalNumber:
          type: string
          nullable: true
          description: READY 상태에서는 아직 없다.
        pgTid:
          type: string
          nullable: true

    KakaoApproveRequest:
      type: object
      required: [orderId, pgToken]
      properties:
        orderId:
          type: integer
          format: int64
        pgToken:
          type: string
          description: 카카오페이 리다이렉트 콜백에서 받은 pg_token.

    RequestReturnRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          example: 단순 변심

    OrderResponse:
      type: object
      properties:
        orderId:
          type: integer
          format: int64
        orderStatus:
          type: string
          enum: [PENDING_PAYMENT, PAID, CANCELLED, RETURN_REQUESTED, REFUNDED]
        recipient:
          $ref: "#/components/schemas/Recipient"
        totalAmount:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItemView"
        payment:
          $ref: "#/components/schemas/PaymentView"
        nextRedirectUrl:
          type: string
          nullable: true
          description: |
            paymentMethod=KAKAOPAY 로 주문을 막 생성했을 때만 값이 있다. 클라이언트는 이
            URL 로 사용자를 리다이렉트시켜야 한다. 그 외의 모든 응답(CARD 생성, 상세조회,
            취소, 카카오 승인, 반품, 환불 이후)에서는 항상 null 이다.
        returnReason:
          type: string
          nullable: true
          description: POST /api/orders/{orderId}/return 으로 반품 신청했을 때 저장한 사유다. 반품 신청 전에는 null 이다.

    OrderDetailEnvelope:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/OrderResponse"
        error:
          $ref: "#/components/schemas/ErrorDetail"
          nullable: true
