          isbn,
          category,
          price,
          ebookAvailable,
          saleStatus,
          salesCount,
          averageRating,
          reviewCount,
          deleted,
          createdAt,
          updatedAt,
        ]
      properties:
        bookId: { type: integer, format: int64 }
        title: { type: string }
        author: { type: string }
        publisher: { type: string }
        isbn: { type: string }
        category: { type: string }
        price: { type: integer }
        coverImageUrl: { type: string, nullable: true }
        description: { type: string, nullable: true }
        detailedSynopsis: { type: string, nullable: true }
        ebookAvailable: { type: boolean }
        epubS3Key: { type: string, nullable: true }
        saleStatus: { type: string, enum: [ON_SALE, STOPPED, OUT_OF_STOCK] }
        publishedDate: { type: string, format: date, nullable: true }
        salesCount: { type: integer }
        averageRating: { type: number, format: double }
        reviewCount: { type: integer }
        deleted: { type: boolean }
        deletedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

