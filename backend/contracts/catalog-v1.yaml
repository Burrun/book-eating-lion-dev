        selectedText:
          type: string
          description: 사용자가 긁은 원문. 길이 상한은 서버 설정이 정한다(기본 500자).
        memoText:
          type: string
          maxLength: 4000
          nullable: true
          description: 원문에 덧붙인 사용자의 말. 비어 있을 수 있다(형광펜만 그은 경우).
        createdAt: { type: string, format: date-time }

