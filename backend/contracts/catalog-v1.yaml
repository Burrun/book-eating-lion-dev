openapi: 3.0.3
info:
  title: catalog-service API
  version: "1.0.0"
  description: |
    도서·리뷰·찜·최근 본 상품·추천 추론.

    주의 — 찜/최근 본 상품 경로가 /api/members/me/* 에서 바뀌었다.
    /api/members/** 는 Ingress 가 member-service 로 보내는데, 이 데이터는
    catalog_db 소유이기 때문이다. 같은 접두사를 두 서비스가 나눠 가지면
    라우팅이 경로 길이에 의존하게 된다.

servers:
  - url: http://localhost:8081
    description: 로컬
  - url: http://catalog-service.lion-app.svc.cluster.local:8080
    description: 클러스터 내부

paths:
  /api/catalog/books:
    get:
      summary: 도서 목록
      operationId: getBooks
      tags: [books]
      parameters:
        - name: category
          in: query
          schema: { type: string, example: IT/컴퓨터 }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
        - name: sort
          in: query
          description: Spring Pageable 정렬. 예 `publishedAt,desc`
          schema: { type: string }
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookSummaryPageEnvelope"

  /api/catalog/books/search:
    get:
      summary: 도서 검색
      description: 검색어로 도서를 조회하고, 로그인 사용자의 검색어를 추천 행동 로그로 기록한다. 자동완성은 제공하지 않는다.
      operationId: searchBooks
      tags: [books]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: 검색 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookSummaryPageEnvelope"

  /api/catalog/books/bestsellers:
    get:
      summary: 베스트셀러 목록
      description: 판매 중인 도서를 누적 판매량 내림차순으로 조회한다.
      operationId: getBestsellers
      tags: [books]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 10, minimum: 1 }
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookSummaryListEnvelope"

  /api/catalog/books/new-releases:
    get:
      summary: 신간 목록
      description: 판매 중인 도서를 출간일 내림차순으로 조회한다.
      operationId: getNewReleases
      tags: [books]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 10, minimum: 1 }
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookSummaryListEnvelope"

  /api/catalog/categories:
    get:
      summary: 사용자용 활성 카테고리 목록
      operationId: getCategories
      tags: [categories]
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryListEnvelope"

  /api/catalog/admin/books:
    get:
      summary: 관리자용 도서 목록
      operationId: getAdminBooks
      tags: [admin-books]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: includeDeleted
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminBookPageEnvelope" }
    post:
      summary: 도서 등록
      operationId: createBook
      tags: [admin-books]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminBookCreateRequest" }
      responses:
        "201":
          description: 등록 완료
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminBookEnvelope" }
        "409": { description: ISBN 중복 }

  /api/catalog/admin/books/epub-upload-url:
    post:
      summary: EPUB 업로드용 Presigned URL 발급
      description: |
        도서 등록/수정 전에 먼저 호출한다. 응답의 uploadUrl로 브라우저가 S3에 직접 PUT 업로드하고,
        epubS3Key를 도서 등록/수정 요청(AdminBookCreateRequest/AdminBookUpdateRequest)에 그대로
        넘긴다. EBOOK_STORAGE=local(로컬 기본값)에서는 지원하지 않는다(503).
      operationId: issueEpubUploadUrl
      tags: [admin-books]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EpubUploadUrlRequest" }
      responses:
        "200":
          description: 발급 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EpubUploadUrlEnvelope" }
        "503": { description: 로컬 저장소 모드거나 S3 발급 실패 }

  /api/catalog/admin/books/{bookId}:
    parameters:
      - name: bookId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      summary: 관리자용 도서 상세
      operationId: getAdminBook
      tags: [admin-books]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminBookEnvelope" }
        "404": { description: 도서 없음 }
    patch:
      summary: 도서 정보 부분 수정
      operationId: updateBook
      tags: [admin-books]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminBookUpdateRequest" }
      responses:
        "200":
          description: 수정 완료
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminBookEnvelope" }
        "404": { description: 도서 또는 카테고리 없음 }
        "409": { description: ISBN 중복 또는 비활성 카테고리 }
    delete:
      summary: 도서 소프트 삭제
      operationId: deleteBook
      tags: [admin-books]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: 삭제 완료 }
        "404": { description: 도서 없음 }

  /api/catalog/admin/books/recommendation-index/rebuild:
    post:
      summary: 추천 도서 벡터 전체 재색인 요청
      description: 판매 중이며 삭제되지 않은 모든 도서를 Redis Stream에 발행한다. AI Service가 비동기로 임베딩·색인한다.
      operationId: rebuildRecommendationBookIndex
      tags: [admin-books]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: 발행 대상 도서 수 반환

  /api/catalog/admin/categories:
    get:
      summary: 관리자용 전체 카테고리 목록
      operationId: getAdminCategories
      tags: [admin-categories]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryListEnvelope" }
    post:
      summary: 카테고리 등록
      operationId: createCategory
      tags: [admin-categories]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryCreateRequest" }
      responses:
        "201":
          description: 등록 완료
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryEnvelope" }
        "409": { description: 카테고리명 중복 }

  /api/catalog/admin/categories/{categoryId}:
    parameters:
      - name: categoryId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      summary: 관리자용 카테고리 상세
      operationId: getAdminCategory
      tags: [admin-categories]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryEnvelope" }
        "404": { description: 카테고리 없음 }
    patch:
      summary: 카테고리 수정
      operationId: updateCategory
      tags: [admin-categories]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryUpdateRequest" }
      responses:
        "200":
          description: 수정 완료
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryEnvelope" }
        "409": { description: 이름 중복 또는 자기 자신을 상위 카테고리로 지정 }
    delete:
      summary: 카테고리 비활성화
      operationId: deleteCategory
      tags: [admin-categories]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: 비활성화 완료 }
        "409": { description: 활성 도서가 연결되어 있어 비활성화 불가 }

  /api/catalog/books/{bookId}:
    get:
      summary: 도서 상세
      description: |
        stockQuantity 는 catalog_db 가 아니라 order-service 에서 조합한다(API 조합 패턴).
        order-service 가 응답하지 않으면 -1 이 들어오며, 프론트는 재고 영역만 degrade 하고
        도서 정보는 정상 노출한다.
      operationId: getBook
      tags: [books]
      parameters:
        - name: bookId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookDetailEnvelope"
        "404":
          description: 도서 없음

  /api/catalog/books/{bookId}/synopsis/detail:
    get:
      summary: 도서 상세 줄거리 조회
      description: 저장된 상세 줄거리 텍스트를 반환한다. 구매·구독 권한 검증과 웹툰형 요약 이미지는 아직 제공하지 않는다.
      operationId: getSynopsisDetail
      tags: [books]
      parameters:
        - name: bookId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookSynopsisDetailEnvelope"
        "404":
          description: 도서 없음

  /api/catalog/books/{bookId}/reviews:
    get:
      summary: 리뷰 목록
      operationId: getReviews
      tags: [reviews]
      parameters:
        - name: bookId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewPageEnvelope"
    post:
      summary: 리뷰 작성
      description: |
        구매 검증을 order-service 에 동기 호출하지 않는다.
        구매 확정 시 ReviewPermissionGranted 이벤트로 미리 받아둔 review_permissions 를
        로컬 조회할 뿐이므로, **order-service 가 죽어 있어도 리뷰 작성은 정상 동작한다.**

        권한이 없으면 403 REVIEW_PERMISSION_REQUIRED 를 반환한다.
      operationId: createReview
      tags: [reviews]
      security:
        - bearerAuth: []
      parameters:
        - name: bookId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRequest"
      responses:
        "201":
          description: 작성 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewEnvelope"
        "403":
          description: 구매 확정 이력 없음 (REVIEW_PERMISSION_REQUIRED)

  /api/catalog/books/{bookId}/ebook:
    get:
      summary: 로그인 회원 eBook 열람 URL 발급
      description: |
        eBook 미지원 도서는 ebookAvailable=false를 반환한다.
        지원 도서는 로그인 사용자에게 짧은 유효기간의 S3 Presigned URL을 발급한다.
        Presigned URL은 DB에 저장하지 않는다.
      operationId: getEbookAccess
      tags: [ebooks]
      security:
        - bearerAuth: []
      parameters:
        - name: bookId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: eBook 지원 여부와 열람 URL 반환
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EbookAccessEnvelope"
        "404": { description: 존재하지 않거나 삭제된 도서 (BOOK_NOT_FOUND) }
        "503": { description: 열람 URL 발급 실패 (EBOOK_ACCESS_UNAVAILABLE) }

  /api/catalog/books/{bookId}/reading-progress:
    put:
      summary: 전자책 이어읽기 위치 저장
      description: |
        회원×도서 단위 upsert. 이력은 남기지 않고 최신 위치/퍼센트만 유지한다.

        회원 식별은 JWT `sub` 클레임이다(`CatalogMemberIdentity`). 이 서비스의 다른 인증 경로도
        모두 같다 — `X-Member-Id` 헤더를 읽는 코드는 리포 전체에 없다.
      operationId: saveReadingProgress
      tags: [reading-progress]
      security:
        - bearerAuth: []
      parameters:
        - name: bookId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReadingProgressRequest"
      responses:
        "200":
          description: 저장 성공 (생성 또는 갱신)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingProgressEnvelope"
        "404":
          description: 존재하지 않거나 삭제된 도서 (BOOK_NOT_FOUND)
    get:
      summary: 전자책 이어읽기 위치 조회
      description: |
        한 번도 읽지 않은 책은 오류가 아니라 정상 상태다 — data: null 로 200 을 반환한다.
      operationId: getReadingProgress
      tags: [reading-progress]
      security:
        - bearerAuth: []
      parameters:
        - name: bookId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: "조회 성공 (기록이 없으면 data: null)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingProgressEnvelope"
        "404":
          description: 존재하지 않거나 삭제된 도서 (BOOK_NOT_FOUND)

  /api/catalog/wishlist/me:
    get:
      summary: 내 찜 목록
      operationId: getMyWishlist
      tags: [wishlist]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookSummaryListEnvelope"

  /api/catalog/reviews/me:
    get:
      summary: 내가 작성한 리뷰 목록
      description: JWT sub와 일치하는 회원의 리뷰를 최신 작성순으로 반환한다.
      operationId: getMyReviews
      tags: [reviews]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberReviewListEnvelope"

  /api/catalog/reviews/{reviewId}:
    patch:
      summary: 내 리뷰 수정
      operationId: updateReview
      tags: [reviews]
      security:
        - bearerAuth: []
      parameters:
        - name: reviewId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewUpdateRequest"
      responses:
        "200":
          description: 수정 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewEnvelope"
        "403":
          description: 작성자가 아님
        "404":
          description: 리뷰 또는 공개 도서 없음
    delete:
      summary: 내 리뷰 삭제
      description: 삭제한 리뷰가 사용한 구매 권한을 복구하여 다시 리뷰를 작성할 수 있다.
      operationId: deleteReview
      tags: [reviews]
      security:
        - bearerAuth: []
      parameters:
        - name: reviewId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: 삭제 완료
        "403":
          description: 작성자가 아님
        "404":
          description: 리뷰 없음

  /api/catalog/wishlist/{bookId}:
    post:
      summary: 찜 추가
      operationId: addWishlist
      tags: [wishlist]
      security:
        - bearerAuth: []
      parameters:
        - name: bookId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: 찜 추가 완료
        "404":
          description: 공개 도서 없음
    delete:
      summary: 찜 삭제
      operationId: removeWishlist
      tags: [wishlist]
      security:
        - bearerAuth: []
      parameters:
        - name: bookId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: 찜 삭제 완료

  /api/catalog/admin/books/{bookId}/reviews:
    get:
      summary: 관리자 도서 리뷰 목록
      description: 삭제된 도서의 리뷰도 관리 목적으로 조회한다.
      operationId: getAdminBookReviews
      tags: [admin-reviews]
      security:
        - bearerAuth: []
      parameters:
        - name: bookId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewPageEnvelope"
        "404":
          description: 도서 없음

  /api/catalog/recent-books/me:
    get:
      summary: 최근 본 상품
      operationId: getMyRecentBooks
      tags: [recent-books]
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookSummaryListEnvelope"

  /api/catalog/books/{bookId}/restock-alert:
    parameters:
      - name: bookId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      summary: 재입고 알림 신청
      tags: [restock-alerts]
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: 신청 완료 }
        "404": { description: 공개 도서 없음 }
        "409": { description: 이미 대기 중인 신청 }
    delete:
      summary: 재입고 알림 신청 취소
      tags: [restock-alerts]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: 취소 완료 }
        "404": { description: 신청 없음 }

  /api/catalog/restock-alerts/me:
    get:
      summary: 내 재입고 알림 신청 목록
      tags: [restock-alerts]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [WAITING, PROCESSING, SENT, FAILED, CANCELLED] }
      responses:
        "200": { description: 조회 성공 }

  /api/catalog/books/{bookId}/inquiries:
    parameters:
      - name: bookId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      summary: 공개 상품 문의 목록
      description: 비밀 문의는 JWT로 식별된 작성자에게만 함께 노출된다.
      operationId: getBookInquiries
      tags: [inquiries]
      responses:
        "200": { description: 조회 성공 }
        "404": { description: 공개 도서 없음 }
    post:
      summary: 상품 문의 작성
      operationId: createInquiry
      tags: [inquiries]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InquiryWriteRequest" }
      responses:
        "201": { description: 작성 완료 }
        "404": { description: 공개 도서 없음 }

  /api/catalog/inquiries/{inquiryId}:
    parameters:
      - name: inquiryId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    patch:
      summary: 내 상품 문의 수정
      operationId: updateInquiry
      tags: [inquiries]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InquiryWriteRequest" }
      responses:
        "200": { description: 수정 완료 }
        "403": { description: 작성자가 아님 }
        "404": { description: 문의 또는 공개 도서 없음 }
    delete:
      summary: 내 상품 문의 소프트 삭제
      operationId: deleteInquiry
      tags: [inquiries]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: 삭제 완료 }
        "403": { description: 작성자가 아님 }
        "404": { description: 문의 없음 }

  /api/catalog/admin/inquiries:
    get:
      summary: 관리자 상품 문의 목록
      operationId: getAdminInquiries
      tags: [admin-inquiries]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: bookId
          in: query
          schema: { type: integer, format: int64 }
        - name: status
          in: query
          schema: { type: string, enum: [WAITING, ANSWERED] }
      responses:
        "200":
          description: 삭제·비밀 문의를 포함한 조회 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InquiryPageEnvelope" }

  /api/catalog/admin/inquiries/{inquiryId}/answer:
    patch:
      summary: 관리자 상품 문의 답변 등록 또는 수정
      operationId: answerInquiry
      tags: [admin-inquiries]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: inquiryId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InquiryAnswerRequest" }
      responses:
        "200":
          description: 답변 완료
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InquiryEnvelope" }
        "404": { description: 문의 없음 }

  /api/catalog/faqs:
    get:
      summary: 사용자용 활성 FAQ 목록
      operationId: getFaqs
      tags: [faqs]
      parameters:
        - name: category
          in: query
          schema: { type: string }
      responses:
        "200":
          description: 정렬 순서에 따른 조회 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FaqListEnvelope" }

  /api/catalog/admin/faqs:
    get:
      summary: 관리자용 전체 FAQ 목록
      operationId: getAdminFaqs
      tags: [admin-faqs]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: category
          in: query
          schema: { type: string }
      responses:
        "200":
          description: 비활성 FAQ를 포함한 조회 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FaqListEnvelope" }
    post:
      summary: FAQ 등록
      operationId: createFaq
      tags: [admin-faqs]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FaqWriteRequest" }
      responses:
        "201":
          description: 등록 완료
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FaqEnvelope" }

  /api/catalog/admin/faqs/{faqId}:
    parameters:
      - name: faqId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    patch:
      summary: FAQ 수정
      operationId: updateFaq
      tags: [admin-faqs]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FaqWriteRequest" }
      responses:
        "200":
          description: 수정 완료
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FaqEnvelope" }
        "404": { description: FAQ 없음 }

  /api/catalog/subscription-banners:
    get:
      summary: 홈 화면용 노출 중인 정기구독 배너 목록
      description: active=true 이면서 현재 시각이 startAt~endAt 안에 든 배너만, sortOrder 순으로 반환한다.
      operationId: getSubscriptionBanners
      tags: [subscription-banners]
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscriptionBannerListEnvelope" }

  /api/catalog/admin/subscription-banners:
    get:
      summary: 관리자용 전체 정기구독 배너 목록
      description: 기간이 지났거나 비활성인 것도 포함해 sortOrder 순으로 전부 반환한다.
      operationId: getAdminSubscriptionBanners
      tags: [admin-subscription-banners]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscriptionBannerListEnvelope" }
    post:
      summary: 정기구독 배너 등록
      operationId: createSubscriptionBanner
      tags: [admin-subscription-banners]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubscriptionBannerWriteRequest" }
      responses:
        "201":
          description: 등록 완료
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscriptionBannerEnvelope" }

  /api/catalog/admin/subscription-banners/{bannerId}:
    parameters:
      - name: bannerId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      summary: 정기구독 배너 상세 조회
      operationId: getAdminSubscriptionBanner
      tags: [admin-subscription-banners]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscriptionBannerEnvelope" }
        "404": { description: 배너 없음 }
    patch:
      summary: 정기구독 배너 수정
      operationId: updateSubscriptionBanner
      tags: [admin-subscription-banners]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubscriptionBannerWriteRequest" }
      responses:
        "200":
          description: 수정 완료
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscriptionBannerEnvelope" }
        "404": { description: 배너 없음 }
    delete:
      summary: 정기구독 배너 비활성화
      description: 하드 삭제가 아니라 active=false 로 바꾼다(Category/Faq와 동일한 소프트 삭제 규칙).
      operationId: deleteSubscriptionBanner
      tags: [admin-subscription-banners]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: 비활성화 완료 }
        "404": { description: 배너 없음 }

  /api/catalog/recommend/queue:
    get:
      summary: 개인화 추천 대기열 조회
      description: 규칙 점수와 벡터 유사도를 결합하고, 검색된 행동 근거로 생성한 추천 이유를 반환한다.
      operationId: getRecommendationQueue
      tags: [recommendations]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: refresh
          in: query
          description: Redis에 남은 대기열을 버리고 새 후보를 계산한다.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecommendationQueueEnvelope" }

  /api/catalog/recommend/queue/reaction:
    post:
      summary: 추천 카드 LIKE 또는 SKIP 기록
      operationId: reactRecommendationCard
      tags: [recommendations]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecommendationReactionRequest" }
      responses:
        "200": { description: 반응 저장 및 현재 대기열에서 카드 제거 완료 }
        "400": { description: 현재 대기열에 노출되지 않은 카드 }
    delete:
      summary: FAQ 비활성화
      operationId: deleteFaq
      tags: [admin-faqs]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: 비활성화 완료 }
        "404": { description: FAQ 없음 }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    BookSummary:
      type: object
      required: [id, title, author, price, category, saleStatus, averageRating, reviewCount]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string, example: 클라우드 엔지니어링 교재 }
        author: { type: string, example: 북이팅라이언 }
        price: { type: integer, example: 25000 }
        coverImageUrl: { type: string, nullable: true }
        category: { type: string, example: IT/컴퓨터 }
        saleStatus:
          type: string
          enum: [ON_SALE, STOPPED, OUT_OF_STOCK]
        averageRating:
          type: number
          format: double
          description: 리뷰 평점 평균. 리뷰가 없으면 0.
          example: 4.5
        reviewCount:
          type: integer
          description: 리뷰 수. 리뷰 작성/수정/삭제 시마다 재계산된다.
          example: 12

    BookDetail:
      allOf:
        - $ref: "#/components/schemas/BookSummary"
        - type: object
          required: [publisher, isbn, stockQuantity, ebookAvailable, createdAt, updatedAt]
          properties:
            publisher: { type: string }
            isbn: { type: string }
            stockQuantity:
              type: integer
              description: order-service 조합값. -1 은 재고 조회 실패(품절 0 과 구분).
              example: 100
            description: { type: string, nullable: true }
            ebookAvailable:
              type: boolean
              description: EPUB 객체 키 등록 여부. Book.isEbookAvailable() — epubS3Key != null 이라
                null 이 될 수 없다.
            publishedDate: { type: string, format: date, nullable: true }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    BookSynopsisDetail:
      type: object
      required: [bookId, title]
      properties:
        bookId: { type: integer, format: int64 }
        title: { type: string }
        detailedSynopsis:
          type: string
          nullable: true

    Review:
      type: object
      required: [id, bookId, memberId, rating, content, createdAt]
      properties:
        id: { type: integer, format: int64 }
        bookId: { type: integer, format: int64 }
        memberId:
          type: string
          description: Cognito sub
        nickname:
          type: string
          description: 작성 당시 닉네임 스냅샷. members 를 조인하지 않는다.
          example: 테스트유저
        rating: { type: integer, minimum: 1, maximum: 5 }
        content: { type: string }
        createdAt: { type: string, format: date-time }

    MemberReview:
      type: object
      required: [id, bookId, bookTitle, rating, content, createdAt]
      properties:
        id: { type: integer, format: int64 }
        bookId: { type: integer, format: int64 }
        bookTitle: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        content: { type: string }
        createdAt: { type: string, format: date-time }

    InquiryWriteRequest:
      type: object
      required: [title, content, privateInquiry]
      properties:
        title: { type: string, maxLength: 200 }
        content: { type: string, maxLength: 2000 }
        privateInquiry: { type: boolean, default: false }

    InquiryAnswerRequest:
      type: object
      required: [answer]
      properties:
        answer: { type: string, maxLength: 4000 }

    InquiryResponse:
      type: object
      required:
        [inquiryId, bookId, memberId, title, content, privateInquiry, status, deleted, createdAt, updatedAt]
      properties:
        inquiryId: { type: integer, format: int64 }
        bookId: { type: integer, format: int64 }
        memberId: { type: string, description: Cognito sub }
        title: { type: string }
        content: { type: string }
        privateInquiry: { type: boolean }
        status:
          type: string
          enum: [WAITING, ANSWERED]
        answer: { type: string, nullable: true }
        answeredBy:
          type: string
          nullable: true
          description: 답변한 관리자의 Cognito sub.
        answeredAt: { type: string, format: date-time, nullable: true }
        deleted: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    InquiryEnvelope:
      type: object
      properties:
        success: { type: boolean }
        data:
          $ref: "#/components/schemas/InquiryResponse"

    InquiryPageEnvelope:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: object
          properties:
            content:
              type: array
              items:
                $ref: "#/components/schemas/InquiryResponse"
            totalElements: { type: integer }

    FaqWriteRequest:
      type: object
      required: [category, question, answer, sortOrder, active]
      properties:
        category: { type: string, maxLength: 50 }
        question: { type: string, maxLength: 500 }
        answer: { type: string, maxLength: 4000 }
        sortOrder: { type: integer, minimum: 0 }
        active: { type: boolean }

    FaqResponse:
      type: object
      required: [faqId, category, question, answer, sortOrder, active, createdAt, updatedAt]
      properties:
        faqId: { type: integer, format: int64 }
        category: { type: string }
        question: { type: string }
        answer: { type: string }
        sortOrder: { type: integer }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    FaqEnvelope:
      type: object
      properties:
        success: { type: boolean }
        data:
          $ref: "#/components/schemas/FaqResponse"

    FaqListEnvelope:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: array
          items:
            $ref: "#/components/schemas/FaqResponse"

    SubscriptionBannerWriteRequest:
      type: object
      required: [imageUrl, title, startAt, endAt, sortOrder, active]
      properties:
        imageUrl: { type: string, maxLength: 500 }
        title: { type: string, maxLength: 200 }
        linkUrl:
          type: string
          maxLength: 500
          nullable: true
          description: 배너 클릭 시 이동할 경로. 없으면 클릭해도 아무 데도 안 간다.
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        sortOrder: { type: integer, minimum: 0 }
        active: { type: boolean }

    SubscriptionBannerResponse:
      type: object
      required: [bannerId, imageUrl, title, startAt, endAt, sortOrder, active, createdAt, updatedAt]
      properties:
        bannerId: { type: integer, format: int64 }
        imageUrl: { type: string }
        title: { type: string }
        linkUrl: { type: string, nullable: true }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        sortOrder: { type: integer }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SubscriptionBannerEnvelope:
      type: object
      properties:
        success: { type: boolean }
        data:
          $ref: "#/components/schemas/SubscriptionBannerResponse"

    SubscriptionBannerListEnvelope:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: array
          items:
            $ref: "#/components/schemas/SubscriptionBannerResponse"

    ReviewRequest:
      type: object
      required: [rating, content]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        content: { type: string, maxLength: 1000 }

    ReadingProgress:
      type: object
      properties:
        bookId: { type: integer, format: int64 }
        cfi:
          type: string
          description: epub.js CFI(Canonical Fragment Identifier) 문자열.
          example: "epubcfi(/6/14!/4/2/2/1:0)"
        percentage:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
        updatedAt: { type: string, format: date-time }

    ReadingProgressRequest:
      type: object
      required: [cfi]
      properties:
        cfi: { type: string }
        percentage:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true

    ReviewUpdateRequest:
      type: object
      required: [rating, content]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        content: { type: string, maxLength: 1000 }

    RecommendationReactionRequest:
      type: object
      required: [queueId, bookId, action]
      properties:
        queueId: { type: string, format: uuid }
        bookId: { type: integer, format: int64 }
        action: { type: string, enum: [LIKE, SKIP] }

    RecommendationCard:
      type: object
      properties:
        bookId: { type: integer, format: int64 }
        title: { type: string }
        author: { type: string }
        category: { type: string }
        price: { type: integer }
        coverImageUrl: { type: string }
        score: { type: number, format: double, minimum: 0, maximum: 1 }
        recommendationReason:
          type: string
          description: 검색된 사용자 행동 근거만 사용해 LLM이 생성한 추천 이유. AI 장애 시 고정 규칙 문구.

    RecommendationQueueEnvelope:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: object
          properties:
            queueId: { type: string, format: uuid }
            cards:
              type: array
              items: { $ref: "#/components/schemas/RecommendationCard" }

    Category:
      type: object
      required: [categoryId, categoryName, sortOrder, active]
      properties:
        categoryId: { type: integer, format: int64 }
        categoryName: { type: string, example: IT/컴퓨터 }
        parentId: { type: integer, format: int64, nullable: true }
        sortOrder: { type: integer, minimum: 0 }
        active: { type: boolean }

    CategoryCreateRequest:
      type: object
      required: [categoryName, sortOrder]
      properties:
        categoryName: { type: string, maxLength: 100 }
        parentId: { type: integer, format: int64, nullable: true }
        sortOrder: { type: integer, minimum: 0 }

    CategoryUpdateRequest:
      allOf:
        - $ref: "#/components/schemas/CategoryCreateRequest"

    AdminBookCreateRequest:
      type: object
      required: [title, author, publisher, isbn, category, price]
      properties:
        title: { type: string, maxLength: 200 }
        author: { type: string, maxLength: 100 }
        publisher: { type: string, maxLength: 100 }
        isbn: { type: string, pattern: "^[0-9]{13}$" }
        category: { type: string, maxLength: 100 }
        price: { type: integer, minimum: 0 }
        coverImageUrl: { type: string, maxLength: 500 }
        description: { type: string }
        detailedSynopsis: { type: string }
        epubS3Key:
          type: string
          maxLength: 500
          nullable: true
          description: 비공개 S3 버킷 내 EPUB 객체 키. URL은 저장하지 않는다.
        saleStatus: { type: string, enum: [ON_SALE, STOPPED, OUT_OF_STOCK] }
        publishedDate: { type: string, format: date }

    AdminBookUpdateRequest:
      type: object
      description: 전달한 필드만 수정한다.
      properties:
        title: { type: string, maxLength: 200 }
        author: { type: string, maxLength: 100 }
        publisher: { type: string, maxLength: 100 }
        isbn: { type: string, pattern: "^[0-9]{13}$" }
        category: { type: string, maxLength: 100 }
        price: { type: integer, minimum: 0 }
        coverImageUrl: { type: string, maxLength: 500 }
        description: { type: string }
        detailedSynopsis: { type: string }
        epubS3Key:
          type: string
          maxLength: 500
          nullable: true
          description: null이면 유지, 빈 문자열이면 eBook 연결 해제
        saleStatus: { type: string, enum: [ON_SALE, STOPPED, OUT_OF_STOCK] }
        publishedDate: { type: string, format: date }

    AdminBookResponse:
      type: object
      required:
        [
          bookId,
          title,
          author,
          publisher,
          isbn,
          category,
          price,
          ebookAvailable,
          saleStatus,
          salesCount,
          averageRating,
          reviewCount,
          deleted,
          createdAt,
          updatedAt,
        ]
      properties:
        bookId: { type: integer, format: int64 }
        title: { type: string }
        author: { type: string }
        publisher: { type: string }
        isbn: { type: string }
        category: { type: string }
        price: { type: integer }
        coverImageUrl: { type: string, nullable: true }
        description: { type: string, nullable: true }
        detailedSynopsis: { type: string, nullable: true }
        ebookAvailable: { type: boolean }
        epubS3Key: { type: string, nullable: true }
        saleStatus: { type: string, enum: [ON_SALE, STOPPED, OUT_OF_STOCK] }
        publishedDate: { type: string, format: date, nullable: true }
        salesCount: { type: integer }
