openapi: 3.0.3
info:
  title: catalog-service API
  version: "1.0.0"
  description: |
    도서·리뷰·찜·최근 본 상품·추천 추론.

    주의 — 찜/최근 본 상품 경로가 /api/members/me/* 에서 바뀌었다.
    /api/members/** 는 Ingress 가 member-service 로 보내는데, 이 데이터는
    catalog_db 소유이기 때문이다. 같은 접두사를 두 서비스가 나눠 가지면
    라우팅이 경로 길이에 의존하게 된다.

servers:
  - url: http://localhost:8081
    description: 로컬
  - url: http://catalog-service.lion-app.svc.cluster.local:8080
    description: 클러스터 내부

paths:
  /api/catalog/books:
    get:
      summary: 도서 목록
      operationId: getBooks
      tags: [books]
      parameters:
        - name: category
          in: query
          schema: { type: string, example: IT/컴퓨터 }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookSummaryPageEnvelope"

  /api/catalog/categories:
    get:
      summary: 사용자용 활성 카테고리 목록
      operationId: getCategories
      tags: [categories]
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryListEnvelope"

  /api/catalog/admin/books:
    get:
      summary: 관리자용 도서 목록
      operationId: getAdminBooks
      tags: [admin-books]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: includeDeleted
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200": { description: 조회 성공 }
    post:
      summary: 도서 등록
      operationId: createBook
      tags: [admin-books]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminBookCreateRequest" }
      responses:
        "201": { description: 등록 완료 }
        "409": { description: ISBN 중복 }

  /api/catalog/admin/books/{bookId}:
    parameters:
      - name: bookId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      summary: 관리자용 도서 상세
      operationId: getAdminBook
      tags: [admin-books]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: 조회 성공 }
        "404": { description: 도서 없음 }
    patch:
      summary: 도서 정보 부분 수정
      operationId: updateBook
      tags: [admin-books]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminBookUpdateRequest" }
      responses:
        "200": { description: 수정 완료 }
        "404": { description: 도서 또는 카테고리 없음 }
        "409": { description: ISBN 중복 또는 비활성 카테고리 }
    delete:
      summary: 도서 소프트 삭제
      operationId: deleteBook
      tags: [admin-books]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: 삭제 완료 }
        "404": { description: 도서 없음 }

  /api/catalog/admin/categories:
    get:
      summary: 관리자용 전체 카테고리 목록
      operationId: getAdminCategories
      tags: [admin-categories]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: 조회 성공 }
    post:
      summary: 카테고리 등록
      operationId: createCategory
      tags: [admin-categories]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryCreateRequest" }
      responses:
        "201": { description: 등록 완료 }
        "409": { description: 카테고리명 중복 }

  /api/catalog/admin/categories/{categoryId}:
    parameters:
      - name: categoryId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      summary: 관리자용 카테고리 상세
      operationId: getAdminCategory
      tags: [admin-categories]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: 조회 성공 }
        "404": { description: 카테고리 없음 }
    patch:
      summary: 카테고리 수정
      operationId: updateCategory
      tags: [admin-categories]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryUpdateRequest" }
      responses:
        "200": { description: 수정 완료 }
        "409": { description: 이름 중복 또는 자기 자신을 상위 카테고리로 지정 }
    delete:
      summary: 카테고리 비활성화
      operationId: deleteCategory
      tags: [admin-categories]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: 비활성화 완료 }
        "409": { description: 활성 도서가 연결되어 있어 비활성화 불가 }

  /api/catalog/books/{bookId}:
    get:
      summary: 도서 상세
      description: |
        stockQuantity 는 catalog_db 가 아니라 order-service 에서 조합한다(API 조합 패턴).
        order-service 가 응답하지 않으면 -1 이 들어오며, 프론트는 재고 영역만 degrade 하고
        도서 정보는 정상 노출한다.
      operationId: getBook
      tags: [books]
      parameters:
        - name: bookId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookDetailEnvelope"
        "404":
          description: 도서 없음

  /api/catalog/books/{bookId}/reviews:
    get:
      summary: 리뷰 목록
      operationId: getReviews
      tags: [reviews]
      parameters:
        - name: bookId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewPageEnvelope"
    post:
      summary: 리뷰 작성
      description: |
        구매 검증을 order-service 에 동기 호출하지 않는다.
        구매 확정 시 ReviewPermissionGranted 이벤트로 미리 받아둔 review_permissions 를
        로컬 조회할 뿐이므로, **order-service 가 죽어 있어도 리뷰 작성은 정상 동작한다.**

        권한이 없으면 403 REVIEW_PERMISSION_REQUIRED 를 반환한다.
      operationId: createReview
      tags: [reviews]
      security:
        - bearerAuth: []
      parameters:
        - name: bookId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRequest"
      responses:
        "201":
          description: 작성 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewEnvelope"
        "403":
          description: 구매 확정 이력 없음 (REVIEW_PERMISSION_REQUIRED)

  /api/catalog/books/{bookId}/reading-progress:
    put:
      summary: 전자책 이어읽기 위치 저장
      description: |
        회원×도서 단위 upsert. 이력은 남기지 않고 최신 위치/퍼센트만 유지한다.

        wishlist/reviews 와 달리 X-Member-Id 헤더를 쓰지 않는다 — JWT `sub` 클레임(memberSub)으로
        회원을 식별하는 최신 방식(member-service Card 도메인과 동일)을 카탈로그 모듈에서 처음 적용했다.
      operationId: saveReadingProgress
      tags: [reading-progress]
      security:
        - bearerAuth: []
      parameters:
        - name: bookId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReadingProgressRequest"
      responses:
        "200":
          description: 저장 성공 (생성 또는 갱신)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingProgressEnvelope"
        "404":
          description: 존재하지 않거나 삭제된 도서 (BOOK_NOT_FOUND)
    get:
      summary: 전자책 이어읽기 위치 조회
      description: |
        한 번도 읽지 않은 책은 오류가 아니라 정상 상태다 — data: null 로 200 을 반환한다.
      operationId: getReadingProgress
      tags: [reading-progress]
      security:
        - bearerAuth: []
      parameters:
        - name: bookId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: "조회 성공 (기록이 없으면 data: null)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingProgressEnvelope"
        "404":
          description: 존재하지 않거나 삭제된 도서 (BOOK_NOT_FOUND)

  /api/catalog/wishlist/me:
    get:
      summary: 내 찜 목록
      operationId: getMyWishlist
      tags: [wishlist]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookSummaryListEnvelope"

  /api/catalog/reviews/{reviewId}:
    patch:
      summary: 내 리뷰 수정
      operationId: updateReview
      tags: [reviews]
      security:
        - bearerAuth: []
      parameters:
        - name: reviewId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewUpdateRequest"
      responses:
        "200":
          description: 수정 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewEnvelope"
        "403":
          description: 작성자가 아님
        "404":
          description: 리뷰 또는 공개 도서 없음
    delete:
      summary: 내 리뷰 삭제
      description: 삭제한 리뷰가 사용한 구매 권한을 복구하여 다시 리뷰를 작성할 수 있다.
      operationId: deleteReview
      tags: [reviews]
      security:
        - bearerAuth: []
      parameters:
        - name: reviewId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: 삭제 완료
        "403":
          description: 작성자가 아님
        "404":
          description: 리뷰 없음

  /api/catalog/wishlist/{bookId}:
    post:
      summary: 찜 추가
      operationId: addWishlist
      tags: [wishlist]
      security:
        - bearerAuth: []
      parameters:
        - name: bookId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: 찜 추가 완료
        "404":
          description: 공개 도서 없음
    delete:
      summary: 찜 삭제
      operationId: removeWishlist
      tags: [wishlist]
      security:
        - bearerAuth: []
      parameters:
        - name: bookId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: 찜 삭제 완료

  /api/catalog/admin/books/{bookId}/reviews:
    get:
      summary: 관리자 도서 리뷰 목록
      description: 삭제된 도서의 리뷰도 관리 목적으로 조회한다.
      operationId: getAdminBookReviews
      tags: [admin-reviews]
      security:
        - bearerAuth: []
      parameters:
        - name: bookId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewPageEnvelope"
        "404":
          description: 도서 없음

  /api/catalog/recent-books/me:
    get:
      summary: 최근 본 상품
      operationId: getMyRecentBooks
      tags: [recent-books]
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookSummaryListEnvelope"

  /api/catalog/books/{bookId}/restock-alert:
    parameters:
      - name: bookId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      summary: 재입고 알림 신청
      tags: [restock-alerts]
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: 신청 완료 }
        "404": { description: 공개 도서 없음 }
        "409": { description: 이미 대기 중인 신청 }
    delete:
      summary: 재입고 알림 신청 취소
      tags: [restock-alerts]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: 취소 완료 }
        "404": { description: 신청 없음 }

  /api/catalog/restock-alerts/me:
    get:
      summary: 내 재입고 알림 신청 목록
      tags: [restock-alerts]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [WAITING, PROCESSING, SENT, FAILED, CANCELLED] }
      responses:
        "200": { description: 조회 성공 }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    BookSummary:
      type: object
      properties:
        id: { type: integer, format: int64 }
        title: { type: string, example: 클라우드 엔지니어링 교재 }
        author: { type: string, example: 북이팅라이언 }
        price: { type: integer, example: 25000 }
        coverImageUrl: { type: string }
        category: { type: string, example: IT/컴퓨터 }
        saleStatus:
          type: string
          enum: [ON_SALE, STOPPED, OUT_OF_STOCK]

    BookDetail:
      allOf:
        - $ref: "#/components/schemas/BookSummary"
        - type: object
          properties:
            publisher: { type: string }
            isbn: { type: string }
            stockQuantity:
              type: integer
              description: order-service 조합값. -1 은 재고 조회 실패(품절 0 과 구분).
              example: 100
            description: { type: string }
            publishedDate: { type: string, format: date }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    Review:
      type: object
      properties:
        id: { type: integer, format: int64 }
        bookId: { type: integer, format: int64 }
        memberId:
          type: string
          description: Cognito sub
        nickname:
          type: string
          description: 작성 당시 닉네임 스냅샷. members 를 조인하지 않는다.
          example: 테스트유저
        rating: { type: integer, minimum: 1, maximum: 5 }
        content: { type: string }
        createdAt: { type: string, format: date-time }

    ReviewRequest:
      type: object
      required: [rating, content]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        content: { type: string, maxLength: 1000 }

    ReadingProgress:
      type: object
      properties:
        bookId: { type: integer, format: int64 }
        cfi:
          type: string
          description: epub.js CFI(Canonical Fragment Identifier) 문자열.
          example: "epubcfi(/6/14!/4/2/2/1:0)"
        percentage:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
        updatedAt: { type: string, format: date-time }

    ReadingProgressRequest:
      type: object
      required: [cfi]
      properties:
        cfi: { type: string }
        percentage:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true

    ReviewUpdateRequest:
      type: object
      required: [rating, content]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        content: { type: string, maxLength: 1000 }

    Category:
      type: object
      properties:
        categoryId: { type: integer, format: int64 }
        categoryName: { type: string, example: IT/컴퓨터 }
        parentId: { type: integer, format: int64, nullable: true }
        sortOrder: { type: integer, minimum: 0 }
        active: { type: boolean }

    CategoryCreateRequest:
      type: object
      required: [categoryName, sortOrder]
      properties:
        categoryName: { type: string, maxLength: 100 }
        parentId: { type: integer, format: int64, nullable: true }
        sortOrder: { type: integer, minimum: 0 }

    CategoryUpdateRequest:
      allOf:
        - $ref: "#/components/schemas/CategoryCreateRequest"

    AdminBookCreateRequest:
      type: object
      required: [title, author, publisher, isbn, category, price]
      properties:
        title: { type: string, maxLength: 200 }
        author: { type: string, maxLength: 100 }
        publisher: { type: string, maxLength: 100 }
        isbn: { type: string, pattern: "^[0-9]{13}$" }
        category: { type: string, maxLength: 100 }
        price: { type: integer, minimum: 0 }
        coverImageUrl: { type: string, maxLength: 500 }
        description: { type: string }
        detailedSynopsis: { type: string }
        saleStatus: { type: string, enum: [ON_SALE, STOPPED, OUT_OF_STOCK] }
        publishedDate: { type: string, format: date }

    AdminBookUpdateRequest:
      type: object
      description: 전달한 필드만 수정한다.
      properties:
        title: { type: string, maxLength: 200 }
        author: { type: string, maxLength: 100 }
        publisher: { type: string, maxLength: 100 }
        isbn: { type: string, pattern: "^[0-9]{13}$" }
        category: { type: string, maxLength: 100 }
        price: { type: integer, minimum: 0 }
        coverImageUrl: { type: string, maxLength: 500 }
        description: { type: string }
        detailedSynopsis: { type: string }
        saleStatus: { type: string, enum: [ON_SALE, STOPPED, OUT_OF_STOCK] }
        publishedDate: { type: string, format: date }

    CategoryListEnvelope:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: array
          items: { $ref: "#/components/schemas/Category" }

    BookSummaryListEnvelope:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: array
          items:
            $ref: "#/components/schemas/BookSummary"

    BookSummaryPageEnvelope:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: object
          properties:
            content:
              type: array
              items:
                $ref: "#/components/schemas/BookSummary"
            totalElements: { type: integer }

    BookDetailEnvelope:
      type: object
      properties:
        success: { type: boolean }
        data:
          $ref: "#/components/schemas/BookDetail"

    ReviewEnvelope:
      type: object
      properties:
        success: { type: boolean }
        data:
          $ref: "#/components/schemas/Review"

    ReviewPageEnvelope:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: object
          properties:
            content:
              type: array
              items:
                $ref: "#/components/schemas/Review"
            totalElements: { type: integer }

    ReadingProgressEnvelope:
      type: object
      properties:
        success: { type: boolean }
        data:
          nullable: true
          description: 한 번도 읽지 않은 책이면 null.
          allOf:
            - $ref: "#/components/schemas/ReadingProgress"
