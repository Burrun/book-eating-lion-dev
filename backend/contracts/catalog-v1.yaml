openapi: 3.0.3
info:
  title: catalog-service API
  version: "1.0.0"
  description: |
    도서·리뷰·찜·최근 본 상품·추천 추론.

    주의 — 찜/최근 본 상품 경로가 /api/members/me/* 에서 바뀌었다.
    /api/members/** 는 Ingress 가 member-service 로 보내는데, 이 데이터는
    catalog_db 소유이기 때문이다. 같은 접두사를 두 서비스가 나눠 가지면
    라우팅이 경로 길이에 의존하게 된다.

servers:
  - url: http://localhost:8081
    description: 로컬
  - url: http://catalog-service.lion-app.svc.cluster.local:8080
    description: 클러스터 내부

paths:
  /api/books:
    get:
      summary: 도서 목록
      operationId: getBooks
      tags: [books]
      parameters:
        - name: category
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookSummaryPageEnvelope"

  /api/books/{bookId}:
    get:
      summary: 도서 상세
      description: |
        stockQuantity 는 catalog_db 가 아니라 order-service 에서 조합한다(API 조합 패턴).
        order-service 가 응답하지 않으면 -1 이 들어오며, 프론트는 재고 영역만 degrade 하고
        도서 정보는 정상 노출한다.
      operationId: getBook
      tags: [books]
      parameters:
        - name: bookId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookDetailEnvelope"
        "404":
          description: 도서 없음

  /api/books/{bookId}/reviews:
    get:
      summary: 리뷰 목록
      operationId: getReviews
      tags: [reviews]
      parameters:
        - name: bookId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewPageEnvelope"
    post:
      summary: 리뷰 작성
      description: |
        구매 검증을 order-service 에 동기 호출하지 않는다.
        구매 확정 시 ReviewPermissionGranted 이벤트로 미리 받아둔 review_permissions 를
        로컬 조회할 뿐이므로, **order-service 가 죽어 있어도 리뷰 작성은 정상 동작한다.**

        권한이 없으면 403 REVIEW_PERMISSION_REQUIRED 를 반환한다.
      operationId: createReview
      tags: [reviews]
      security:
        - bearerAuth: []
      parameters:
        - name: bookId
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: X-Member-Id
          in: header
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRequest"
      responses:
        "201":
          description: 작성 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewEnvelope"
        "403":
          description: 구매 확정 이력 없음 (REVIEW_PERMISSION_REQUIRED)

  /api/wishlist/me:
    get:
      summary: 내 찜 목록
      operationId: getMyWishlist
      tags: [wishlist]
      security:
        - bearerAuth: []
      parameters:
        - name: X-Member-Id
          in: header
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookSummaryListEnvelope"

  /api/recent-books/me:
    get:
      summary: 최근 본 상품
      operationId: getMyRecentBooks
      tags: [recent-books]
      security:
        - bearerAuth: []
      parameters:
        - name: X-Member-Id
          in: header
          required: true
          schema: { type: integer, format: int64 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookSummaryListEnvelope"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    BookSummary:
      type: object
      properties:
        id: { type: integer, format: int64 }
        title: { type: string, example: 클라우드 엔지니어링 교재 }
        author: { type: string, example: 북이팅라이언 }
        price: { type: integer, example: 25000 }
        coverImageUrl: { type: string }
        category: { type: string, example: IT/컴퓨터 }
        saleStatus:
          type: string
          enum: [ON_SALE, STOPPED, OUT_OF_STOCK]

    BookDetail:
      allOf:
        - $ref: "#/components/schemas/BookSummary"
        - type: object
          properties:
            publisher: { type: string }
            isbn: { type: string }
            stockQuantity:
              type: integer
              description: order-service 조합값. -1 은 재고 조회 실패(품절 0 과 구분).
              example: 100
            description: { type: string }
            publishedDate: { type: string, format: date }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    Review:
      type: object
      properties:
        id: { type: integer, format: int64 }
        bookId: { type: integer, format: int64 }
        memberId: { type: integer, format: int64 }
        nickname:
          type: string
          description: 작성 당시 닉네임 스냅샷. members 를 조인하지 않는다.
          example: 테스트유저
        rating: { type: integer, minimum: 1, maximum: 5 }
        content: { type: string }
        createdAt: { type: string, format: date-time }

    ReviewRequest:
      type: object
      required: [rating, content]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        content: { type: string, maxLength: 1000 }

    BookSummaryListEnvelope:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: array
          items:
            $ref: "#/components/schemas/BookSummary"

    BookSummaryPageEnvelope:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: object
          properties:
            content:
              type: array
              items:
                $ref: "#/components/schemas/BookSummary"
            totalElements: { type: integer }

    BookDetailEnvelope:
      type: object
      properties:
        success: { type: boolean }
        data:
          $ref: "#/components/schemas/BookDetail"

    ReviewEnvelope:
      type: object
      properties:
        success: { type: boolean }
        data:
          $ref: "#/components/schemas/Review"

    ReviewPageEnvelope:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: object
          properties:
            content:
              type: array
              items:
                $ref: "#/components/schemas/Review"
            totalElements: { type: integer }
