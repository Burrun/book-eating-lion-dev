openapi: 3.0.3
info:
  title: member-service API
  version: "1.0.0"
  description: |
    회원·인증·배송지·프리미엄 멤버십.

    이 서비스의 계약에서 가장 중요한 것은 엔드포인트가 아니라 **JWT 클레임**이다.
    member_id 와 nickname 을 토큰에 실어야 다른 서비스가 회원 정보를 확인하려고
    이 서비스를 동기 호출하지 않는다. 클레임이 빠지면 인증이 모든 요청의
    임계경로가 되고, member-service 가 단일 장애점이 된다.

servers:
  - url: http://localhost:8083
    description: 로컬
  - url: http://member-service.lion-app.svc.cluster.local:8080
    description: 클러스터 내부

paths:
  /api/auth/login:
    post:
      summary: 로그인
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenEnvelope"
        "401":
          description: 인증 실패

  /api/members/me:
    get:
      summary: 내 정보
      operationId: getMe
      tags: [members]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberEnvelope"

  /api/members/me/addresses:
    get:
      summary: 내 배송지 목록
      description: addresses 는 member_db 소속이라 delivery 가 아니라 이 서비스가 소유한다.
      operationId: getMyAddresses
      tags: [addresses]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Address"
    post:
      summary: 배송지 등록
      operationId: createAddress
      tags: [addresses]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressCreateRequest"
      responses:
        "201":
          description: 등록 완료

  /api/cards:
    post:
      summary: 가상카드 신규 발급
      description: |
        카드번호는 실제 카드망이 아니라 이 서비스가 로컬 목(mock) 생성한다
        ("5361-****-****-" + 랜덤 4자리). monthlyLimit 을 생략하면 기본값
        1,000,000원이 적용된다.
      operationId: issueCard
      tags: [cards]
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueCardRequest"
      responses:
        "201":
          description: 발급 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardEnvelope"

  /api/cards/me:
    get:
      summary: 내 보유 가상카드 목록 조회
      operationId: getMyCards
      tags: [cards]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardListEnvelope"

  /api/cards/{cardId}/status:
    patch:
      summary: 카드 상태 변경
      description: CLOSED 는 종단 상태다 — 이미 CLOSED 인 카드는 다시 바꿀 수 없다.
      operationId: changeCardStatus
      tags: [cards]
      security:
        - bearerAuth: []
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeCardStatusRequest"
      responses:
        "200":
          description: 변경 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardEnvelope"
        "400":
          description: 이미 CLOSED 인 카드
        "403":
          description: 본인 소유가 아닌 카드
        "404":
          description: 존재하지 않는 카드

  /internal/cards/{cardId}/deduct:
    post:
      summary: 가상카드 한도 차감
      description: |
        order-service 의 결제 승인 단계에서 호출한다(§7.6 예외 — order-v1.yaml 의
        cart/order 계약 참고). /internal/** 이므로 Ingress 로 외부에 노출되지 않는다.
        한도 부족 등으로 차감이 불가능하면 approved=false 를 반환한다 — 이건 실패가
        아니라 정상적인 "거절" 응답이며, order-service 는 이를 결제 거절로 처리한다.
        member-service 가 응답하지 않으면 order-service 의 Resilience4j fallback 이
        approved=false 로 degrade 시켜 결제를 거절 처리한다(승인 처리로 fail-open 하지
        않는다).
      operationId: deductCardLimit
      tags: [internal-cards]
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardOperationRequest"
      responses:
        "200":
          description: 처리 완료(승인/거절 모두 200 — approved 필드로 구분한다)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardOperationResult"

  /internal/cards/{cardId}/restore:
    post:
      summary: 가상카드 한도 복구
      description: |
        order-service 의 주문 취소 단계에서 호출한다. 취소는 단일 트랜잭션이라
        이 호출이 실패하면(approved=false 또는 무응답) order-service 는 재고·쿠폰
        복구를 포함한 취소 전체를 롤백한다 — 부분 복구 상태를 만들지 않는다.
      operationId: restoreCardLimit
      tags: [internal-cards]
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardOperationRequest"
      responses:
        "200":
          description: 처리 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardOperationResult"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ---------------------------------------------------------------------
    # 이 스키마가 사실상 서비스 간 계약의 핵심이다.
    # Cognito PreTokenGeneration 이 member_id / nickname 을 주입해야 한다.
    # ---------------------------------------------------------------------
    JwtClaims:
      type: object
      required: [sub, member_id]
      properties:
        sub:
          type: string
          description: Cognito 사용자 식별자
        member_id:
          type: integer
          format: int64
          description: |
            order/catalog/ai 가 소유권 검증에 쓰는 값.
            이게 없으면 각 서비스가 member-service 를 동기 호출해야 한다.
        nickname:
          type: string
          description: 리뷰·문의 작성자 표시용 스냅샷 원본.

    TokenEnvelope:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: object
          properties:
            accessToken: { type: string }
            refreshToken: { type: string }
            expiresIn: { type: integer, example: 3600 }

    MemberEnvelope:
      type: object
      properties:
        success: { type: boolean }
        data:
          $ref: "#/components/schemas/Member"

    Member:
      type: object
      properties:
        id: { type: integer, format: int64 }
        email: { type: string, format: email }
        name: { type: string }
        nickname: { type: string }
        grade:
          type: string
          enum: [BASIC, PREMIUM]
        point: { type: integer }

    Address:
      type: object
      properties:
        id: { type: integer, format: int64 }
        recipientName: { type: string }
        phoneNumber: { type: string }
        zipcode: { type: string }
        address: { type: string }
        detailAddress: { type: string }
        isDefault: { type: boolean }

    AddressCreateRequest:
      type: object
      required: [recipientName, phoneNumber, zipcode, address]
      properties:
        recipientName: { type: string }
        phoneNumber: { type: string }
        zipcode: { type: string }
        address: { type: string }
        detailAddress: { type: string }
        isDefault: { type: boolean, default: false }

    CardOperationRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: integer
          minimum: 1

    CardOperationResult:
      type: object
      properties:
        approved:
          type: boolean
        message:
          type: string
          example: 한도 초과

    IssueCardRequest:
      type: object
      properties:
        monthlyLimit:
          type: integer
          minimum: 1000
          default: 1000000

    ChangeCardStatusRequest:
      type: object
      required: [cardStatus]
      properties:
        cardStatus:
          type: string
          enum: [ACTIVE, SUSPENDED, CLOSED]

    Card:
      type: object
      properties:
        cardId:
          type: integer
          format: int64
        maskedCardNumber:
          type: string
          example: "5361-****-****-1234"
        cardStatus:
          type: string
          enum: [ACTIVE, SUSPENDED, CLOSED]
        monthlyLimit:
          type: integer
        currentUsage:
          type: integer
        issuedDate:
          type: string
          format: date
        expiryDate:
          type: string
          format: date

    CardEnvelope:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/Card"

    CardListEnvelope:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: "#/components/schemas/Card"
