openapi: 3.0.3
info:
  title: ai-service API
  version: "1.0.0"
  description: |
    구매한 책 RAG + 고객상담.

    | 경로                      | 하는 일                        | 자료                  |
    |---------------------------|--------------------------------|--------------------|
    | /api/ai/lion/ask          | 구매한 책 내용 + 내 완독 메모에 답하기 | S3 Vectors (wiki-v1)  |
    | /api/ai/lion/feed, /me    | 메모 먹이기(임베딩+적재+EXP), 사자 상태 | ai_db (lions/fed_books)|
    | /api/ai/bot/ask           | 고객상담 — FAQ 기반 1차 응답   | ai_db (faqs)          |
    | /api/ai/bot/chat/ticket   | 상담 웹소켓 1회성 교환권 발급  | Redis (tickets)       |
    | /ws/ai/chat                | 1:1 라이브/AI 상담 실시간 채널 | Redis Pub/Sub / ZSet  |

    `/api/ai/lion/**` 는 **책 내용** 전담이고 고객상담은 `/api/ai/bot/**` 및 `/ws/ai/chat` 이 담당한다.
    자료도 목적도 달라서 합치지 않는다.

    🔴 **검색 권한의 근거는 "구매"다.** 라이언에게 먹였는지(게이미피케이션)와는 별개다 —
    사자를 안 키워도 산 책은 읽을 수 있어야 하고, 먹였다고 안 산 책을 읽을 수는 없다.

    벡터는 **책 본문은 공용, 완독 메모는 회원 전용**이다. 책 본문 벡터는 누가 샀든 1벌만
    존재하고(키가 {bookId}#{page}#{seq} 로 결정적), "누가 무엇을 샀는가"는 purchased_books 가
    들고 있다. 질의 시 그 목록이 그대로 검색 필터가 되므로 안 산 책은 나오지 않는다.
    이 표는 order-service 가 결제 확정 후 SQS 로 보내는 이벤트로 채워진다
    (계약: docs/ai-integration.md).

    완독 메모(`sourceType: user_summary`)는 회원×도서로 결정적인 키(`memo#{bookId}#{memberId}`)를
    쓰고, 메타데이터의 `memberId`로 작성자 본인만 검색 결과에서 볼 수 있게 한 번 더 거른다 —
    같은 책을 산 다른 회원이라도 남의 메모는 보이면 안 되므로, bookId 필터만으로는 부족한
    유일한 경우다.

    1:1 문의 등록(`POST /api/ai/bot/inquiries`)은 없앴다. 받아 두기만 하고 답변할 수단이
    없었다 — 사용자는 답을 기다리는데 아무도 그 행의 존재를 모르는 상태였다. 상담사가
    없을 때는 문의 게시판으로 안내한다.

    Deployment 는 이미지 1개에 2개(ai-rag / ai-bot)이고 Ingress 가 경로로 가른다.
    HPA 메트릭과 타임아웃 정책이 다르기 때문이다 — 임베딩·LLM 이 전부 외부 API 라
    I/O 바운드고, CPU HPA 로는 확장되지 않아 동시 요청 수로 간다.

    이 서비스는 원래 다른 서비스와 통신하지 않고 자기 스키마(ai_db)에만 붙는다. 유일한
    예외는 먹이기(POST /api/ai/lion/feed)의 EXP 2배 판정이다 — member-service 의
    /internal/members/{memberId}/subscription-status 를 동기 조회하되, 실패하면 1배로
    안전 강등될 뿐 먹이기 자체는 계속 성공한다(fail-safe, order-service 의 CardClient와
    동일 패턴).

servers:
  - url: http://localhost:8084
    description: 로컬
  - url: http://ai-service.lion-app.svc.cluster.local:8080
    description: 클러스터 내부

paths:
  /api/ai/lion/ask:
    post:
      summary: 위키 RAG Q&A — 답변 + "어느 책 몇 페이지"
      description: |
        → ai-rag Deployment. 로그인 필수.

        파이프라인: ①질의 임베딩(Bedrock Titan V2) → ②S3 Vectors 검색 → ③책당 상한 3개
        + 상위 5 컷 → ④거리 가드 → ⑤LLM(counsel 모드일 때만) → ⑥답변 + citations

        **④가 핵심이다.** 근거가 임계값보다 멀면 `grounded: false` 로 끝내고 LLM 을
        호출하지 않는다. 근거 없이 LLM 을 부르면 반드시 지어내며, 프롬프트로는 못 막는다.

        **③의 책당 상한**은 한 책이 상위 5칸을 독점하는 것을 막는다. 같은 소재가 여러
        책에 나올 때(예: "김첨지"는 「운수 좋은 날」과 「정규직 되는 날」 양쪽에 있다)
        한쪽이 다 먹으면 정답 책이 밀려나고, 그러면 LLM 은 판별할 재료조차 못 받는다.

        모호할 때 되묻지 않는다. 여러 책에 걸치면 책별로 나눠 한 번에 답한다 —
        되묻기는 LLM 호출을 2회로 늘리고 서버가 대화 상태를 들어야 해서
        stateless 설계가 깨진다.

        쿼터는 사용자별 일일 상한이다. Redis 장애 시에는 **통과시킨다(fail-open)** —
        쿼터는 과금 방어선이지 인증이 아니고, Redis 는 여러 서비스가 공유하므로
        여기서 막으면 장애 반경만 넓어진다. 대신 WARN 로그와 경보를 남긴다.
      operationId: askWiki
      tags: [ai-wiki]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskRequest"
      responses:
        "200":
          description: |
            응답 생성 완료. 근거를 못 찾은 경우도 200 이며 `grounded: false` 로 구분한다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskEnvelope"
        "400":
          description: query 가 비었거나 너무 김
        "401":
          description: 인증 없음/만료
        "429":
          description: |
            일일 쿼터 초과 또는 동시 요청 포화(Bulkhead). `Retry-After` 헤더를 함께 보낸다.
            서버 장애(5xx)가 아니라 "지금 붐빔"이라는 뜻이다.
          headers:
            Retry-After:
              schema: { type: integer }
              description: 재시도까지 대기할 초

  /api/ai/lion/feed:
    post:
      summary: 라이언에게 완독 요약 메모 먹이기
      description: |
        "먹일 수 있는지"(완독 + 메모 작성 여부) 판단은 catalog-service(book_memos)가
        끝낸 뒤의 호출이다 — 여기는 그걸 다시 확인하지 않고, 받은 메모 텍스트를 그대로
        믿고 임베딩 → 벡터 적재 → `fed_books` 행 추가 + exp 갱신 + Redis Set 갱신까지
        전부 동기로 끝낸다.

        🔴 책 본문 인제스트(관리자 배치)와 다른 결정이다. 그쪽은 책 1권이 12~46청크라
        동기로 하면 타임아웃이 나지만, 메모는 텍스트 하나 = 벡터 하나라 임베딩 1회로
        끝나 동기로도 충분하다(느리면 프론트가 로딩 표시로 흡수한다).

        exp는 멱등하다 — `fed_books` 의 PK 가 (member_id, book_id) 라 같은 책을 다시
        먹여도 중복으로 오르지 않는다. 벡터 적재는 멱등이 아니라 **항상 최신으로
        덮어쓴다** — 메모를 고쳐 쓴 뒤 다시 먹이면 exp는 그대로지만 RAG가 아는 내용은
        갱신된다(벡터 키가 `memo#{bookId}#{memberId}` 로 회원×도서당 결정적이라 재적재가
        곧 갱신이다).
      operationId: feedLion
      tags: [ai-lion]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bookId, bookTitle, memoText]
              properties:
                bookId: { type: integer, format: int64, example: 1 }
                bookTitle:
                  type: string
                  example: 운수 좋은 날
                  description: 인용 표시용 스냅샷. catalog-service를 다시 호출하지 않기 위해 클라이언트가 함께 싣는다.
                memoText:
                  type: string
                  maxLength: 4000
                  description: 완독 후 사용자가 쓴 책 내용 요약. "사자에게 물어보기"의 지식 소스가 된다.
      responses:
        "200":
          description: |
            먹이기 완료(벡터 적재 + exp 반영, 이미 먹인 메모의 재작성이면 exp는 그대로).

            응답은 `GET /api/ai/lion/me` 와 같은 형태다 — 먹이기 결과도 결국 "먹인 뒤의
            사자"라 값이 같다. 프론트는 두 응답을 같은 타입으로 다루면 된다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LionStatusEnvelope"
        "401":
          description: 인증 없음/만료

  /api/ai/lion/me:
    get:
      summary: 내 사자 상태
      description: |
        레벨·경험치·성장단계와 먹인 책 수.

        **조회는 사자를 만들지 않는다.** 아직 한 번도 먹이지 않은 사용자는 `lions` 행이
        없고, 그때는 기본값(레벨 1 / 경험치 0 / BABY)을 돌려준다 — 행이 없는 것과 같은
        의미이기 때문이다. 사자 행은 첫 `feed` 에서 생긴다.
      operationId: getMyLion
      tags: [ai-lion]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 사자 상태
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LionStatusEnvelope"
        "401":
          description: 인증 없음/만료

  /api/ai/bot/ask:
    post:
      summary: 문의봇 질의 (단발성 REST)
      description: |
        → ai-bot Deployment.

        외부 LLM API 호출이라 순수 I/O 대기다. 요청 100건이 동시에 들어와도 CPU 는
        5% 언저리에 머물기 때문에 CPU 기반 HPA 로는 절대 확장되지 않는다.
        Bulkhead 스레드풀로 격리해 봇이 폭주해도 RAG 가 스레드를 확보한다.
      operationId: askBot
      tags: [ai-bot]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: { type: string, example: "배송은 얼마나 걸리나요?" }
      responses:
        "200":
          description: 응답 생성 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TextEnvelope"

  /api/ai/bot/chat/ticket:
    post:
      summary: 상담 채팅 WebSocket 교환권(Ticket) 발급
      description: |
        → ai-bot Deployment. 로그인 필수.

        WebSocket 접속용 1회성 교환권을 발급한다.
        JWT 토큰의 `cognito:groups` 클레임을 분석하여 `ADMIN` 포함 여부로 상담사(`isAgent`)
        판정을 여기서 완결하고 티켓에 고정한다.
      operationId: issueChatTicket
      tags: [ai-bot]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 티켓 발급 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketEnvelope"
        "401":
          description: 인증 없음/만료

  /ws/ai/chat:
    get:
      summary: 고객상담 실시간 WebSocket 채널
      description: |
        → ai-bot Deployment.

        **Query Parameter**: `ticket` (GET /api/ai/bot/chat/ticket 발급 티켓)
        **CORS**: `Origin` 헤더 기반 백엔드 단독 검증.

        **채팅 상태(ChatState)**: `BOT` → `WAITING` → `LIVE` → `CLOSED`

        **클라이언트 ↔ 서버 JSON 프레임 구조 (`Frame`)**:
        - `type`: `ASK` | `SAY` | `ESCALATE` | `CLAIM` | `CLOSE`
        - `text`: 메시지 본문
        - `roomId`: 상담방 ID

        **액션 상세**:
        - `ASK`: `BOT` 상태에서 AI봇에게 1:1 질문.
        - `ESCALATE`: 상담사 연결 요청. 온라인 상담사(`AgentPresence`)가 0명이면 `NO_AGENT` 응답 및 종료.
        - `CLAIM`: 상담사가 대기 방 수락 (`WAITING` → `LIVE` 전환, 상담사 전용).
        - `SAY`: `LIVE` 구간에서 사용자 ↔ 상담사 양방향 대화.
        - `CLOSE`: 상담방 종료.
      operationId: connectChatWebSocket
      tags: [ai-bot]
      parameters:
        - name: ticket
          in: query
          required: true
          description: 발급받은 WebSocket 티켓
          schema:
            type: string
      responses:
        "101":
          description: WebSocket Protocol Handshake Switch
        "400":
          description: 유효하지 않거나 만료된 티켓 / Origin 허용 거부

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    AskRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 500
          example: 김첨지가 설렁탕을 사온 이유는?
        mode:
          type: string
          enum: [search, answer]
          description: |
            `search` = 검색만. LLM 을 부르지 않으므로 비용 0.
            `answer` = 검색 결과를 LLM 이 종합해 문장으로 답한다.

            생략하면 서버가 정한다. **현재는 1층(규칙)만 구현되어 있고**, 설명을 요구하는
            표현이 없으면 `search` 로 떨어진다 — 싼 쪽이고, 프론트가 "더 자세히 답변받기"
            버튼으로 `mode:"answer"` 재요청을 걸 수 있어 사용자가 막히지 않는다.

            계획서 10단계의 2층(LLM 분류기)은 아직 없다. 명시하면 분기를 건너뛴다.
        bookIds:
          type: array
          items: { type: integer, format: int64 }
          description: |
            **좁히기 전용이다. 넓히기에는 쓸 수 없다.**

            서버는 이 목록과 "내가 구매한 책"의 교집합만 검색한다. 안 산 bookId 를
            넣어도 무시된다 — 그러지 않으면 먹지 않은 책의 본문을 그대로 읽어갈 수 있다.
            생략하면 내가 구매한 책 전체가 대상이고, 산 책이 없으면 검색하지 않는다.
        topK:
          type: integer
          minimum: 1
          maximum: 10
          default: 5
          description: 반환할 인용 개수. 서버는 이보다 많이 검색한 뒤 책당 상한을 적용하고 여기까지 자른다.

    AskEnvelope:
      type: object
      properties:
        success: { type: boolean }
        data:
          $ref: "#/components/schemas/AskResult"

    AskResult:
      type: object
      required: [mode, grounded, answer, citations]
      properties:
        mode:
          type: string
          enum: [search, answer]
          description: 실제로 사용된 모드. 프론트는 search 응답 아래 "더 자세히 답변받기" 버튼으로 `mode:"answer"` 재요청을 건다.
        grounded:
          type: boolean
          description: |
            근거를 찾았는가. false 면 `answer` 는 고정 문구이고 `citations` 는 빈 배열이다.

            false 가 나오는 경우는 둘이다 — ① 정말 자료에 없는 질문
            ② 벡터 검색 자체가 장애(서킷 브레이커 OPEN). ②를 500 이 아니라 degrade 로
            처리하는 이유는 AI 장애가 나머지 기능으로 전이되면 안 되기 때문이다.
        answer:
          type: string
          description: |
            `answer` 모드에서만 LLM 생성문이다. `search` 모드는 LLM 을 부르지 않으므로
            `"구매한 책에서 근거 N곳을 찾았습니다."` 고정 문구이고 `[n]` 인용 표기가 없다.
            근거를 못 찾으면 모드와 무관하게 `"구매한 책에서 근거를 찾지 못했습니다."` 다.
          example: 앓는 아내에게 주려고 샀습니다 [1].
        citations:
          type: array
          items:
            $ref: "#/components/schemas/Citation"

    Citation:
      type: object
      required: [ref, bookId, bookTitle, page, snippet, score, sourceType]
      properties:
        ref:
          type: integer
          description: answer 본문의 [1], [2] 와 대응한다.
          example: 1
        bookId: { type: integer, format: int64, example: 1 }
        bookTitle: { type: string, example: 운수 좋은 날 }
        page:
          type: integer
          description: |
            이 프로젝트의 KPI 다. 청크는 페이지 경계를 절대 넘지 않으므로 이 값은 항상 단일 페이지다.
          example: 1
        snippet:
          {
            type: string,
            example: 앓는 아내에게 설렁탕 한 그릇도 사다 줄 수 있음이다.,
          }
        score:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: |
            **클수록 유사하다.** S3 Vectors 는 거리(작을수록 유사)를 주므로 `1 - distance` 로
            뒤집어 내보낸다. 이 부호를 반대로 구현하면 관련 질문엔 "모르겠다"고 하고
            무관한 질문엔 자신 있게 답하는, 예외도 로그도 없는 버그가 된다.
          example: 0.87
        sourceType:
          type: string
          enum: [book_content, user_summary]
          description: book_content면 책 원문, user_summary면 이 회원 본인이 완독 후 쓴 요약 메모.
          example: book_content

    TextEnvelope:
      type: object
      properties:
        success: { type: boolean }
        data: { type: string }

    TicketEnvelope:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: object
          required: [ticket, expiresInSeconds]
          properties:
            ticket: { type: string, example: "8f7a2b91-4c6e-4e3f-912a-8c7b6a5d4e3f" }
            expiresInSeconds: { type: integer, example: 60 }

    LionStatusEnvelope:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: object
          required: [exp, level, growthStage, fedBookCount]
          properties:
            exp: { type: integer, format: int64, example: 120 }
            level: { type: integer, example: 2 }
            growthStage:
              type: string
              enum: [BABY, CUB, ADULT]
              description: |
                lions.growth_stage. level 기준 구간(프론트 LionCharacter.getLionTier 와 동일):
                레벨 1~2 BABY, 3~4 CUB, 5 이상 ADULT. 첫 사자(레벨 1)는 BABY 다.
              example: BABY
            fedBookCount:
              type: integer
              format: int64
              description: 먹인 책 수(라이언 경험치용). 검색 가능 여부와는 무관하다 — 그건 구매가 정한다.
              example: 3

