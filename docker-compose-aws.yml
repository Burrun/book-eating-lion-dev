services:
  # AWS 직접 연동 전용 백엔드 서비스
  # 로컬 MySQL 컨테이너 없이 AWS RDS, S3 등 클라우드 자원에 직접 연결
  backend-aws:
    build:
      context: ./backend
      dockerfile: apps/api/Dockerfile
    container_name: final-backend-aws
    ports:
      - "8080:8080"
    environment:
      # 운영 프로필(prod) 사용
      SPRING_PROFILES_ACTIVE: prod

      # SSM 포트 포워딩(localhost:3306) 사용 시 host.docker.internal 로 로컬 호스트 통로 연결
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}

      # 컨테이너 내부로 AWS 자격 증명 환경 변수 제한 전달
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    volumes:
      # 호스트의 ~/.aws 자격증명 폴더를 읽기 전용(:ro) 마운트하여 컨테이너에 전달
      - ~/.aws:/root/.aws:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: final-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend-aws
