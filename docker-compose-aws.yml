# AWS 직접 연동 전용 (로컬 DB 컨테이너 없이 Aurora 에 직접 붙는다)
#
# 서비스가 4개로 나뉘면서 접속 정보도 나뉜다:
#   catalog / order / member / ai → 같은 Aurora 클러스터, 스키마와 계정이 각각 다르다
#   격리를 만드는 건 클러스터가 아니라 계정 권한이다 — ai_svc 는 order_db 를 못 읽는다
#
# 계정을 하나로 합치면 스키마 권한 경계가 무너져 MSA 전환의 핵심 장치가 사라진다.
# 편의를 위해서라도 공용 계정을 쓰지 말 것.
services:
  catalog-aws:
    build:
      context: ./backend
      dockerfile: apps/catalog-api/Dockerfile
    container_name: final-catalog-aws
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # 읽기 95% 이므로 Reader 엔드포인트를 쓴다.
      DB_HOST: ${DB_READER_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${CATALOG_DB_USERNAME}
      DB_PASSWORD: ${CATALOG_DB_PASSWORD}
      SERVICES_ORDER_URL: http://order-aws:8080
      REDIS_HOST: ${REDIS_HOST:-host.docker.internal}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      AWS_COGNITO_REGION: ${AWS_REGION:-ap-northeast-2}
      AWS_COGNITO_USER_POOL_ID: ${AWS_COGNITO_USER_POOL_ID}
    volumes:
      - ~/.aws:/root/.aws:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  order-aws:
    build:
      context: ./backend
      dockerfile: apps/order-api/Dockerfile
    container_name: final-order-aws
    ports:
      - "8082:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # 쓰기 서비스라 Writer 로 간다.
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${ORDER_DB_USERNAME}
      DB_PASSWORD: ${ORDER_DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST:-host.docker.internal}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      AWS_COGNITO_REGION: ${AWS_REGION:-ap-northeast-2}
      AWS_COGNITO_USER_POOL_ID: ${AWS_COGNITO_USER_POOL_ID}
    volumes:
      - ~/.aws:/root/.aws:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  member-aws:
    build:
      context: ./backend
      dockerfile: apps/member-api/Dockerfile
    container_name: final-member-aws
    ports:
      - "8083:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${MEMBER_DB_USERNAME}
      DB_PASSWORD: ${MEMBER_DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST:-host.docker.internal}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      AWS_COGNITO_REGION: ${AWS_REGION:-ap-northeast-2}
      AWS_COGNITO_USER_POOL_ID: ${AWS_COGNITO_USER_POOL_ID}
      AWS_COGNITO_CLIENT_ID: ${AWS_COGNITO_CLIENT_ID}
      AWS_COGNITO_CLIENT_SECRET: ${AWS_COGNITO_CLIENT_SECRET}
    volumes:
      - ~/.aws:/root/.aws:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ai-aws:
    build:
      context: ./backend
      dockerfile: apps/ai-api/Dockerfile
    container_name: final-ai-aws
    ports:
      - "8084:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # 다른 세 서비스와 같은 엔드포인트다. 계정만 다르다(ai_svc).
      AI_DB_HOST: ${DB_HOST:-host.docker.internal}
      AI_DB_PORT: ${AI_DB_PORT:-5432}
      AI_DB_NAME: ${AI_DB_NAME}
      AI_DB_USERNAME: ${AI_DB_USERNAME}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      AWS_BEDROCK_REGION: ${AWS_REGION:-ap-northeast-2}
      AWS_COGNITO_REGION: ${AWS_REGION:-ap-northeast-2}
      AWS_COGNITO_USER_POOL_ID: ${AWS_COGNITO_USER_POOL_ID}
      REDIS_HOST: ${REDIS_HOST:-host.docker.internal}
    volumes:
      - ~/.aws:/root/.aws:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: final-frontend
    ports:
      - "3000:80"
    depends_on:
      - catalog-aws
