name: Integrated Dev Deploy

# dev.ajttk.com 임시 컷오버 검증용 워크플로.
#
# main-cd.yml(정식 EKS 경로)과 별개, k3s-dev-deploy.yml(EC2 self-hosted 경로)과도
# 별개다 - lion-team3-integrated 클러스터로 dev 코드를 임시로 배포하기 위한
# 전용 워크플로. GitHub-hosted 러너 + OIDC라 로컬 docker/kubectl 필요 없음.
#
# 네임스페이스는 k8s/*/*.yaml에 하드코딩된 그대로 lion-app 을 그대로 쓴다 -
# integrated 클러스터엔 아직 prod가 없어서 지금은 충돌이 없다. 나중에 prod까지
# 이 클러스터에 올리면 그때는 네임스페이스 파라미터화가 필요하다(별도 작업).
#
# secrets(DB 비번, cognito client secret, kakaopay key 등)와 일부 vars(REDIS_HOST,
# AWS_COGNITO_USER_POOL_ID, SQS 큐 URL, S3 버킷명)는 기존 dev GitHub Environment
# 걸 그대로 재사용한다 - DB도 dev 걸 그대로 쓰니까(bookdb_prod 아님, 아래
# db_endpoint/db_name도 /dev/... SSM에서 읽는다).
#
# EKS_CLUSTER/ECR/IRSA ARN만 integrated 전용 값이다. IRSA ARN은 integrated
# 클러스터의 OIDC provider로 새로 발급된 것이라(terraform ai_service_iam/
# member_service_iam @ integrated/02-runtime) dev 클러스터 것과 다르다 - 반드시
# /integrated/... SSM에서 읽어야 한다(/dev/... 값 쓰면 AssumeRoleWithWebIdentity가
# federated principal 불일치로 거부된다).
on:
  workflow_dispatch:
    inputs:
      services:
        description: "배포할 서비스 (콤마 구분, 기본 전체)"
        default: "catalog,order,member,ai"
        required: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  EKS_CLUSTER: lion-team3-integrated
  ECR_REGISTRY: 061039804626.dkr.ecr.ap-northeast-2.amazonaws.com
  ECR_CATALOG_REPO: lion-team3-integrated/catalog
  ECR_ORDER_REPO: lion-team3-integrated/order
  ECR_MEMBER_REPO: lion-team3-integrated/member
  ECR_AI_REPO: lion-team3-integrated/ai

jobs:
  deploy:
    name: 빌드 + 배포 (integrated / dev 임시)
    runs-on: ubuntu-latest
    # DB 비번 등 dev 시크릿을 그대로 재사용하기 위해 dev Environment로 돈다.
    # (실제 대상 클러스터는 integrated지만 "이건 dev 워크로드다"라는 의미로 dev를 씀)
    environment: dev
    steps:
      - uses: actions/checkout@v4

      # integrated 클러스터 EKS access entry가 걸려 있는 전용 OIDC role.
      # 새 GitHub repository variable로 한 번만 등록해두면 됨:
      #   gh variable set INTEGRATED_AWS_ROLE_ARN --body "<terraform output github_actions_role_arn 값>"
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.INTEGRATED_AWS_ROLE_ARN }}
          role-session-name: gha-integrated-dev-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 이미지 빌드 + 푸시
        env:
          IMAGE_TAG: integrated-dev-${{ github.sha }}
        run: |
          set -euo pipefail
          IFS=',' read -ra SERVICES <<< "${{ inputs.services }}"
          for svc in "${SERVICES[@]}"; do
            REPO_VAR="ECR_$(echo "$svc" | tr a-z A-Z)_REPO"
            REPOSITORY="${!REPO_VAR}"
            IMAGE="$ECR_REGISTRY/$REPOSITORY"
            echo "=== building $svc ==="
            docker build -t "$IMAGE:$IMAGE_TAG" -f "backend/apps/${svc}-api/Dockerfile" backend
            docker push "$IMAGE:$IMAGE_TAG"
          done
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Update EKS kubeconfig
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"

      - name: SSM에서 dev DB / integrated IRSA 값 읽기
        run: |
          set -euo pipefail
          echo "DB_WRITER_ENDPOINT=$(aws ssm get-parameter --name /dev/data/db_endpoint --query 'Parameter.Value' --output text)" >> "$GITHUB_ENV"
          echo "DB_READER_ENDPOINT=$(aws ssm get-parameter --name /dev/data/db_reader_endpoint --query 'Parameter.Value' --output text)" >> "$GITHUB_ENV"
          echo "AI_SERVICE_IRSA_ARN=$(aws ssm get-parameter --name /integrated/ai/service_irsa_arn --query 'Parameter.Value' --output text)" >> "$GITHUB_ENV"
          echo "MEMBER_SERVICE_IRSA_ARN=$(aws ssm get-parameter --name /integrated/member/service_irsa_arn --query 'Parameter.Value' --output text)" >> "$GITHUB_ENV"

      - name: 공통 매니페스트 렌더링 + apply (k8s/base)
        env:
          DEPLOY_ENV: dev
          SPRING_PROFILE: prod
          API_HOST: dev.ajttk.com
          FRONTEND_ORIGIN: https://dev.ajttk.com
          VPC_CIDR: 10.13.0.0/16
          AWS_COGNITO_CLIENT_ID: ${{ secrets.AWS_COGNITO_CLIENT_ID }}
          AWS_COGNITO_CLIENT_SECRET: ${{ secrets.AWS_COGNITO_CLIENT_SECRET }}
          CATALOG_DB_USERNAME: ${{ secrets.CATALOG_DB_USERNAME }}
          CATALOG_DB_PASSWORD: ${{ secrets.CATALOG_DB_PASSWORD }}
          ORDER_DB_USERNAME: ${{ secrets.ORDER_DB_USERNAME }}
          ORDER_DB_PASSWORD: ${{ secrets.ORDER_DB_PASSWORD }}
          KAKAOPAY_SECRET_KEY: ${{ secrets.KAKAOPAY_SECRET_KEY }}
          MEMBER_DB_USERNAME: ${{ secrets.MEMBER_DB_USERNAME }}
          MEMBER_DB_PASSWORD: ${{ secrets.MEMBER_DB_PASSWORD }}
          AI_DB_USERNAME: ${{ secrets.AI_DB_USERNAME }}
          AI_DB_PASSWORD: ${{ secrets.AI_DB_PASSWORD }}
        run: |
          set -euo pipefail
          VARS='$DEPLOY_ENV $SPRING_PROFILE $API_HOST $FRONTEND_ORIGIN $VPC_CIDR $DB_WRITER_ENDPOINT $DB_READER_ENDPOINT $AWS_COGNITO_CLIENT_ID $AWS_COGNITO_CLIENT_SECRET $CATALOG_DB_USERNAME $CATALOG_DB_PASSWORD $ORDER_DB_USERNAME $ORDER_DB_PASSWORD $KAKAOPAY_SECRET_KEY $MEMBER_DB_USERNAME $MEMBER_DB_PASSWORD $AI_DB_USERNAME $AI_DB_PASSWORD'
          mkdir -p rendered
          for f in k8s/base/*.yaml; do
            envsubst "$VARS" < "$f" > "rendered/$(basename "$f")"
          done
          kubectl apply -f rendered/

      - name: 서비스별 매니페스트 렌더링 + apply
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          SPRING_PROFILE: prod
          DB_SSL_MODE: disable
          DB_NAME: bookdb_dev
          AI_DB_NAME: bookdb_dev
          AI_VECTOR_BUCKET: ${{ vars.AI_VECTOR_BUCKET }}
          REDIS_HOST: ${{ vars.REDIS_HOST }}
          AWS_COGNITO_USER_POOL_ID: ${{ vars.AWS_COGNITO_USER_POOL_ID }}
          SQS_PURCHASE_QUEUE_URL: ${{ vars.SQS_PURCHASE_QUEUE_URL }}
          SQS_INGEST_QUEUE_URL: ${{ vars.SQS_INGEST_QUEUE_URL }}
          EBOOK_S3_BUCKET: ${{ vars.EBOOK_S3_BUCKET }}
          CHAT_ALLOWED_ORIGINS: https://dev.ajttk.com
          KAKAOPAY_FRONTEND_CALLBACK_URL: https://dev.ajttk.com/payments/kakao/callback
        run: |
          set -euo pipefail
          VARS='$ECR_REGISTRY $ECR_CATALOG_REPO $ECR_ORDER_REPO $ECR_MEMBER_REPO $ECR_AI_REPO $IMAGE_TAG $SPRING_PROFILE $DB_SSL_MODE $DB_NAME $AI_DB_NAME $AI_VECTOR_BUCKET $AWS_REGION $REDIS_HOST $AWS_COGNITO_USER_POOL_ID $SQS_PURCHASE_QUEUE_URL $SQS_INGEST_QUEUE_URL $EBOOK_S3_BUCKET $AI_SERVICE_IRSA_ARN $MEMBER_SERVICE_IRSA_ARN $CHAT_ALLOWED_ORIGINS $KAKAOPAY_FRONTEND_CALLBACK_URL'
          IFS=',' read -ra SERVICES <<< "${{ inputs.services }}"
          for svc in "${SERVICES[@]}"; do
            mkdir -p "rendered/$svc"
            for f in "k8s/$svc"/*.yaml; do
              envsubst "$VARS" < "$f" > "rendered/$svc/$(basename "$f")"
            done
            kubectl apply -f "rendered/$svc/"
          done

      - name: rollout 대기
        run: |
          set -euo pipefail
          declare -A deployments=(
            [catalog]="catalog-deployment"
            [order]="order-deployment"
            [member]="member-deployment"
            [ai]="ai-rag-deployment ai-bot-deployment"
          )
          IFS=',' read -ra SERVICES <<< "${{ inputs.services }}"
          for svc in "${SERVICES[@]}"; do
            for d in ${deployments[$svc]}; do
              kubectl -n lion-app rollout status "deployment/$d" --timeout=600s
            done
          done
