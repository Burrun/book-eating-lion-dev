name: Secret Scan

# 시크릿이 저장소에 들어가는 것을 PR 단계에서 차단한다.
# gitleaks 는 정규식 + 엔트로피로 탐지하며, 히스토리 전체를 훑는다.
on:
  pull_request:
    branches: [ "main", "dev" ]
  push:
    branches: [ "main", "dev" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 과거 커밋에 묻힌 시크릿도 잡으려면 전체 히스토리가 필요하다.
          fetch-depth: 0

      # 액션 대신 바이너리를 직접 받는다.
      # gitleaks-action 은 organization 계정에서 라이선스 키를 요구하므로,
      # 개인/조직 어느 쪽으로 옮겨도 그대로 동작하도록 이 방식을 쓴다.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.28.0"
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: Scan git history
        run: gitleaks detect --source . --redact --no-banner -v --exit-code 1

      # PR 에서는 이번 변경분만 따로 한 번 더 본다.
      # 히스토리 스캔이 기존 오탐 때문에 막혀 있어도, 새로 들어온 시크릿은 반드시 걸린다.
      - name: Scan PR diff
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          gitleaks detect --source . --redact --no-banner --exit-code 1 \
            --log-opts="origin/${{ github.base_ref }}..HEAD"
