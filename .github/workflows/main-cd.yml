name: Main CD (EKS Production)

# Backend CI / Frontend CI 가 main 브랜치에서 성공적으로 완료된 뒤에만 배포한다.
on:
  workflow_run:
    workflows: [ "Backend CI", "Frontend CI" ]
    types: [ completed ]
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  id-token: write   # AWS OIDC AssumeRole 용
  contents: read

concurrency:
  group: main-cd
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 변경된 서비스 판별 — Phase 3-4
  #
  # 이게 MSA 의 실질적 이득 중 하나다.
  # "리뷰 문구 하나 고쳤는데 결제 서비스가 재배포된다"면 MSA 를 한 의미가 없다.
  # ---------------------------------------------------------------------------
  changes:
    name: 변경 서비스 판별
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.name == 'Backend CI' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      catalog: ${{ steps.filter.outputs.catalog }}
      order: ${{ steps.filter.outputs.order }}
      member: ${{ steps.filter.outputs.member }}
      ai: ${{ steps.filter.outputs.ai }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # workflow_dispatch 로 수동 실행하면 전부 배포한다.
          predicate-quantifier: 'some'
          filters: |
            shared: &shared
              - 'backend/build.gradle'
              - 'backend/settings.gradle'
              - 'backend/modules/common/**'
              - 'backend/contracts/**'
              - '.github/workflows/main-cd.yml'
            catalog:
              - *shared
              - 'backend/apps/catalog-api/**'
              - 'backend/modules/book/**'
              - 'k8s/catalog/**'
              - 'k8s/base/**'
            order:
              - *shared
              - 'backend/apps/order-api/**'
              - 'backend/modules/order/**'
              - 'k8s/order/**'
              - 'k8s/base/**'
            member:
              - *shared
              - 'backend/apps/member-api/**'
              - 'backend/modules/member/**'
              - 'k8s/member/**'
              - 'k8s/base/**'
            ai:
              - *shared
              - 'backend/apps/ai-api/**'
              - 'backend/modules/ai/**'
              - 'k8s/ai/**'
              - 'k8s/base/**'

  # ---------------------------------------------------------------------------
  # 공통 리소스는 서비스 배포보다 먼저 한 번만 적용한다.
  # 각 서비스 job 이 base 를 각자 apply 하면 4번 중복되고 경합이 난다.
  # ---------------------------------------------------------------------------
  base:
    name: 공통 매니페스트
    needs: changes
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: gha-prod-base-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update EKS kubeconfig
        run: aws eks update-kubeconfig --name "${{ vars.EKS_CLUSTER }}" --region "$AWS_REGION"

      - name: Render & apply base manifests
        env:
          SPRING_PROFILE: ${{ vars.SPRING_PROFILE || 'prod' }}
          AURORA_ENDPOINT: ${{ vars.AURORA_ENDPOINT }}
          AURORA_READER_ENDPOINT: ${{ vars.AURORA_READER_ENDPOINT }}
          API_HOST: ${{ vars.API_HOST }}
          FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN }}
          VPC_CIDR: ${{ vars.VPC_CIDR }}
          AWS_COGNITO_CLIENT_ID: ${{ secrets.AWS_COGNITO_CLIENT_ID }}
          AWS_COGNITO_CLIENT_SECRET: ${{ secrets.AWS_COGNITO_CLIENT_SECRET }}
          CATALOG_DB_USERNAME: ${{ secrets.CATALOG_DB_USERNAME }}
          CATALOG_DB_PASSWORD: ${{ secrets.CATALOG_DB_PASSWORD }}
          ORDER_DB_USERNAME: ${{ secrets.ORDER_DB_USERNAME }}
          ORDER_DB_PASSWORD: ${{ secrets.ORDER_DB_PASSWORD }}
          MEMBER_DB_USERNAME: ${{ secrets.MEMBER_DB_USERNAME }}
          MEMBER_DB_PASSWORD: ${{ secrets.MEMBER_DB_PASSWORD }}
          AI_DB_USERNAME: ${{ secrets.AI_DB_USERNAME }}
          AI_DB_PASSWORD: ${{ secrets.AI_DB_PASSWORD }}
        run: |
          set -euo pipefail
          for v in AURORA_ENDPOINT AURORA_READER_ENDPOINT API_HOST FRONTEND_ORIGIN VPC_CIDR \
                   CATALOG_DB_USERNAME CATALOG_DB_PASSWORD ORDER_DB_USERNAME ORDER_DB_PASSWORD \
                   MEMBER_DB_USERNAME MEMBER_DB_PASSWORD AI_DB_USERNAME AI_DB_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::필수 값 $v 가 비어 있습니다. environment 의 Variables/Secrets 를 확인하세요."
              exit 1
            fi
          done

          VARS='$SPRING_PROFILE $AURORA_ENDPOINT $AURORA_READER_ENDPOINT $API_HOST $FRONTEND_ORIGIN $VPC_CIDR $AWS_COGNITO_CLIENT_ID $AWS_COGNITO_CLIENT_SECRET $CATALOG_DB_USERNAME $CATALOG_DB_PASSWORD $ORDER_DB_USERNAME $ORDER_DB_PASSWORD $MEMBER_DB_USERNAME $MEMBER_DB_PASSWORD $AI_DB_USERNAME $AI_DB_PASSWORD'
          mkdir -p rendered
          for f in k8s/base/*.yaml; do
            envsubst "$VARS" < "$f" > "rendered/$(basename "$f")"
          done
          kubectl apply -f rendered/

  # ---------------------------------------------------------------------------
  # 서비스별 배포. 변경된 것만 돈다.
  # ---------------------------------------------------------------------------
  deploy:
    name: ${{ matrix.service }} → ECR & EKS
    needs: [changes, base]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: catalog
            changed: ${{ needs.changes.outputs.catalog }}
            deployments: catalog-deployment
          - service: order
            changed: ${{ needs.changes.outputs.order }}
            deployments: order-deployment
          - service: member
            changed: ${{ needs.changes.outputs.member }}
            deployments: member-deployment
          # ai 는 이미지 1개에 Deployment 2개다(판단 ④).
          - service: ai
            changed: ${{ needs.changes.outputs.ai }}
            deployments: ai-rag-deployment ai-bot-deployment
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
      K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE || 'lion-app' }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: 변경 없음 — 건너뜀
        if: matrix.changed != 'true' && github.event_name != 'workflow_dispatch'
        run: echo "${{ matrix.service }} 관련 변경이 없어 배포를 건너뜁니다."

      - uses: actions/checkout@v4
        if: matrix.changed == 'true' || github.event_name == 'workflow_dispatch'
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Configure AWS credentials (OIDC)
        if: matrix.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: gha-prod-${{ matrix.service }}-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: matrix.changed == 'true' || github.event_name == 'workflow_dispatch'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push image
        if: matrix.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          # ECR 리포지터리 4개 (Phase 3-1)
          REPO_VAR="ECR_$(echo ${{ matrix.service }} | tr a-z A-Z)_REPO"
          REPOSITORY="${{ vars.ECR_CATALOG_REPO }}"
          case "${{ matrix.service }}" in
            catalog) REPOSITORY="${{ vars.ECR_CATALOG_REPO }}" ;;
            order)   REPOSITORY="${{ vars.ECR_ORDER_REPO }}" ;;
            member)  REPOSITORY="${{ vars.ECR_MEMBER_REPO }}" ;;
            ai)      REPOSITORY="${{ vars.ECR_AI_REPO }}" ;;
          esac
          if [ -z "$REPOSITORY" ]; then
            echo "::error::$REPO_VAR 가 비어 있습니다."
            exit 1
          fi

          IMAGE="$REGISTRY/$REPOSITORY"
          docker build \
            -t "$IMAGE:${{ env.DEPLOY_SHA }}" \
            -t "$IMAGE:main-${{ github.run_number }}" \
            -f backend/apps/${{ matrix.service }}-api/Dockerfile backend
          docker push "$IMAGE:${{ env.DEPLOY_SHA }}"
          docker push "$IMAGE:main-${{ github.run_number }}"

      - name: Update EKS kubeconfig
        if: matrix.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: aws eks update-kubeconfig --name "${{ vars.EKS_CLUSTER }}" --region "$AWS_REGION"

      - name: Render & apply service manifests
        if: matrix.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_CATALOG_REPO: ${{ vars.ECR_CATALOG_REPO }}
          ECR_ORDER_REPO: ${{ vars.ECR_ORDER_REPO }}
          ECR_MEMBER_REPO: ${{ vars.ECR_MEMBER_REPO }}
          ECR_AI_REPO: ${{ vars.ECR_AI_REPO }}
          IMAGE_TAG: ${{ env.DEPLOY_SHA }}
          SPRING_PROFILE: ${{ vars.SPRING_PROFILE || 'prod' }}
          DB_NAME: ${{ vars.DB_NAME }}
          AI_DB_NAME: ${{ vars.AI_DB_NAME }}
          AI_VECTOR_BUCKET: ${{ vars.AI_VECTOR_BUCKET }}
          REDIS_HOST: ${{ vars.REDIS_HOST }}
          AWS_COGNITO_USER_POOL_ID: ${{ vars.AWS_COGNITO_USER_POOL_ID }}
          SQS_PURCHASE_QUEUE_URL: ${{ vars.SQS_PURCHASE_QUEUE_URL }}
        run: |
          set -euo pipefail
          # 비어 있으면 파드가 뜬 뒤 GetIndex 검증에서 죽는다. 여기서 먼저 끊는 게 싸다.
          if [ "${{ matrix.service }}" = "ai" ] && [ -z "$AI_VECTOR_BUCKET" ]; then
            echo "::error::필수 값 AI_VECTOR_BUCKET 가 비어 있습니다. environment 의 Variables 를 확인하세요."
            exit 1
          fi

          VARS='$ECR_REGISTRY $ECR_CATALOG_REPO $ECR_ORDER_REPO $ECR_MEMBER_REPO $ECR_AI_REPO $IMAGE_TAG $SPRING_PROFILE $DB_NAME $AI_DB_NAME $AI_VECTOR_BUCKET $AWS_REGION $REDIS_HOST $AWS_COGNITO_USER_POOL_ID $SQS_PURCHASE_QUEUE_URL'
          mkdir -p rendered
          for f in k8s/${{ matrix.service }}/*.yaml; do
            envsubst "$VARS" < "$f" > "rendered/$(basename "$f")"
          done
          kubectl apply -f rendered/

      - name: Wait for rollout
        if: matrix.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          for d in ${{ matrix.deployments }}; do
            kubectl -n "$K8S_NAMESPACE" rollout status "deployment/$d" --timeout=600s
          done

      - name: Rollback on failure
        if: failure() && (matrix.changed == 'true' || github.event_name == 'workflow_dispatch')
        run: |
          for d in ${{ matrix.deployments }}; do
            kubectl -n "$K8S_NAMESPACE" rollout undo "deployment/$d" || true
            kubectl -n "$K8S_NAMESPACE" rollout status "deployment/$d" --timeout=300s || true
          done

  deploy-frontend:
    name: Frontend → S3 & CloudFront
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.name == 'Frontend CI' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install & build
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: gha-prod-frontend-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to Amazon S3
        run: aws s3 sync ./frontend/dist "s3://${{ vars.FRONTEND_S3_BUCKET }}" --delete

      - name: Invalidate CloudFront cache
        if: vars.CLOUDFRONT_DIST_ID != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DIST_ID }}" \
            --paths "/*"
