name: Main CD (EKS Production)

# Backend CI / Frontend CI 가 main 브랜치에서 성공적으로 완료된 뒤에만 배포한다.
#
# dev/prod는 GitHub Environments로 분리돼 있다(각 job의 `environment:` 참고) -
# Variables/Secrets가 환경별로 완전히 분리되므로 sync-github-config.sh를 dev로
# 돌린 뒤 prod로 돌려도 서로 안 덮어쓴다(docs/개발 문서/인프라-트러블슈팅.md ⑮).
# workflow_run 트리거(수동 dispatch 없이 자동으로 도는 경로)에는 environment
# 입력이 없으므로 기본값 dev로 떨어진다 - 지금 main 브랜치는 사실상 안 쓰이고
# 실배포는 전부 workflow_dispatch(dev 브랜치 대상)로 이뤄지므로 이 기본값이
# 실제 운영과 맞는다.
on:
  workflow_run:
    workflows: [ "Backend CI", "Frontend CI" ]
    types: [ completed ]
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      environment:
        description: "배포 대상 환경"
        type: choice
        options: [ dev, prod ]
        default: dev
        required: true
      deployment_mode:
        description: "인프라 운영 모드 (split=환경별 클러스터, integrated=공용 클러스터+namespace)"
        type: choice
        options: [ split, integrated ]
        default: split
        required: true
      services:
        description: "배포할 서비스 (콤마 구분: catalog,order,member,ai,frontend). 기본 all=전체"
        type: string
        default: "all"
        required: false

permissions:
  id-token: write   # AWS OIDC AssumeRole 용
  contents: read

# "배포 대상 환경"을 가리키는 조건식 - `github.event_name == 'workflow_dispatch' &&
# github.event.inputs.environment || 'dev'`. workflow_dispatch가 아니면(=
# workflow_run) inputs 자체가 없으므로 github.event_name으로 명시적으로
# 분기한다 - `|| 'dev'`만 쓰면 나중에 폴백 로직이 바뀔 때 이 갈래를 놓치기 쉽다.
#
# 워크플로 레벨 `env:`로 한 곳에 모아 재사용하고 싶었지만, `concurrency.group`과
# `jobs.<job_id>.environment` 둘 다 `env` 컨텍스트를 지원하지 않는다(공식 문서
# context-availability 표 확인, `gh workflow run`으로 실제 422 파싱 에러까지
# 재현해 검증함 - 2026-08-21). 그래서 아래 concurrency.group과 각 job의
# environment: 3곳에 이 조건식을 그대로 반복한다 - DRY보다 "실제로 파싱되는
# 워크플로"가 우선이다.
concurrency:
  group: main-cd-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deployment_mode || 'split' }}-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'dev' }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 변경된 서비스 판별 — Phase 3-4
  #
  # 이게 MSA 의 실질적 이득 중 하나다.
  # "리뷰 문구 하나 고쳤는데 결제 서비스가 재배포된다"면 MSA 를 한 의미가 없다.
  # ---------------------------------------------------------------------------
  changes:
    name: 변경 서비스 판별
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.name == 'Backend CI' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      # workflow_dispatch는 커밋 범위가 불명확해(마지막 배포 이후 여러 PR이
      # 쌓였을 수 있음) paths-filter의 diff 결과를 못 믿는다 - 수동 실행 시엔
      # 대신 services 입력값(콤마구분/all)을 직접 본다. 자동 트리거(Backend CI
      # 완료)는 push 1건에 대응하는 diff라 paths-filter 결과를 그대로 쓴다.
      catalog: ${{ (github.event_name == 'workflow_dispatch' && (github.event.inputs.services == 'all' || contains(format(',{0},', github.event.inputs.services), ',catalog,'))) || (github.event_name != 'workflow_dispatch' && steps.filter.outputs.catalog == 'true') }}
      order: ${{ (github.event_name == 'workflow_dispatch' && (github.event.inputs.services == 'all' || contains(format(',{0},', github.event.inputs.services), ',order,'))) || (github.event_name != 'workflow_dispatch' && steps.filter.outputs.order == 'true') }}
      member: ${{ (github.event_name == 'workflow_dispatch' && (github.event.inputs.services == 'all' || contains(format(',{0},', github.event.inputs.services), ',member,'))) || (github.event_name != 'workflow_dispatch' && steps.filter.outputs.member == 'true') }}
      ai: ${{ (github.event_name == 'workflow_dispatch' && (github.event.inputs.services == 'all' || contains(format(',{0},', github.event.inputs.services), ',ai,'))) || (github.event_name != 'workflow_dispatch' && steps.filter.outputs.ai == 'true') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          predicate-quantifier: 'some'
          filters: |
            shared: &shared
              - 'backend/build.gradle'
              - 'backend/settings.gradle'
              - 'backend/modules/common/**'
              - 'backend/contracts/**'
              - '.github/workflows/main-cd.yml'
            catalog:
              - *shared
              - 'backend/apps/catalog-api/**'
              - 'backend/modules/book/**'
              - 'k8s/catalog/**'
              - 'k8s/base/**'
            order:
              - *shared
              - 'backend/apps/order-api/**'
              - 'backend/modules/order/**'
              - 'k8s/order/**'
              - 'k8s/base/**'
            member:
              - *shared
              - 'backend/apps/member-api/**'
              - 'backend/modules/member/**'
              - 'k8s/member/**'
              - 'k8s/base/**'
            ai:
              - *shared
              - 'backend/apps/ai-api/**'
              - 'backend/modules/ai/**'
              - 'k8s/ai/**'
              - 'k8s/base/**'

  # ---------------------------------------------------------------------------
  # 공통 리소스는 서비스 배포보다 먼저 한 번만 적용한다.
  # 각 서비스 job 이 base 를 각자 apply 하면 4번 중복되고 경합이 난다.
  # ---------------------------------------------------------------------------
  base:
    name: 공통 매니페스트
    needs: changes
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deployment_mode == 'integrated' && format('integrated-{0}', github.event.inputs.environment) || github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'dev' }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: gha-prod-base-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Load deployment configuration from SSM
        env:
          DEPLOY_ENV: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'dev' }}
          DEPLOYMENT_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deployment_mode || 'split' }}
        run: ./scripts/load-deployment-config.sh "$DEPLOY_ENV" "$DEPLOYMENT_MODE" "$GITHUB_ENV"

      - name: Validate deployment environment isolation
        env:
          DEPLOY_ENV: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'dev' }}
          DEPLOYMENT_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deployment_mode || 'split' }}
          ACTUAL_NAMESPACE: ${{ vars.K8S_NAMESPACE }}
        run: |
          set -euo pipefail
          ACTUAL_CLUSTER="$EKS_CLUSTER"
          ACTUAL_DB_NAME="$DB_NAME"
          ACTUAL_AI_DB_NAME="$AI_DB_NAME"
          if [[ "$DEPLOYMENT_MODE" == "integrated" ]]; then
            EXPECTED_CLUSTER="lion-team3-integrated"
            EXPECTED_NAMESPACE="$DEPLOY_ENV"
          elif [[ "$DEPLOYMENT_MODE" == "split" ]]; then
            EXPECTED_CLUSTER="lion-team3-${DEPLOY_ENV}"
            EXPECTED_NAMESPACE="lion-app"
          else
            echo "Unsupported deployment mode: $DEPLOYMENT_MODE" >&2
            exit 1
          fi

          if [[ "$DEPLOY_ENV" == "dev" ]]; then
            EXPECTED_DB_NAME="bookdb_dev"
          elif [[ "$DEPLOY_ENV" == "prod" ]]; then
            EXPECTED_DB_NAME="bookdb_prod"
          else
            echo "Unsupported deployment environment: $DEPLOY_ENV" >&2
            exit 1
          fi

          validate() {
            local name="$1" actual="$2" expected="$3"
            if [[ "$actual" != "$expected" ]]; then
              echo "Invalid $name for $DEPLOY_ENV: expected '$expected', got '$actual'" >&2
              exit 1
            fi
          }

          validate EKS_CLUSTER "$ACTUAL_CLUSTER" "$EXPECTED_CLUSTER"
          validate K8S_NAMESPACE "$ACTUAL_NAMESPACE" "$EXPECTED_NAMESPACE"
          validate DB_NAME "$ACTUAL_DB_NAME" "$EXPECTED_DB_NAME"
          validate AI_DB_NAME "$ACTUAL_AI_DB_NAME" "$EXPECTED_DB_NAME"

      - name: Update EKS kubeconfig
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"

      - name: Render & apply base manifests
        env:
          K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}
          AWS_COGNITO_CLIENT_ID: ${{ secrets.AWS_COGNITO_CLIENT_ID }}
          AWS_COGNITO_CLIENT_SECRET: ${{ secrets.AWS_COGNITO_CLIENT_SECRET }}
          CATALOG_DB_USERNAME: ${{ secrets.CATALOG_DB_USERNAME }}
          CATALOG_DB_PASSWORD: ${{ secrets.CATALOG_DB_PASSWORD }}
          ORDER_DB_USERNAME: ${{ secrets.ORDER_DB_USERNAME }}
          ORDER_DB_PASSWORD: ${{ secrets.ORDER_DB_PASSWORD }}
          KAKAOPAY_SECRET_KEY: ${{ secrets.KAKAOPAY_SECRET_KEY }}
          MEMBER_DB_USERNAME: ${{ secrets.MEMBER_DB_USERNAME }}
          MEMBER_DB_PASSWORD: ${{ secrets.MEMBER_DB_PASSWORD }}
          AI_DB_USERNAME: ${{ secrets.AI_DB_USERNAME }}
          AI_DB_PASSWORD: ${{ secrets.AI_DB_PASSWORD }}
        run: |
          set -euo pipefail
          for v in DEPLOY_ENV K8S_NAMESPACE API_HOST FRONTEND_ORIGIN VPC_CIDR \
                   DB_WRITER_ENDPOINT DB_READER_ENDPOINT \
                   CATALOG_DB_USERNAME CATALOG_DB_PASSWORD ORDER_DB_USERNAME ORDER_DB_PASSWORD \
                   KAKAOPAY_SECRET_KEY \
                   MEMBER_DB_USERNAME MEMBER_DB_PASSWORD AI_DB_USERNAME AI_DB_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::필수 값 $v 가 비어 있습니다. environment 의 Variables/Secrets 를 확인하세요."
              exit 1
            fi
          done

          VARS='$DEPLOY_ENV $SPRING_PROFILE $K8S_NAMESPACE $API_HOST $FRONTEND_ORIGIN $VPC_CIDR $DB_WRITER_ENDPOINT $DB_READER_ENDPOINT $AWS_COGNITO_CLIENT_ID $AWS_COGNITO_CLIENT_SECRET $CATALOG_DB_USERNAME $CATALOG_DB_PASSWORD $ORDER_DB_USERNAME $ORDER_DB_PASSWORD $KAKAOPAY_SECRET_KEY $MEMBER_DB_USERNAME $MEMBER_DB_PASSWORD $AI_DB_USERNAME $AI_DB_PASSWORD'
          mkdir -p rendered
          for f in k8s/base/*.yaml; do
            envsubst "$VARS" < "$f" > "rendered/$(basename "$f")"
          done
          kubectl apply -f rendered/

  # ---------------------------------------------------------------------------
  # 서비스별 배포. 변경된 것만 돈다.
  # ---------------------------------------------------------------------------
  deploy:
    name: ${{ matrix.service }} → ECR & EKS
    needs: [changes, base]
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deployment_mode == 'integrated' && format('integrated-{0}', github.event.inputs.environment) || github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'dev' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: catalog
            changed: ${{ needs.changes.outputs.catalog }}
            deployments: catalog-deployment
          - service: order
            changed: ${{ needs.changes.outputs.order }}
            deployments: order-deployment
          - service: member
            changed: ${{ needs.changes.outputs.member }}
            deployments: member-deployment
          # ai 는 이미지 1개에 Deployment 2개다(판단 ④).
          - service: ai
            changed: ${{ needs.changes.outputs.ai }}
            deployments: ai-rag-deployment ai-bot-deployment
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
      K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: 변경 없음 — 건너뜀
        if: matrix.changed != 'true'
        run: echo "${{ matrix.service }} 관련 변경이 없어 배포를 건너뜁니다."

      - uses: actions/checkout@v4
        if: matrix.changed == 'true'
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Configure AWS credentials (OIDC)
        if: matrix.changed == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: gha-prod-${{ matrix.service }}-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Load deployment configuration from SSM
        if: matrix.changed == 'true'
        env:
          DEPLOY_ENV: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'dev' }}
          DEPLOYMENT_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deployment_mode || 'split' }}
        run: ./scripts/load-deployment-config.sh "$DEPLOY_ENV" "$DEPLOYMENT_MODE" "$GITHUB_ENV"

      - name: Login to Amazon ECR
        if: matrix.changed == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # GHA 캐시 백엔드(type=gha)로 레이어 캐싱하려면 docker-container 드라이버가
      # 필요하다 - 기본 docker 드라이버는 --cache-to/--cache-from type=gha를 못 씀.
      - name: Set up Docker Buildx
        if: matrix.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build & push image
        if: matrix.changed == 'true'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          # ECR 리포지터리 4개 (Phase 3-1)
          REPO_VAR="ECR_$(echo ${{ matrix.service }} | tr a-z A-Z)_REPO"
          REPOSITORY="$ECR_CATALOG_REPO"
          case "${{ matrix.service }}" in
            catalog) REPOSITORY="$ECR_CATALOG_REPO" ;;
            order)   REPOSITORY="$ECR_ORDER_REPO" ;;
            member)  REPOSITORY="$ECR_MEMBER_REPO" ;;
            ai)      REPOSITORY="$ECR_AI_REPO" ;;
          esac
          if [ -z "$REPOSITORY" ]; then
            echo "::error::$REPO_VAR 가 비어 있습니다."
            exit 1
          fi

          IMAGE="$REGISTRY/$REPOSITORY"
          # GH-hosted 러너는 매번 새 상태라 로컬 도커 캐시가 없다 - GHA 캐시에
          # 레이어를 저장/재사용해서 매번 처음부터 빌드하는 걸 피한다. 서비스별로
          # scope를 나눠서 4개 서비스 캐시가 서로 안 섞이게 한다. --load로 로컬
          # 도커 데몬에 올려야 아래 기존 docker push 로직(태그 불변 회피)을 그대로 쓴다.
          docker buildx build \
            --cache-from "type=gha,scope=${{ matrix.service }}" \
            --cache-to "type=gha,mode=max,scope=${{ matrix.service }}" \
            --load \
            -t "$IMAGE:${{ env.DEPLOY_SHA }}" \
            -t "$IMAGE:main-${{ github.run_number }}" \
            -f backend/apps/${{ matrix.service }}-api/Dockerfile backend

          # ECR 리포지토리는 태그 불변(immutable)이라, 같은 커밋 SHA로 워크플로우가
          # 재실행되면(실패한 job 재시도 등) 이미 push된 SHA 태그를 다시 push하려다
          # "tag invalid ... immutable" 로 실패한다. SHA 태그가 이미 있으면 push를
          # 건너뛴다 - run_number 태그는 실행마다 항상 새 값이라 충돌 없이 매번 push.
          if aws ecr describe-images \
               --repository-name "$REPOSITORY" \
               --image-ids imageTag="${{ env.DEPLOY_SHA }}" \
               --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "ECR에 ${{ env.DEPLOY_SHA }} 태그가 이미 있어 push를 건너뜁니다 (재실행 등으로 중복)."
          else
            docker push "$IMAGE:${{ env.DEPLOY_SHA }}"
          fi
          docker push "$IMAGE:main-${{ github.run_number }}"

      - name: Update EKS kubeconfig
        if: matrix.changed == 'true'
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"

      - name: Render & apply service manifests
        if: matrix.changed == 'true'
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ env.DEPLOY_SHA }}
          # /ws/ai/chat 의 유일한 Origin 방어선(k8s/ai/configmap.yaml 참고). 이 VARS 목록에
          # 빠져 있으면 envsubst 가 손대지 않아 ConfigMap 에 "${CHAT_ALLOWED_ORIGINS}" 리터럴이
          # 그대로 박히고, 그 값이 그대로 allowed-origin-pattern 이 돼서 실제 브라우저 Origin과
          # 절대 매치되지 않아 핸드셰이크가 전부 거절된다 — FRONTEND_ORIGIN 과 같은 값이어야
          # 하므로 별도 GH Variable 없이 재사용한다.
          # 카카오페이 결제 완료 후 되돌아올 프론트엔드 콜백 페이지. 이 VARS 목록에
          # 빠져 있으면(과거 실제로 그랬음) order-api 코드 기본값(localhost:5173)이
          # 그대로 쓰여 실결제 후 사용자가 localhost로 리다이렉트된다 — FRONTEND_ORIGIN에
          # 경로만 붙인 값이라 별도 GH Variable 없이 재사용한다(인프라-트러블슈팅.md ⑲).
        run: |
          set -euo pipefail
          export CHAT_ALLOWED_ORIGINS="$FRONTEND_ORIGIN"
          export KAKAOPAY_FRONTEND_CALLBACK_URL="$FRONTEND_ORIGIN/payments/kakao/callback"
          # 비어 있으면 모든 매니페스트에 리터럴 "${K8S_NAMESPACE}"가 그대로 박혀
          # kubectl apply가 그 이름 그대로의(존재하지 않는) 네임스페이스를 만들려다
          # base 매니페스트가 만든 실제 네임스페이스와 어긋난다.
          if [ -z "$K8S_NAMESPACE" ]; then
            echo "::error::필수 값 K8S_NAMESPACE 가 비어 있습니다. environment 의 Variables 를 확인하세요."
            exit 1
          fi
          # 비어 있으면 파드가 뜬 뒤 GetIndex 검증에서 죽는다. 여기서 먼저 끊는 게 싸다.
          if [ "${{ matrix.service }}" = "ai" ] && [ -z "$AI_VECTOR_BUCKET" ]; then
            echo "::error::필수 값 AI_VECTOR_BUCKET 가 비어 있습니다. environment 의 Variables 를 확인하세요."
            exit 1
          fi
          # 비어 있으면 catalog configmap 에 "${EBOOK_S3_BUCKET}" 리터럴이 그대로 박힌다.
          if [ "${{ matrix.service }}" = "catalog" ] && [ -z "$EBOOK_S3_BUCKET" ]; then
            echo "::error::필수 값 EBOOK_S3_BUCKET 가 비어 있습니다. environment 의 Variables 를 확인하세요."
            exit 1
          fi
          # 비어 있으면 serviceaccount.yaml에 리터럴 "${AI_SERVICE_IRSA_ARN}"이 그대로
          # 박혀 ai-rag/ai-bot이 default SA로 뜨고 AWS SDK 자격증명 체인이 빈다.
          if [ "${{ matrix.service }}" = "ai" ] && [ -z "$AI_SERVICE_IRSA_ARN" ]; then
            echo "::error::필수 값 AI_SERVICE_IRSA_ARN 가 비어 있습니다. environment 의 Variables 를 확인하세요."
            exit 1
          fi
          # 비어 있으면 serviceaccount.yaml에 리터럴 "${MEMBER_SERVICE_IRSA_ARN}"이 그대로
          # 박혀 member-service가 default SA로 뜨고 Cognito 호출용 AWS SDK 자격증명 체인이 빈다.
          if [ "${{ matrix.service }}" = "member" ] && [ -z "$MEMBER_SERVICE_IRSA_ARN" ]; then
            echo "::error::필수 값 MEMBER_SERVICE_IRSA_ARN 가 비어 있습니다. environment 의 Variables 를 확인하세요."
            exit 1
          fi

          VARS='$ECR_REGISTRY $ECR_CATALOG_REPO $ECR_ORDER_REPO $ECR_MEMBER_REPO $ECR_AI_REPO $IMAGE_TAG $SPRING_PROFILE $K8S_NAMESPACE $DB_SSL_MODE $DB_NAME $AI_DB_NAME $AI_VECTOR_BUCKET $AWS_REGION $REDIS_HOST $AWS_COGNITO_USER_POOL_ID $SQS_PURCHASE_QUEUE_URL $SQS_INGEST_QUEUE_URL $EBOOK_S3_BUCKET $AI_SERVICE_IRSA_ARN $MEMBER_SERVICE_IRSA_ARN $CHAT_ALLOWED_ORIGINS $KAKAOPAY_FRONTEND_CALLBACK_URL'
          mkdir -p rendered
          for f in k8s/${{ matrix.service }}/*.yaml; do
            envsubst "$VARS" < "$f" > "rendered/$(basename "$f")"
          done
          kubectl apply -f rendered/

      - name: Wait for rollout
        if: matrix.changed == 'true'
        run: |
          for d in ${{ matrix.deployments }}; do
            kubectl -n "$K8S_NAMESPACE" rollout status "deployment/$d" --timeout=600s
          done

      - name: Rollback on failure
        if: failure() && matrix.changed == 'true'
        run: |
          for d in ${{ matrix.deployments }}; do
            kubectl -n "$K8S_NAMESPACE" rollout undo "deployment/$d" || true
            kubectl -n "$K8S_NAMESPACE" rollout status "deployment/$d" --timeout=300s || true
          done

  deploy-frontend:
    name: Frontend → S3 & CloudFront
    if: >
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.services == 'all' || contains(github.event.inputs.services, 'frontend'))) ||
      (github.event.workflow_run.name == 'Frontend CI' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deployment_mode == 'integrated' && format('integrated-{0}', github.event.inputs.environment) || github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'dev' }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install & build
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: gha-prod-frontend-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Load frontend deployment targets from SSM
        env:
          DEPLOY_ENV: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'dev' }}
          DEPLOYMENT_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deployment_mode || 'split' }}
        run: ./scripts/load-deployment-config.sh "$DEPLOY_ENV" "$DEPLOYMENT_MODE" "$GITHUB_ENV"

      - name: Sync to Amazon S3
        run: |
          test -n "$FRONTEND_S3_BUCKET"
          aws s3 sync ./frontend/dist "s3://${FRONTEND_S3_BUCKET}" --delete

      - name: Invalidate CloudFront cache
        run: |
          test -n "$CLOUDFRONT_DIST_ID"
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DIST_ID" \
            --paths "/*"
