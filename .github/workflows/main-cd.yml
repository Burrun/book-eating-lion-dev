name: Main CD (EKS Production)

# main 브랜치에 PR이 머지(Push)되면 즉시 자동으로 배포(CD)가 실행된다.
on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'k8s/**'
      - '.github/workflows/main-cd.yml'
  workflow_dispatch:

permissions:
  id-token: write   # AWS OIDC AssumeRole 용
  contents: read

concurrency:
  group: main-cd
  cancel-in-progress: false

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'k8s/**'
            frontend:
              - 'frontend/**'

  deploy-backend:
    name: Backend → ECR & EKS
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
      K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE || 'lion-app' }}
      K8S_DEPLOYMENT: ${{ vars.K8S_DEPLOYMENT || 'backend-deployment' }}
      K8S_CONTAINER: ${{ vars.K8S_CONTAINER || 'backend' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: gha-prod-backend-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push backend image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_BACKEND_REPO }}
        run: |
          IMAGE="$REGISTRY/$REPOSITORY"
          docker build \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:main-${{ github.run_number }}" \
            -f backend/apps/api/Dockerfile backend
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:main-${{ github.run_number }}"
          echo "IMAGE_URI=$IMAGE:${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Update EKS kubeconfig
        run: aws eks update-kubeconfig --name "${{ vars.EKS_CLUSTER }}" --region "$AWS_REGION"

      # k8s/*.yaml 의 ${...} 플레이스홀더를 채워 rendered/ 로 내보낸다.
      # 저장소에는 비밀값이 없고, 렌더링 결과는 러너에서만 존재한다.
      - name: Render K8s manifests
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_BACKEND_REPO: ${{ vars.ECR_BACKEND_REPO }}
          IMAGE_TAG: ${{ github.sha }}
          SPRING_PROFILE: ${{ vars.SPRING_PROFILE || 'prod' }}
          DB_NAME: ${{ vars.DB_NAME }}
          RDS_ENDPOINT: ${{ vars.RDS_ENDPOINT }}
          S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
          API_HOST: ${{ vars.API_HOST }}
          # 08-ingress.yaml 의 CORS allow-origin (예: https://app.example.com)
          FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN }}
          # 09-networkpolicy.yaml 에서 kubelet probe 를 허용할 노드 대역 (예: 10.0.0.0/16)
          VPC_CIDR: ${{ vars.VPC_CIDR }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          for v in ECR_BACKEND_REPO DB_NAME RDS_ENDPOINT API_HOST FRONTEND_ORIGIN VPC_CIDR DB_USERNAME DB_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::필수 값 $v 가 비어 있습니다. environment 의 Variables/Secrets 를 확인하세요."
              exit 1
            fi
          done
          VARS='$ECR_REGISTRY $ECR_BACKEND_REPO $IMAGE_TAG $SPRING_PROFILE $DB_NAME $DB_PORT $AWS_REGION $S3_BUCKET_NAME $RDS_ENDPOINT $API_HOST $FRONTEND_ORIGIN $VPC_CIDR $DB_USERNAME $DB_PASSWORD'
          mkdir -p rendered
          for f in k8s/*.yaml; do
            envsubst "$VARS" < "$f" > "rendered/$(basename "$f")"
          done
          echo "렌더링 완료:"; ls rendered/

      - name: Apply K8s manifests
        run: kubectl apply -f rendered/

      - name: Wait for rollout
        run: |
          kubectl -n "$K8S_NAMESPACE" rollout status \
            "deployment/$K8S_DEPLOYMENT" --timeout=600s

      # 롤아웃 실패 시 직전 리비전으로 자동 복구한다.
      - name: Rollback on failure
        if: failure()
        run: |
          kubectl -n "$K8S_NAMESPACE" rollout undo "deployment/$K8S_DEPLOYMENT" || true
          kubectl -n "$K8S_NAMESPACE" rollout status "deployment/$K8S_DEPLOYMENT" --timeout=300s || true

  deploy-frontend:
    name: Frontend → S3 & CloudFront
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install & build
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: gha-prod-frontend-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to Amazon S3
        run: aws s3 sync ./frontend/dist "s3://${{ vars.FRONTEND_S3_BUCKET }}" --delete

      - name: Invalidate CloudFront cache
        if: vars.CLOUDFRONT_DIST_ID != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DIST_ID }}" \
            --paths "/*"
