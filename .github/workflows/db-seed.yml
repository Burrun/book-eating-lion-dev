name: DB Seed

# db/postgres/90-demo-data.sql 을 배포된 DB 에 적용한다.
#
# 그 파일은 원래 로컬 docker-compose initdb 전용이라 배포된 DB 에 반영할 경로가
# 없었다. 4개 앱 모두 ddl-auto: update 라 테이블은 Hibernate 가 만들지만
# 시드 데이터는 아무도 안 넣어준다.
#
# ── 언제 도는가 ─────────────────────────────────────────────────────────
#   dev 브랜치에 시드/마이그레이션 파일 변경이 머지되면 자동으로 돈다.
#   그 파일들이 안 바뀐 푸시는 paths 필터에 걸려 워크플로가 아예 시작하지 않는다.
#   손으로 돌리고 싶으면 workflow_dispatch (dry_run 기본 true).
#
# ── 이 워크플로가 하는 일 ────────────────────────────────────────────────
#   1. preflight : INSERT 문의 컬럼 목록을 실 DB 스키마와 대조한다. DB 는
#                  건드리지 않는다. 여기서 걸리면 아무것도 쓰지 않고 멈춘다.
#   2. migrate   : db/migrations/V*.sql 을 한 번씩만 적용한다. 구조 변경
#                  (컬럼명 변경 등) 전용이라 평소엔 비어 있다.
#   3. seed      : 90-demo-data.sql 을 통째로 실행한다. 멱등이라 몇 번을
#                  돌려도 행이 늘지 않는다.
#
# ── 왜 preflight 가 필요한가 ─────────────────────────────────────────────
# 시드가 깨지는 실제 원인은 데이터 중복이 아니라 엔티티 변경이다. 누가
# @Column 이름을 바꾸면 ddl-auto 가 DB 에 새 컬럼을 만들고, 시드 파일은
# 옛 컬럼명을 그대로 들고 있다가 실행 시점에 터진다.
# (실제 사고: "fix: member addresses 컬럼 매핑 불일치로 배송지 등록 500 에러")
# preflight 는 그걸 실행 전에, 어느 컬럼인지까지 짚어서 알려준다.
#
# ── 계정 ────────────────────────────────────────────────────────────────
# 90-demo-data.sql 은 4개 스키마를 한 파일에서 건드린다. 서비스 계정은 자기
# 스키마만 보이므로(db/postgres/00-init.sql) 어느 계정으로도 이 파일을 못
# 돌린다. 그래서 master 계정을 쓴다 - Secrets Manager 에서 읽어 임시 k8s
# Secret 으로 넘기고 끝나면 지운다. 러너 로그에는 값이 안 찍힌다.

on:
  # dev 머지 시 자동. paths 필터가 "시드 파일이 안 바뀌었으면 skip"을 대신한다 -
  # 잡 안에서 검사하면 러너를 띄우고 OIDC 까지 붙은 뒤에 건너뛰게 된다.
  # 여기서 걸러지면 워크플로 자체가 시작하지 않는다.
  push:
    branches: [ dev ]
    paths:
      - "db/postgres/90-demo-data.sql"
      - "db/migrations/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "대상 환경"
        type: choice
        options: [ dev, prod ]
        default: dev
      dry_run:
        description: "preflight 만 돌리고 쓰지 않는다"
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

# push 트리거엔 inputs 가 없다. github.event_name 으로 명시 분기한다 -
# `|| 'dev'` 만 쓰면 나중에 폴백이 바뀔 때 이 갈래를 놓치기 쉽다(main-cd.yml 과 같은 이유).
# concurrency.group 과 jobs.<id>.environment 는 env 컨텍스트를 못 쓰므로
# 이 식을 그대로 반복한다.
concurrency:
  group: db-seed-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  seed:
    name: DB Seed
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
      DEPLOY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
      # 자동 실행(dev 머지)은 바로 반영한다. preflight 가 앞에서 막아주므로
      # 스키마가 어긋난 상태로는 어차피 못 쓴다.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      NS: lion-app
      POD: db-seed-${{ github.run_id }}
      SECRET: db-seed-${{ github.run_id }}
      SEED_FILE: db/postgres/90-demo-data.sql
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: gha-db-seed-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update EKS kubeconfig
        run: aws eks update-kubeconfig --name "${{ vars.EKS_CLUSTER }}" --region "$AWS_REGION"

      # master 자격증명은 러너를 거치지만 어디에도 출력하지 않는다.
      # kubectl create secret 은 --from-literal 값을 stdout 에 안 찍는다.
      - name: Launch psql pod
        run: |
          set -euo pipefail
          ARN="$(aws ssm get-parameter --name "/$DEPLOY_ENV/data/db_master_secret_arn" \
                   --query Parameter.Value --output text --region "$AWS_REGION")"
          JSON="$(aws secretsmanager get-secret-value --secret-id "$ARN" \
                    --query SecretString --output text --region "$AWS_REGION")"
          DB_NAME="$(kubectl get cm -n "$NS" member-config -o jsonpath='{.data.DB_NAME}')"
          [ -n "$DB_NAME" ] || { echo "::error::member-config 에 DB_NAME 이 없다"; exit 1; }

          kubectl create secret generic "$SECRET" -n "$NS" \
            --from-literal=username="$(echo "$JSON" | jq -r .username)" \
            --from-literal=password="$(echo "$JSON" | jq -r .password)" >/dev/null

          cat <<EOF | kubectl apply -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: $POD
            namespace: $NS
            labels: { app: db-seed }
          spec:
            restartPolicy: Never
            containers:
              - name: psql
                image: postgres:16-alpine
                command: ["sleep", "1800"]
                env:
                  - { name: PGHOST, value: "db-primary-service.lion-db.svc.cluster.local" }
                  - { name: PGPORT, value: "5432" }
                  - { name: PGDATABASE, value: "$DB_NAME" }
                  - { name: PGUSER,     valueFrom: { secretKeyRef: { name: $SECRET, key: username } } }
                  - { name: PGPASSWORD, valueFrom: { secretKeyRef: { name: $SECRET, key: password } } }
          EOF
          kubectl wait --for=condition=Ready "pod/$POD" -n "$NS" --timeout=180s

      # ── 1. preflight ──────────────────────────────────────────────────
      # 시드 파일의 INSERT 컬럼 목록 vs 실 DB 컬럼. DB 를 쓰지 않는다.
      - name: Preflight — 스키마 대조
        run: |
          set -euo pipefail

          psql_q() { kubectl exec -i -n "$NS" "$POD" -- psql -At -F'|' -v ON_ERROR_STOP=1 -f -; }

          # 실 DB 의 <스키마>.<테이블>.<컬럼> 전체 목록. pg_catalog 는 권한과
          # 무관하게 다 보이므로 information_schema 처럼 걸러지지 않는다.
          printf "%s\n" "SELECT n.nspname||'.'||c.relname||'.'||a.attname
                         FROM pg_attribute a
                         JOIN pg_class c ON c.oid = a.attrelid
                         JOIN pg_namespace n ON n.oid = c.relnamespace
                         WHERE c.relkind='r' AND a.attnum > 0 AND NOT a.attisdropped
                           AND n.nspname IN ('member_db','catalog_db','order_db','ai_db');" \
            | psql_q > /tmp/live_columns.txt
          echo "실 DB 컬럼 $(wc -l < /tmp/live_columns.txt) 개 수집"

          # 주석을 걷어낸 뒤 INSERT INTO <t> (<컬럼들>) 만 뽑는다. 줄바꿈이
          # 섞여 있어 한 줄로 접고 본다.
          sed 's/--.*$//' "$SEED_FILE" | tr '\n' ' ' \
            | grep -oiE 'INSERT[[:space:]]+INTO[[:space:]]+[a-z_]+\.[a-z_]+[[:space:]]*\([^)]*\)' \
            > /tmp/inserts.txt || true
          echo "시드 INSERT $(wc -l < /tmp/inserts.txt) 건 검사"

          CONFLICT=0
          while read -r stmt; do
            [ -n "$stmt" ] || continue
            table="$(echo "$stmt" | grep -oiE '[a-z_]+\.[a-z_]+' | head -1)"

            if ! grep -q "^${table}\." /tmp/live_columns.txt; then
              echo "::error file=$SEED_FILE::CONFLICT - 테이블이 DB 에 없다: $table"
              CONFLICT=1
              continue
            fi

            cols="$(echo "$stmt" | sed 's/.*(//; s/).*//' | tr ',' '\n' | tr -d ' ')"
            for col in $cols; do
              if ! grep -qx "${table}.${col}" /tmp/live_columns.txt; then
                echo "::error file=$SEED_FILE::CONFLICT - 컬럼이 DB 에 없다: ${table}.${col}"
                echo "    → 엔티티에서 이름이 바뀌었을 가능성이 높다. 실제 컬럼:"
                grep "^${table}\." /tmp/live_columns.txt | sed "s/^${table}\./      /"
                CONFLICT=1
              fi
            done
          done < /tmp/inserts.txt

          # 시드 파일은 "추가만" 이 정의다. 여기서 막는 이유는 이 파일이
          # master(bookadmin, SUPERUSER)로 실행되기 때문이다 - 스키마 권한이
          # 안 걸리므로 DB 가 걸러주지 않는다. 리뷰를 통과한 한 줄이 그대로 나간다.
          #
          # db/migrations/ 에는 이 검사를 걸지 않는다. 거기는 애초에 구조를
          # 바꾸라고 만든 자리고, 컬럼 정리(ALTER TABLE DROP COLUMN)는 정당한 작업이다.
          if sed 's/--.*$//' "$SEED_FILE" \
               | grep -Einq 'DROP[[:space:]]+(TABLE|SCHEMA|DATABASE)|TRUNCATE|DELETE[[:space:]]+FROM'; then
            echo "::error file=$SEED_FILE::시드 파일에 파괴적 구문이 있다. 이 파일은 추가만 한다."
            sed 's/--.*$//' "$SEED_FILE" \
              | grep -Ein 'DROP[[:space:]]+(TABLE|SCHEMA|DATABASE)|TRUNCATE|DELETE[[:space:]]+FROM' \
              | sed 's/^/    /'
            echo "    → 기존 행을 지워야 하면 db/migrations/ 로 옮기고 리뷰를 받아라."
            CONFLICT=1
          fi

          if [ "$CONFLICT" -ne 0 ]; then
            echo "::error::preflight 실패로 중단한다. DB 에는 아무것도 쓰지 않았다."
            echo "구조 변경이 필요하면 db/migrations/V\$(date +%Y%m%d%H%M%S)__설명.sql 을 추가해라."
            exit 1
          fi
          echo "✓ 스키마 일치 / 파괴적 구문 없음"

      # ── 2. migrate ────────────────────────────────────────────────────
      # 구조 변경 전용. 파일당 한 번만 돈다. 평소엔 비어 있다.
      - name: Migrate — 구조 변경분
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          psql_run() { kubectl exec -i -n "$NS" "$POD" -- psql -v ON_ERROR_STOP=1 -f -; }

          if ! ls db/migrations/V*.sql >/dev/null 2>&1; then
            echo "구조 변경분 없음"
            exit 0
          fi

          # master 계정이라 스키마를 안 가린다. 이력은 한 곳에 모은다.
          printf "%s\n" "CREATE TABLE IF NOT EXISTS public.schema_migrations (
            version TEXT PRIMARY KEY, filename TEXT NOT NULL,
            applied_at TIMESTAMPTZ NOT NULL DEFAULT now());" | psql_run -q

          applied="$(printf 'SELECT version FROM public.schema_migrations;\n' \
            | kubectl exec -i -n "$NS" "$POD" -- psql -At -f - | tr -d '\r')"

          for file in $(ls db/migrations/V*.sql | sort); do
            base="$(basename "$file")"
            version="${base%%__*}"
            if echo "$applied" | grep -qx "$version"; then
              echo "  = $base (적용됨)"
              continue
            fi
            echo "  + $base"
            {
              echo "BEGIN;"
              cat "$file"
              echo "INSERT INTO public.schema_migrations (version, filename)"
              echo "VALUES ('$version', '$base');"
              echo "COMMIT;"
            } | psql_run
          done

      # ── 3. seed ───────────────────────────────────────────────────────
      - name: Seed — 90-demo-data.sql
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          # -q 를 안 쓴다. "INSERT 0 2" 같은 태그가 남아야 이번에 몇 건이
          # 실제로 들어갔는지(=나머지는 이미 있었는지) 눈으로 확인된다.
          kubectl exec -i -n "$NS" "$POD" -- psql -v ON_ERROR_STOP=1 -f - < "$SEED_FILE"

      - name: dry-run 안내
        if: env.DRY_RUN == 'true'
        run: echo "::notice::preflight 만 돌았다. 반영하려면 dry_run 을 끄고 다시 실행해라."

      - name: Cleanup
        if: always()
        run: |
          kubectl delete pod    -n "$NS" "$POD"    --ignore-not-found --wait=false
          kubectl delete secret -n "$NS" "$SECRET" --ignore-not-found
