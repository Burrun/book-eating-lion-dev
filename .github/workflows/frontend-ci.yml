name: Frontend CI

on:
  pull_request:
    branches: [ "main", "dev" ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches: [ "main" ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ./frontend

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 아래 "변경된 파일만" 포맷 검사가 origin/main 과 비교하려면 전체 히스토리가 필요하다.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # 기존 코드를 한 번에 재포맷하지 않기 위해 PR 대상 브랜치 이후 변경된 파일만 검사한다.
      # (backend spotless 의 ratchetFrom 과 같은 기준)
      #
      # 🔴 기준을 origin/main 으로 고정하면 안 된다. 이 워크플로는 main/dev 양쪽 PR 에서
      # 도는데, dev 는 main 보다 한참 앞서 있다(2026-08-26 기준 236커밋). 그 상태로
      # main 을 기준 삼으면 dev 대상 PR 이 "main 이후 dev 에 머지된 남의 파일"까지 전부
      # 검사한다 - 실제로 프론트 2개 파일만 바꾼 PR 이 140개를 검사하고, 그 중 남이
      # 머지해둔 미포맷 파일 2개 때문에 떨어졌다.
      - name: Check formatting (Prettier, 변경된 파일만)
        env:
          # pull_request 면 대상 브랜치명, push(main) 이면 비어 있어 main 으로 떨어진다.
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          FILES=$(git diff --name-only --diff-filter=ACMR "origin/$BASE_REF...HEAD" -- . | sed 's|^frontend/||')
          if [ -z "$FILES" ]; then
            echo "변경된 프론트엔드 파일 없음 - 건너뜀"
            exit 0
          fi
          echo "검사 대상:"; echo "$FILES"
          npx prettier --check --ignore-unknown $FILES

      - name: Lint (ESLint)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: ignore
