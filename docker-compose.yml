# =============================================================================
# 로컬 개발 스택 — MSA 전환 후
#
# 운영의 구조를 그대로 축소해 놓았다:
#   postgres-a (클러스터 A) : catalog_db / order_db / member_db 3개 스키마
#   postgres-b (클러스터 B) : ai_db + pgvector
#   backend 4개             : catalog / order / member / ai
#
# 계정도 운영과 같이 나눠 놓았다. 그래서 로컬에서도 "남의 스키마 조회 →
# 권한 에러"가 재현된다. 경계 위반이 배포 후가 아니라 개발 중에 드러난다.
#
# db/cluster-*/01~03 (목표 스키마)는 마운트하지 않는다. 엔티티와 아직 정렬돼
# 있지 않아서이며, 로컬 스키마는 ddl-auto: update + 90-demo-data.sql 이 만든다.
# (전환 전에도 schema.sql 대신 데모 데이터만 넣었던 것과 같은 이유다)
# =============================================================================
services:
  postgres-a:
    image: postgres:16-alpine
    container_name: msa-postgres-a
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: bookdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rootpassword
      # 한글 정렬/비교를 위해 UTF-8 로 초기화한다.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres-a-data:/var/lib/postgresql/data
      # 볼륨이 비어 있을 때(최초 기동)만 실행된다. 파일명 순서대로 적용된다.
      - ./db/cluster-a/00-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      - ./db/cluster-a/90-demo-data.sql:/docker-entrypoint-initdb.d/90-demo-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bookdb"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  postgres-b:
    # pgvector 가 미리 설치된 이미지. 클러스터 A 와 이미지가 다른 이유다.
    image: pgvector/pgvector:pg16
    container_name: msa-postgres-b
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: aidb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres-b-data:/var/lib/postgresql/data
      - ./db/cluster-b/00-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      - ./db/cluster-b/90-demo-data.sql:/docker-entrypoint-initdb.d/90-demo-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aidb"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: msa-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  catalog:
    build:
      context: ./backend
      dockerfile: apps/catalog-api/Dockerfile
    container_name: msa-catalog
    ports:
      - "8081:8080"
    depends_on:
      postgres-a:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-a:5432/bookdb?currentSchema=catalog_db
      REDIS_HOST: redis
      # 재고 조회 대상. order 가 죽어 있어도 catalog 는 뜬다(fallback).
      SERVICES_ORDER_URL: http://order:8080

  order:
    build:
      context: ./backend
      dockerfile: apps/order-api/Dockerfile
    container_name: msa-order
    ports:
      - "8082:8080"
    depends_on:
      postgres-a:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-a:5432/bookdb?currentSchema=order_db
      REDIS_HOST: redis

  member:
    build:
      context: ./backend
      dockerfile: apps/member-api/Dockerfile
    container_name: msa-member
    ports:
      - "8083:8080"
    depends_on:
      postgres-a:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-a:5432/bookdb?currentSchema=member_db
      REDIS_HOST: redis

  ai:
    build:
      context: ./backend
      dockerfile: apps/ai-api/Dockerfile
    container_name: msa-ai
    ports:
      - "8084:8080"
    depends_on:
      postgres-b:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: 8080
      # 클러스터 B 다. 다른 서비스와 공유하는 DB 가 없다.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-b:5432/aidb?currentSchema=ai_db
      REDIS_HOST: redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: msa-frontend
    depends_on:
      - catalog

  nginx:
    image: nginx:alpine
    container_name: msa-nginx
    ports:
      - "80:80"
    volumes:
      # default.conf 가 proxy-headers.inc 를 include 하므로 디렉터리째 마운트한다.
      - ./nginx:/etc/nginx/conf.d:ro
    depends_on:
      - frontend
      - catalog
      - order
      - member
      - ai

volumes:
  postgres-a-data:
  postgres-b-data:
