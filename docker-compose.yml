# =============================================================================
# 로컬 개발 스택 — MSA 전환 후
#
# 운영의 구조를 그대로 축소해 놓았다:
#   postgres  : catalog_db / order_db / member_db / ai_db  4개 스키마
#   backend 4개 : catalog / order / member / ai
#
# 클러스터는 1개다. 원래 ai_db 만 pgvector 때문에 따로 뺐었는데, 벡터를 전부
# S3 Vectors 로 옮기면서 그 이유가 사라졌다.
#
# 계정은 운영과 같이 나눠 놓았다. 그래서 로컬에서도 "남의 스키마 조회 →
# 권한 에러"가 재현된다. 경계 위반이 배포 후가 아니라 개발 중에 드러난다.
# 격리를 만드는 건 클러스터가 아니라 이 계정 분리다.
#
# db/postgres/01~04 (목표 스키마)는 마운트하지 않는다. 엔티티와 아직 정렬돼
# 있지 않아서이며, 로컬 스키마는 ddl-auto: update + 90-demo-data.sql 이 만든다.
# =============================================================================
services:
  postgres:
    image: postgres:16-alpine
    container_name: msa-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: bookdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rootpassword
      # 한글 정렬/비교를 위해 UTF-8 로 초기화한다.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # 볼륨이 비어 있을 때(최초 기동)만 실행된다. 파일명 순서대로 적용된다.
      - ./db/postgres/00-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      - ./db/postgres/90-demo-data.sql:/docker-entrypoint-initdb.d/90-demo-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bookdb"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: msa-redis
    # noeviction 인 이유: 이 Redis 에는 재고 Redlock, 이벤트 Stream, 일일 쿼터가
    # 들어 있고 전부 조용히 사라지면 안 되는 것들이다. 락이 evict 되면 오버셀링이
    # 나는데 아무도 모른다. 넘치면 에러가 나는 쪽이 낫다(fail-closed).
    # 운영 ElastiCache 파라미터 그룹도 같은 값이어야 한다 —
    # 로컬만 다르면 "로컬은 되는데 운영은 안 되는" 상황이 생긴다.
    command: redis-server --maxmemory 256mb --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  catalog:
    build:
      context: ./backend
      dockerfile: apps/catalog-api/Dockerfile
    container_name: msa-catalog
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bookdb?currentSchema=catalog_db
      REDIS_HOST: redis
      AWS_COGNITO_REGION: ${AWS_COGNITO_REGION:-ap-northeast-2}
      AWS_COGNITO_USER_POOL_ID: ${AWS_COGNITO_USER_POOL_ID:-local_dummy_pool}
      # 재고 조회 대상. order 가 죽어 있어도 catalog 는 뜬다(fallback).
      SERVICES_ORDER_URL: http://order:8080
      SERVICES_MEMBER_URL: http://member:8080
      SERVICES_AI_URL: http://ai:8080
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      SES_FROM_ADDRESS: ${SES_FROM_ADDRESS:-no-reply@example.com}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      # 신간 등록(EPUB) 발행 큐. ai 서비스가 같은 이름의 환경변수로 소비한다(book-ingest-queue).
      SQS_INGEST_QUEUE_URL: ${SQS_INGEST_QUEUE_URL:-}

  order:
    build:
      context: ./backend
      dockerfile: apps/order-api/Dockerfile
    container_name: msa-order
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bookdb?currentSchema=order_db
      REDIS_HOST: redis
      # 가상카드 한도 차감/복구 대상. 컨테이너 네트워크에서는 서비스명으로 붙는다
      # (기본값 localhost:8083 은 컨테이너 안에서는 order 자기 자신을 가리켜 틀린다).
      SERVICES_MEMBER_URL: http://member:8080
      # 주문 생성 시 도서 가격/재고를 조회한다(CatalogClient). 위와 같은 이유로 필요하다 —
      # 기본값 localhost:8081 은 order 컨테이너 자기 자신이라 연결이 거부되고,
      # CatalogClientFallback 이 삼켜서 5xx 대신 "책이 없다"로 조용히 실패한다.
      SERVICES_CATALOG_URL: http://catalog:8080
      # 카카오페이 샌드박스 — .env 의 값을 docker compose 가 그대로 치환해 넘긴다.
      KAKAOPAY_SECRET_KEY: ${KAKAOPAY_SECRET_KEY}
      # JWT 검증. 이게 없으면 issuer 가 local_dummy_pool 로 잡혀 토큰 검증이
      # "Unable to resolve the Configuration with the provided Issuer" 로 실패하고,
      # 인증이 필요한 경로가 401/500 으로 흩어진다. 네 서비스가 같은 풀을 봐야 한다.
      AWS_COGNITO_REGION: ${AWS_COGNITO_REGION:-ap-northeast-2}
      AWS_COGNITO_USER_POOL_ID: ${AWS_COGNITO_USER_POOL_ID:-local_dummy_pool}

  member:
    build:
      context: ./backend
      dockerfile: apps/member-api/Dockerfile
    container_name: msa-member
    ports:
      - "8083:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bookdb?currentSchema=member_db
      REDIS_HOST: redis
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      AWS_COGNITO_REGION: ${AWS_COGNITO_REGION:-ap-northeast-2}
      AWS_COGNITO_USER_POOL_ID: ${AWS_COGNITO_USER_POOL_ID:-local_dummy_pool}
      AWS_COGNITO_CLIENT_ID: ${AWS_COGNITO_CLIENT_ID:-local_dummy_client_id}
      AWS_COGNITO_CLIENT_SECRET: ${AWS_COGNITO_CLIENT_SECRET:-}

  ai:
    build:
      context: ./backend
      dockerfile: apps/ai-api/Dockerfile
    container_name: msa-ai
    ports:
      - "8084:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: 8080
      # 같은 클러스터의 다른 스키마다. 격리는 ai_svc 계정 권한이 만든다.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bookdb?currentSchema=ai_db
      REDIS_HOST: redis
      # JWT 검증용. 다른 세 서비스와 같은 사용자 풀을 봐야 같은 토큰이 통한다.
      AWS_COGNITO_REGION: ${AWS_COGNITO_REGION:-ap-northeast-2}
      AWS_COGNITO_USER_POOL_ID: ${AWS_COGNITO_USER_POOL_ID:-local_dummy_pool}

      # --- AWS 자격증명 -------------------------------------------------------
      # 배포 전 테스트 단계라 로컬에서도 실제 AWS 를 탄다. 운영에서는 IRSA
      # (AWS_WEB_IDENTITY_TOKEN_FILE)가 대신하므로 이 네 개는 파드에 들어가지 않는다.
      # SDK 기본 자격증명 체인이 이 환경변수를 직접 읽는다 — Spring 설정이 아니다.
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      # 임시 자격증명(STS/AssumeRole)일 때만 채운다. 장기 키면 빈 값이어야 한다.
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}

      # --- Bedrock / S3 Vectors (실제 호출 = 요청마다 과금) --------------------
      # 스텁 구현은 없다(83a0818 에서 제거). clients 는 bedrock 이 유일한 값이다.
      # 기동 시 S3 Vectors GetIndex 로 차원·거리척도·비필터키를 대조하므로,
      # 버킷이 없거나 자격증명이 틀리면 이 컨테이너는 여기서 죽는다.
      AI_CLIENTS: ${AI_CLIENTS:-bedrock}
      AWS_BEDROCK_REGION: ${AWS_BEDROCK_REGION:-ap-northeast-2}
      AI_VECTOR_BUCKET: ${AI_VECTOR_BUCKET}
      # 인덱스명(wiki-v1)은 일부러 환경변수가 아니다 — application.yml 에 박혀 있다.
      # 임베딩 모델·차원과 짝이라 바꾸면 전건 재임베딩 + 인덱스 재생성이다.
      AI_EPUB_BUCKET: ${AI_EPUB_BUCKET:-}
      # 재배포 없이 흔들어보는 값들. 과금 방어선(quota)은 데모 중에 올릴 수 있어야 한다.
      AI_LLM_MODEL: "${AI_LLM_MODEL:-global.anthropic.claude-haiku-4-5-20251001-v1:0}"
      AI_MAX_DISTANCE: ${AI_MAX_DISTANCE:-0.75}
      AI_DAILY_QUOTA: ${AI_DAILY_QUOTA:-50}

      # --- SQS 수신 -----------------------------------------------------------
      # 배포 전 테스트 단계라 기본값이 true 다. 배포된 컨슈머가 뜨기 시작하면
      # SQS 는 메시지 하나를 컨슈머 "하나"에게만 주므로 로컬과 배포본이 경쟁한다 —
      # 그 시점에는 false 로 내리거나 테스트용 큐를 따로 둘 것.
      #
      # enabled 가 true 인데 URL 이 비면 기동은 되고 워커만 조용히 안 돈다.
      # "왜 메시지가 안 처리되지"로만 보이므로 둘을 같이 관리할 것.
      #
      # 큐는 콘솔에서 수작업으로 만들었고 IaC 가 없다. 이 블록이 유일한 기록이다.
      #   book-ingest-queue    (가시성 300s) → book-ingest-dlq    maxReceiveCount=3
      #   book-purchase-queue  (가시성  30s) → book-purchase-dlq  maxReceiveCount=5
      # 재시도 횟수가 다른 이유: 인제스트는 1회 실패마다 최대 500청크를 재임베딩해
      # 비용이 붙고, 구매는 DB 한 줄이라 싸고 유실이 치명적이다.
      SQS_INGEST_ENABLED: ${SQS_INGEST_ENABLED:-true}
      SQS_INGEST_QUEUE_URL: ${SQS_INGEST_QUEUE_URL:-}
      SQS_PURCHASE_ENABLED: ${SQS_PURCHASE_ENABLED:-true}
      SQS_PURCHASE_QUEUE_URL: ${SQS_PURCHASE_QUEUE_URL:-}

      # --- 상담 채팅 -----------------------------------------------------------
      # 브라우저는 WebSocket 에 CORS preflight 를 보내지 않아 Ingress CORS 가 안 먹는다.
      # 이 값이 유일한 Origin 방어선이다. prod 에서는 반드시 좁힐 것.
      CHAT_ALLOWED_ORIGINS: ${CHAT_ALLOWED_ORIGINS:-*}
      # 의미 기반 추천(dev) 인덱스명. 벡터 버킷과 마찬가지로 재생성 시 새 이름으로 컷오버한다.
      AI_RECOMMENDATION_VECTOR_INDEX: ${AI_RECOMMENDATION_VECTOR_INDEX:-recommendation-books-v1}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: msa-frontend
    depends_on:
      - catalog

  nginx:
    image: nginx:alpine
    container_name: msa-nginx
    # 호스트 80 은 다른 스택(caddy 등)이 이미 쓰고 있어 8080 으로 낸다.
    # 컨테이너 안쪽은 그대로 80 이므로 nginx/default.conf 는 손댈 필요 없다.
    ports:
      - "8080:80"
    volumes:
      # default.conf 가 proxy-headers.inc 를 include 하므로 디렉터리째 마운트한다.
      - ./nginx:/etc/nginx/conf.d:ro
    depends_on:
      - frontend
      - catalog
      - order
      - member
      - ai

volumes:
  postgres-data:
