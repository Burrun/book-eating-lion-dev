# =============================================================================
# 로컬 개발 스택 — MSA 전환 후
#
# 운영의 구조를 그대로 축소해 놓았다:
#   postgres  : catalog_db / order_db / member_db / ai_db  4개 스키마
#   backend 4개 : catalog / order / member / ai
#
# 클러스터는 1개다. 원래 ai_db 만 pgvector 때문에 따로 뺐었는데, 벡터를 전부
# S3 Vectors 로 옮기면서 그 이유가 사라졌다.
#
# 계정은 운영과 같이 나눠 놓았다. 그래서 로컬에서도 "남의 스키마 조회 →
# 권한 에러"가 재현된다. 경계 위반이 배포 후가 아니라 개발 중에 드러난다.
# 격리를 만드는 건 클러스터가 아니라 이 계정 분리다.
#
# db/postgres/01~04 (목표 스키마)는 마운트하지 않는다. 엔티티와 아직 정렬돼
# 있지 않아서이며, 로컬 스키마는 ddl-auto: update + 90-demo-data.sql 이 만든다.
# =============================================================================
services:
  postgres:
    image: postgres:16-alpine
    container_name: msa-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: bookdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rootpassword
      # 한글 정렬/비교를 위해 UTF-8 로 초기화한다.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # 볼륨이 비어 있을 때(최초 기동)만 실행된다. 파일명 순서대로 적용된다.
      - ./db/postgres/00-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      - ./db/postgres/90-demo-data.sql:/docker-entrypoint-initdb.d/90-demo-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bookdb"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: msa-redis
    # noeviction 인 이유: 이 Redis 에는 재고 Redlock, 이벤트 Stream, 일일 쿼터가
    # 들어 있고 전부 조용히 사라지면 안 되는 것들이다. 락이 evict 되면 오버셀링이
    # 나는데 아무도 모른다. 넘치면 에러가 나는 쪽이 낫다(fail-closed).
    # 운영 ElastiCache 파라미터 그룹도 같은 값이어야 한다 —
    # 로컬만 다르면 "로컬은 되는데 운영은 안 되는" 상황이 생긴다.
    command: redis-server --maxmemory 256mb --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  catalog:
    build:
      context: ./backend
      dockerfile: apps/catalog-api/Dockerfile
    container_name: msa-catalog
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bookdb?currentSchema=catalog_db
      REDIS_HOST: redis
      AWS_COGNITO_REGION: ${AWS_COGNITO_REGION:-ap-northeast-2}
      AWS_COGNITO_USER_POOL_ID: ${AWS_COGNITO_USER_POOL_ID:-local_dummy_pool}
      # 재고 조회 대상. order 가 죽어 있어도 catalog 는 뜬다(fallback).
      SERVICES_ORDER_URL: http://order:8080
      SERVICES_MEMBER_URL: http://member:8080
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      SES_FROM_ADDRESS: ${SES_FROM_ADDRESS:-no-reply@example.com}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}

  order:
    build:
      context: ./backend
      dockerfile: apps/order-api/Dockerfile
    container_name: msa-order
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bookdb?currentSchema=order_db
      REDIS_HOST: redis
      # 가상카드 한도 차감/복구 대상. 컨테이너 네트워크에서는 서비스명으로 붙는다
      # (기본값 localhost:8083 은 컨테이너 안에서는 order 자기 자신을 가리켜 틀린다).
      SERVICES_MEMBER_URL: http://member:8080
      # 카카오페이 샌드박스 — .env 의 값을 docker compose 가 그대로 치환해 넘긴다.
      KAKAOPAY_SECRET_KEY: ${KAKAOPAY_SECRET_KEY}

  member:
    build:
      context: ./backend
      dockerfile: apps/member-api/Dockerfile
    container_name: msa-member
    ports:
      - "8083:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bookdb?currentSchema=member_db
      REDIS_HOST: redis
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      AWS_COGNITO_REGION: ${AWS_COGNITO_REGION:-ap-northeast-2}
      AWS_COGNITO_USER_POOL_ID: ${AWS_COGNITO_USER_POOL_ID:-local_dummy_pool}
      AWS_COGNITO_CLIENT_ID: ${AWS_COGNITO_CLIENT_ID:-local_dummy_client_id}
      AWS_COGNITO_CLIENT_SECRET: ${AWS_COGNITO_CLIENT_SECRET:-}

  ai:
    build:
      context: ./backend
      dockerfile: apps/ai-api/Dockerfile
    container_name: msa-ai
    ports:
      - "8084:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: 8080
      # 같은 클러스터의 다른 스키마다. 격리는 ai_svc 계정 권한이 만든다.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bookdb?currentSchema=ai_db
      REDIS_HOST: redis
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: msa-frontend
    depends_on:
      - catalog

  nginx:
    image: nginx:alpine
    container_name: msa-nginx
    ports:
      - "80:80"
    volumes:
      # default.conf 가 proxy-headers.inc 를 include 하므로 디렉터리째 마운트한다.
      - ./nginx:/etc/nginx/conf.d:ro
    depends_on:
      - frontend
      - catalog
      - order
      - member
      - ai

volumes:
  postgres-data:
