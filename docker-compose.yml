services:
  mysql:
    image: mysql:8.0
    container_name: final-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: bookdb
      MYSQL_USER: devuser
      MYSQL_PASSWORD: devpassword
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: final-redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: apps/api/Dockerfile
    container_name: final-backend
    ports:
      - "8080:8080"
    depends_on:
      - mysql
      - redis
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/bookdb?useSSL=false&allowPublicKeyRetrieval=true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: final-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql-data:
